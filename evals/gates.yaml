# 採点性能の合格基準。設計方針 §9.2 Phase 1 の数値をそのまま置いてある。
#
# これは「採点運用の可否」ではなくプロジェクトの品質基準。採点は
# この判定に依存しない（ADR 0007）。
#
# ここを緩めるのは、緩める理由を ADR に書いてからにすること。
# 「今の実装だと届かないから下げる」は基準ではない。

poc: Phase 1（採点性能の測定）

# これを下回る標本数では、どの指標も判定しない（NOT_MEASURED）。
# 3 件で κ = 1.0 が出ても合格ではない。
min_sample_size: 30

criteria:
  # テスト実行で確定する観点。AI は関与しないので基準を課さない。
  # correctness: {}

  # AI が担当する観点。ここが PoC-1 の本題。
  readability:
    min_cohen_kappa: 0.65
    min_quadratic_weighted_kappa: 0.60

# 自動確定したのに教員の修正が必要だった割合。最も重い指標。
max_miss_rate: 0.05

# レビューに回る割合。高すぎると教員の負担が減らない。
max_review_rate: 0.30

# 同一提出を繰り返し採点したときの総合点の標準偏差（満点比）。
max_score_stdev: 0.05
