# デモコースの定義（#194）
#
# **リセットが戻すのはこのファイルの中身である。** `aijudge-admin demo reset`
# はコースを消して作り直し、ここから問題セットを入れ直す ── だから「当初の
# 状態」がコードではなくファイルに書いてある必要がある。
#
# **2 種類を 1 コースに置く。** これができるのは #195 で採点のプロファイルを
# 課題側から取るようにしたためで、それ以前はコースを割るしかなかった。
#
# | 課題 | プロファイル | 見せたいこと |
# |---|---|---|
# | C 言語 | `cs_lang_c_intro` | テスト実行で即座に判定が出る |
# | レポート | `report_ja` | AI が根拠を添えて判定する |
#
# **画像の課題（手書きのメモ）は外した**（2026-09-24）。総合点が保留になる
# 様子を見せる課題だったが、お試しで触る人には「採点されない課題」にしか
# 見えなかった。
#
# **どちらもブラウザのエディタとファイルの両方で出せる**（`units` の
# `answer_mode: editor`・ADR 0026）。エディタの課題にもファイルの提出欄は残る。
#
# KC は `demo` 名前空間（`subjects/kc/demo.yaml`）。**`cs` を使わない** ──
# 除外が漏れたときに本物の習熟度へ効かないようにするため。

course:
  code: demo
  title: お試しコース
  term: 2026-前期
  # コースのプロファイルは**語彙と既定**を決める（ADR 0018）。採点は課題側。
  subject_profile: demo_image
  description: >-
    aiJudge を触って試すためのコースです。ログインすれば誰でも入れます。
    **ここでの提出は、成績にも学習履歴にも残りません。**
    プログラムとレポートの 2 種類を置いてあり、それぞれ採点のされ方が
    違います ── テストで機械が判定するものと、AI が根拠を添えて判定するもの。
    どちらもブラウザのエディタで書いても、ファイルで出しても構いません。

# 問題セットの値（ADR 0026）。回の全課題に入る。お試しなので補完も入れる。
units:
  demo01: {answer_mode: editor, editor_completion: true}
  # **試験を想定した回**（2026-10-01）。エディタだけで答え、学内からだけ受け付ける
  # ── 本番の試験と同じ組み合わせを、成績に残らない場所で試せるようにする。
  # 補完は試験の既定どおり切る。採点開始は入れない（お試しなので結果はすぐ返す）。
  # `campus_only` は v1.39.3 から書ける。画面で切り替えるだけだと `demo reset` の
  # たびに外れる。
  demo02: {answer_mode: editor, file_upload: false, editor_completion: false, campus_only: true}
  # **文系学部の科目を想定した、学内限定の回**（2026-10-02）。記述だけで答え、プログラムは
  # 出てこない ── 経済学と社会学の短い記述 2 問。demo02 と同じ組み合わせ（エディタだけ・
  # 補完なし・学内限定）で、AI が根拠を添えて判定する様子を見せる。
  # **受け付ける範囲は定義に書けない**（範囲はテナント固有）。`demo reset` のあとは
  # 「選ぶ前に学内限定にした回」として、登録された全範囲から受け付ける。範囲を絞って
  # 見せたいときは、問題セットの画面で選ぶ。
  demo03: {answer_mode: editor, file_upload: false, editor_completion: false, campus_only: true}

tasks:
  - key: d2-code
    unit: demo01
    position: 1
    title: 最大値を求める
    subject_profile: cs_lang_c_intro
    # エディタで書けるのは `.c`。ファイルでも同じ形式で出す。
    accepted_suffixes: [.c]
    knowledge_components:
      - demo.trial.code.read_input
      - demo.trial.code.loop
      - demo.trial.code.compare
      - demo.trial.code.boundary
    statement: |
      ## [必須] 最大値を求める ##

      整数の並びを読み込み、その**最大値**を出力してください。

      ### 入力

      1 行目に要素数 `n`、2 行目に `n` 個の整数が空白区切りで与えられます。

      ### 出力

      最大値を 1 行で出力してください。

      ```
      入力
      5
      3 -1 12 8 12

      出力
      12
      ```

      ### 条件

      - `n` は 1 以上 128 以下です

      ### 見てほしいこと

      提出すると**すぐに**テスト実行の結果が出ます。そのあと数十秒して、
      AI が「読みやすさ」の判定を根拠付きで返します ── 決定的な判定と
      AI の判定が別の速さで届くのが分かるはずです。

      エディタでは「実行」で公開のサンプルを試してから提出できます。
    # **観点を明示する**（2026-09-24）。`readability_weight` が作る汎用の
    # 読みやすさ観点は「変数名が役割を表しているか」を厳しく読み、`max` の
    # ような慣用の名前まで減点していた ── 数行の問題には合わない。短い
    # プログラムに合う書き方にし、重みも 0.3 から 0.2 に下げた。
    #
    # もとの条件「標準ライブラリの最大値関数は使わないこと」も外した。C の
    # 標準ライブラリに整数の最大値関数は無く、AI が変数名 `max` をその違反と
    # 読む余地だけを作っていた。
    criteria:
      - code: correctness
        title: 出力の正しさ
        description: 与えられた入力に対して仕様どおりの出力を返すか。テスト実行で判定する。
        weight: 0.8
        evaluator: code_test_runner
        levels:
          - {level: 0, label: 未達, descriptor: ほとんど正しく動作しない, score_ratio: 0.0}
          - {level: 1, label: 一部, descriptor: 一部のケースで正しい, score_ratio: 0.34}
          - {level: 2, label: 概ね, descriptor: 大半のケースで正しい, score_ratio: 0.67}
          - {level: 3, label: 達成, descriptor: すべてのケースで正しい, score_ratio: 1.0}
      - code: readability
        title: 読みやすさ
        # **書き方の型を名指しで認める**（2026-09-24 実測）。「max は許す」だけでは
        # 足りず、slab-llm（gemma4:e4b）は先頭の要素を初期値にして残りを比べる
        # 定番の書き方を「読み込みの重複と誤り」と読んで段階 1 にした。正しさは
        # テストが見るので、ここでは型の好みを問わない。
        description: >-
          字下げが揃っていて、処理の流れ（読み込み → 比較 → 出力）が追えるか。
          数行のプログラムなので、n・i・max・x のような慣用の短い名前で十分であり、
          名前の長さや英単語かどうかでは減点しない。
          最初の要素を読んで初期値にしてから残りをループで比べる書き方も、
          全要素をループの中で読む書き方も、どちらも素直な書き方として同じに扱う。
          問題にするのは、役割と食い違う名前（最大値を入れる変数が min など）と、
          同じ処理をほぼそのまま何度も書き写している重複だけである。
          出力の正しさはこの観点では評価しない（テストが判定する）。
        weight: 0.2
        levels:
          - {level: 0, label: 未達, descriptor: 字下げが崩れていて流れが追えない, score_ratio: 0.0}
          - {level: 1, label: 一部, descriptor: 流れは追えるが、役割と食い違う名前か、同じ処理の書き写しがある, score_ratio: 0.5}
          - {level: 2, label: 十分, descriptor: 字下げが揃い、流れが追える（書き方の型は問わない）, score_ratio: 1.0}
    test_cases:
      # `example` は問題文の例と同じなので見せる（エディタの「公開サンプル」に出る）。
      - {name: example, input: "5\n3 -1 12 8 12\n", expected: "12\n", hidden: false}
      - {name: single, input: "1\n7\n", expected: "7\n"}
      - {name: negative, input: "3\n-5 -2 -9\n", expected: "-2\n"}
      - {name: first, input: "4\n9 1 2 3\n", expected: "9\n"}

  - key: d3-report
    unit: demo01
    position: 2
    title: 使ってみた感想を書く
    subject_profile: report_ja
    # エディタでもファイルでも `.md`（テキスト）。`.txt` は提出形式の表に無い。
    accepted_suffixes: [.md]
    knowledge_components:
      - demo.trial.writing.structure
      - demo.trial.writing.evidence
      - demo.trial.writing.conciseness
    statement: |
      ## [必須] 使ってみた感想を書く ##

      このお試しコースを触ってみた感想を、**100 字程度**で書いて提出して
      ください。

      ### 書いてほしいこと

      - 何を試したか
      - 良かった点か、分かりにくかった点を 1 つ
      - そう思った理由（1 文でよい）

      ### 見てほしいこと

      AI が**根拠を添えて**判定します。「よく書けている」ではなく「どこが
      どうだから、この段階」という形で返ります ── 点だけを返さない、という
      設計の実物です。
    # **100 字で書ける観点にする**（2026-09-24）。もとは 400 字の感想文に
    # 構成・根拠・簡潔さの 3 観点を当てていた。100 字では「構成」を問う余地が
    # 無いので、何を書いたか・理由があるか・字数の 3 つにした。いずれも AI が
    # 本文を引用して判定できる。
    criteria:
      - code: content
        title: 試したことと感想
        description: 何を試したかと、良かった点または分かりにくかった点が書かれているか。
        weight: 0.4
        levels:
          - {level: 0, label: 未達, descriptor: 試したことも感想も読み取れない, score_ratio: 0.0}
          - {level: 1, label: 一部, descriptor: どちらか一方だけが書かれている, score_ratio: 0.5}
          - {level: 2, label: 十分, descriptor: 試したことと感想の両方が書かれている, score_ratio: 1.0}
      - code: evidence
        title: 理由
        description: 感想に、そう思った理由が添えられているか。具体的なほどよい。
        weight: 0.4
        levels:
          - {level: 0, label: 未達, descriptor: 理由が無い, score_ratio: 0.0}
          - {level: 1, label: 一部, descriptor: 理由が抽象的（「便利だった」など）, score_ratio: 0.5}
          - {level: 2, label: 十分, descriptor: 画面や操作を挙げた具体的な理由がある, score_ratio: 1.0}
      - code: length
        title: 字数
        description: 100 字程度（おおむね 60〜150 字）に収まっているか。
        weight: 0.2
        levels:
          - {level: 0, label: 未達, descriptor: 30 字未満か 300 字を超える, score_ratio: 0.0}
          - {level: 1, label: 一部, descriptor: 60 字未満か 150 字を超える, score_ratio: 0.5}
          - {level: 2, label: 十分, descriptor: おおむね 60〜150 字, score_ratio: 1.0}

  # --- 試験を想定した 2 問（demo02・2026-10-01）---------------------------------
  - key: d4-exam-code
    unit: demo02
    position: 1
    title: 偶数の合計を求める
    subject_profile: cs_network_python
    # エディタだけの回なので、提出形式はエディタで書ける `.py` にする。
    accepted_suffixes: [.py]
    knowledge_components:
      - demo.trial.code.read_input
      - demo.trial.code.loop
      - demo.trial.code.boundary
    statement: |
      ## [試験] 偶数の合計を求める ##

      整数の並びを読み込み、その中の**偶数だけの合計**を出力する
      Python のプログラムを書いてください。

      ### 入力

      1 行目に要素数 `n`、2 行目に `n` 個の整数が空白区切りで与えられます。

      ### 出力

      偶数の合計を 1 行で出力してください。偶数が 1 つも無いときは `0` を出力します。

