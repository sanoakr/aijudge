# レポート課題（日本語）— ネットワーク及び演習の性能評価レポート相当
#
# **この科目を足すためにエンジンは変えていない**（ADR 0002 の検証点）。
# 足したのはこの YAML と、プラグイン 3 つ（正規化器 document_text、
# 決定的評価器 submission_compliance、同 report_structure）である。
# 採点エンジン・コア・提出・レビューのコードは無変更。
#
# 観点は課題ごとに宣言する（`TaskSpec.criteria`）。プログラミング課題の
# 「正しさ＋読みやすさ」は当てはまらず、教員が決めるものだから。
#
# **この設定は `evals/report_ja/` の測定から決めたが、測定用のコードは
# 一切参照していない。** 移すのは知見だけで、ハーネスは本番に入れない
# （ADR 0012）。

name: report_ja
description: 実験レポート。提出の遵守は決定的に、内容は AI とルーブリックで判定する。

input:
  # 手書きは扱わない。PDF/DOCX は文字が埋め込まれたものだけで、
  # スキャン画像の書き起こしは Phase 6（学習者が提出前に確認する流れ）。
  allow_handwriting: false

# **採点の前に本文へ直す**（設計方針 §4 step 1）。しないと AI にバイナリが
# 渡り、字数や節の判定も成立しない。
normalizers:
  - document_text

# 読めば機械的に分かることは決定的側で確定させる（P3）。
#
# **「体裁」は文章の質ではなく事務的な遵守の記録である。** 教員の実採点
# （2023 年度 28 件）と突き合わせると、本文を読んで必須節・字数・数値を
# 見る `report_structure` の完全一致は 42.9% で、提出そのものだけを見る
# `submission_compliance` は 71.4% だった。前者は教員が満点を付けた
# レポートを「節が無い」で減点していた。
#
# `report_structure` を捨てたわけではない。あれが判定しているのは
# **採点に足るか（受理）**であって観点ではない。受理という概念を
# パイプラインがまだ持たないので、いまは採点の経路から外してある。
# 戻すときのために課題の節の対応表を残す:
#
#   sections:
#     目的: [目的, 背景と目的, はじめに]
#     条件: [条件, 実験条件, 実験環境, 環境, 測定条件]
#     方法: [方法, 実験方法, 手順, 測定方法]
#     結果: [結果, 実験結果, 測定結果]
#     考察: [考察, 議論]
#   min_characters: 800
#   min_numbers: 8
deterministic:
  - submission_compliance

# 読解が要る観点だけ AI に残す。ここを空にしても提出の遵守は判定できる
# （= S6 停止時の劣化動作、P2）。
ai_evaluators:
  - rubric_ai_judge

evaluator_options:
  rubric_ai_judge:
    # 自己一貫性のサンプル数。
    #
    # **2 本にしてはいけない。** 2 本では確信度が 1.0 か 0.5 にしかならず、
    # 閾値をどこに置いても「1 つでも割れたら人間」になる（実測でレビュー
    # 行き 37〜58%）。3 本にすると 2 対 1 の多数決が表現できる。
    # レポートは本文が長く 1 回が重いが、ここは削るところではない。
    samples: 3
  submission_compliance:
    # 提出を求める形式。課題文が「提出は PDF」と書いているので、
    # 守ったかどうかを 1 段の不備として数える。
    required_kinds: [pdf]
    # ファイル名の規則。課題文が名前を指定しないなら書かない
    # （書かなければ「見ていない」と理由に残る。黙って満点にはしない）。
    # 2023 年度は 28 件中 9 件が規則に反しているのに減点は 1 件だけで、
    # 課題文に書かれていても採点には効いていなかった。だから既定では見ない。
    # filename_pattern: '^[0-9A-Za-z]+_report\.pdf$'
    #
    # **遅延はここで見ない。** 評価は遅延と独立に行い、遅延は評価の結果に
    # 対する減点として別に持つ。評価器に締切を渡す口は作らない。
    # 実測の 71.4% も遅延を見ない規則の値なので、この設定がそのまま対応する。

aggregation: weighted_sum

review_policy:
  # AI 判定が割れたら人間が見る。**サンプル 3 本に合わせた値**で、
  # 2 対 1（0.67）は通し、3 つに割れた場合（0.33）は通さない。
  # サンプル 2 本のまま 0.8 に置いていたときはレビュー行きが 37% で、
  # §9.1 の 30% を超えていた。閾値ではなくサンプル数の問題だった。
  confidence_below: 0.6
  always_review_if_weight_over: 1.0
  # 合否境界（60%）の前後 10 ポイントは人間が見る。提出の遵守だけで
  # 決まる点数と違い、境界付近の判断は読まないと決められない。
  boundary_score: 0.6
  boundary_margin: 0.10

# 1 回の評価器呼び出しの予算。レポートは本文が長く、LLM の応答も長い。
# サンプルを 3 本に増やしたぶん、1 観点あたりの総時間も増える。
timeout_seconds: 180.0

measurement:
  # レポートは観点が主観的なので、blind 抽出の比率を上げて κ を貯める。
  #
  # **Phase 3 の合格判定はこの抽出に懸かっている**（ADR 0012）。
  # 教員が AI を見ずに付けた段階が 1 観点あたり 30 件貯まるまで、
  # 一致度は `NOT_MEASURED` のままになる。
  blind_sample_rate: 0.2
