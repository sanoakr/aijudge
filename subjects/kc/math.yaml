# 知識要素（KC）の骨格 — 名前空間 `math`
#
# 高校数学（学習指導要領）と大学の数理科学（CUPM）を、**1 つの名前空間**に
# 入れてある。
#
# 階層は 3 段。`名前空間.分野.単位.知識要素`
#
#     math . linear_algebra . eigenvalues . diagonalization   対角化
#     math . precalculus . trigonometric_ratio . law_of_sines 正弦定理
#     math . calculus . integral . ftc                        微分積分学の基本定理
#
# なぜ高校と大学を分けないか
# --------------------------
# 分けるなら第 1 階層は科目名（数学Ⅰ・数学Ⅱ・…）になる。**それをすると
# KC の同一性が告示の版に張り付く。** 行列は昭和 53 年告示の「代数・幾何」から
# 平成 11 年告示の「数学Ｃ」を経て一度消え、平成 30 年告示で「数学Ｃ」の(3)に
# 戻った。複素数平面は「数学Ｂ」→「数学Ⅲ」→「数学Ｃ」と動いている。
# `math.math_c.matrix.rank` は次の改訂で行き場を失い、しかし ID は追記のみ
# （P8）なので消せない ── 引退させた枝と現役の枝が並ぶことになる。
#
# **分野を数学の内容で切れば、行列は告示が動いても
# `math.linear_algebra.matrices_linear_systems.matrix_operations` のまま**で、
# 学習指導要領は「その枝に高校で何を吊るすか」の出典として効く。
#
# 高校と大学が同じ語彙を見ることには、それ自体の利がある ── 大学 1 年の
# 微分積分でつまずいた学生の弱点が `math.precalculus.trigonometric_function.
# addition_theorem` に落ちるとき、それは高校の課題と同じ KC である。
# 名前空間を分けるとこの接続が切れる（名前空間をまたいだ親子関係は
# `KnowledgeComponent` が持たない ── 設計原則 P6 が意図的に先送りしている）。
#
# 第 1 階層はどこから来たか
# ------------------------
# **19 分野は CUPM 2015 の Course Area Study Group そのまま。** MAA の
# Committee on the Undergraduate Program in Mathematics が、学部数学の
# 「科目領域」として立てた区分で、ここには誰の判断も入っていない。
# 原典に当たれば確かめられる（`reference/` に一覧を置いた）。
#
# **20 番目の `precalculus` だけは足したもの。** CUPM は主専攻課程の科目群
# なので、二次関数・三角比・指数対数を吊るす枝が無い ── しかし高校数学の
# 相当部分はそこに入る。足した根拠は Precalculus Concept Assessment
# （Carlson, Oehrtman & Engelke, *Cognition and Instruction* 28(2), 2010）で、
# これは precalculus の概念 taxonomy にもとづいて構成された検証済みの
# concept inventory である。**範囲が precalculus に限られるので第 1 階層
# 全体の出所にはならないが、この 1 分野の出所にはなる。**
#
# 第 2 階層はどこから来たか ── ここは正直に言う
# ---------------------------------------------
# **`linear_algebra` の 6 単位だけが原典そのまま。** CUPM の Linear Algebra
# 報告は "Core topics" として Matrices and linear systems / Determinants /
# Vector spaces / Linear transformations / Eigenvalues and eigenvectors /
# Inner products の 6 つを挙げており、そのまま単位になる。
# `applied_statistics` の 5 単位は GAISE の statistical investigation process
# （問いを立てる→データを集める→分析する→解釈する→伝える）に沿わせた。
#
# **残り 18 分野の単位は判断である。** CUPM の他の報告は教育方法の議論が
# 中心で、topic の一覧を持たない（Calculus 報告は 1 つも挙げていない）。
# CS2023 の Knowledge Unit に当たるものが**大学数学には存在しない** ──
# MSC 2020 は研究分野の分類であって学習成果ではなく、Calculus Concept
# Inventory は 5 概念で KC を吊るすには粗すぎる（#187 の調査）。
# だからここは標準的なカリキュラム構成から起こしてある。
# **cs.yaml が「第 1・2 階層に判断は入っていない」と言えるのに対し、
# このファイルは第 2 階層についてそれを言えない。** 持っていない権威を
# 持っているように見せないために、ここに書いておく。
#
# 第 3 階層（知識要素）は推奨候補
# ------------------------------
# 高校範囲は学習指導要領（平成30年告示）の指導事項を「何ができれば
# 身に付いたと言えるか」の粒度に割ったもので、原典は
# `reference/kokuji_h30_math.yaml` にコード付きで置いてある。
# 行末の `# 数学Ⅰ(1)ア(ア)` のような注記が対応で、告示が動いたら
# **注記を直す。キーは動かさない。**
# 大学範囲は各分野の標準的な内容から起こした。
#
# 手を入れるときの約束
# --------------------
# - **キーを変えない。** KC の ID はキーから導かれ、Q-matrix は追記のみ（P8）。
#   誤りは `deprecated` にして `superseded_by` で後継を指す
# - ラベルと説明は直してよい（ID に効かない）
# - **科目ごとに足さない。** 骨格はコースをまたいで共有される語彙である
# - 告示の改訂で高校の扱いが変わったら、**注記を直して枝はそのまま**にする
#
# 投入:
#     uv run aijudge-admin kc seed --namespace math
# 何度走らせても増えない（`register` は既にあるものをそのまま返す）。

namespace: math
source: >-
  2015 CUPM Curriculum Guide to Majors in the Mathematical Sciences,
  Mathematical Association of America ── 第 1 階層は原典の Course Area Study
  Group 19 分野。`precalculus` のみ高校範囲を吊るすために追加した
  （Precalculus Concept Assessment, Carlson et al. 2010）。第 2 階層は
  `linear_algebra` が原典の Core topics、`applied_statistics` が GAISE の
  investigation process、**残りは標準的なカリキュラム構成からの判断**。
  高校範囲の第 3 階層は高等学校学習指導要領（平成30年告示）数学の指導事項による。
reference: reference/kokuji_h30_math.yaml

areas:
  # ------------------------------------------------------------------
  # CUPM に無い分野。高校の初等関数・初等代数を吊るすために足した。
  # 出所は Precalculus Concept Assessment（Carlson et al. 2010）。
  # ------------------------------------------------------------------
  - key: precalculus
    label: 初等関数と方程式・不等式
    en: Precalculus
    units:
      - key: numbers
        label: 数と式の基礎
        en: Numbers and Expressions
        components:
          - {key: number_systems, label: 数の体系の広がり}
          - {key: real_number, label: 実数への拡張}            # 数学Ⅰ(1)ア(ア)
          - {key: decimal_expansion, label: 有限小数と循環小数}  # 数学Ⅰ 内容の取扱い(2)
          - {key: irrational_arithmetic, label: 無理数の四則計算}  # 数学Ⅰ(1)ア(ア)
          - {key: radical, label: 根号を含む式の計算}
          - {key: rationalization, label: 分母の有理化}
          - {key: absolute_value, label: 絶対値}
          - {key: number_line, label: 数直線と大小関係}
      - key: polynomial
        label: 整式と分数式
        en: Polynomials and Rational Expressions
        components:
          - {key: monomial_polynomial, label: 単項式と多項式}
          - {key: expansion, label: 式の展開}                   # 数学Ⅰ(1)ア(ウ) / 数学Ⅱ(1)ア(ア)
          - {key: factorization, label: 因数分解}               # 数学Ⅰ(1)ア(ウ) / 数学Ⅱ(1)ア(ア)
          - {key: cubic_formula, label: 三次の乗法公式と因数分解の公式}  # 数学Ⅱ(1)ア(ア)
          - {key: binomial_theorem, label: 二項定理}            # 数学Ⅱ(1)［用語・記号］
          - {key: polynomial_division, label: 多項式の除法}      # 数学Ⅱ(1)ア(イ)
          - {key: rational_expression, label: 分数式の四則計算}  # 数学Ⅱ(1)ア(イ)
          - {key: identity, label: 恒等式と係数比較}
          - {key: expression_reformulation, label: 式を多面的に捉えて変形すること}  # 数学Ⅰ(1)イ(イ)／数学Ⅱ(1)イ(ア)
      - key: equations
        label: 方程式
        en: Equations
        components:
          - {key: linear_equation, label: 一次方程式}
          - {key: quadratic_equation, label: 二次方程式}
          - {key: discriminant, label: 解の種類の判別}          # 数学Ⅱ(1)ア(エ)
          - {key: root_coefficient, label: 解と係数の関係}      # 数学Ⅱ(1)ア(エ)
          - {key: factor_theorem, label: 因数定理と剰余の定理}  # 数学Ⅱ(1)ア(オ)
          - {key: higher_degree_equation, label: 高次方程式}    # 数学Ⅱ(1)ア(オ)
          - {key: simultaneous_equation, label: 連立方程式}
          - {key: fractional_irrational_equation, label: 分数方程式と無理方程式}
          - {key: equation_modeling, label: 事象を方程式で捉えて解決すること}  # 数学Ⅱ(1)イ(ウ)
      - key: inequalities
        label: 不等式
        en: Inequalities
        components:
          - {key: inequality_property, label: 不等式の性質}     # 数学Ⅰ(1)ア(エ)
          - {key: linear_inequality, label: 一次不等式}  # 数学Ⅰ(1)ア(エ)／数学Ⅰ(1)イ(ウ)
          - {key: quadratic_inequality, label: 二次不等式}      # 数学Ⅰ(3)ア(ウ)
          - {key: absolute_value_inequality, label: 絶対値を含む不等式}
          - {key: inequality_proof, label: 等式・不等式の証明}  # 数学Ⅱ(1)イ(イ)
          - {key: am_gm, label: 相加平均と相乗平均の関係}
          - {key: inequality_modeling, label: 事象を不等式で捉えて解決すること}  # 数学Ⅰ(1)イ(エ)
      - key: function_basics
        label: 関数の考え
        en: Foundations of Functions
        components:
          - {key: function_concept, label: 関数という考え方}
          - {key: function_notation, label: 関数の記法とその読み取り}
          - {key: domain_range, label: 定義域と値域}
          - {key: covariation, label: 二つの変量の共変関係}
          - {key: rate_of_change, label: 変化率のとらえ方}
          - {key: multiple_representation, label: 表・式・グラフの関連付け}
          - {key: graph_transformation, label: グラフの平行移動と対称移動}
          - {key: composite_function, label: 合成関数}          # 数学Ⅲ(1)ア(エ)
          - {key: inverse_function, label: 逆関数}              # 数学Ⅲ(1)ア(エ)
          - {key: rational_function, label: 分数関数}           # 数学Ⅲ(1)ア(ウ)
          - {key: irrational_function, label: 無理関数}  # 数学Ⅲ(1)ア(ウ)／数学Ⅲ(1)イ(イ)
          - {key: piecewise_function, label: 区分的に定義された関数}
      - key: quadratic_function
        label: 二次関数
        en: Quadratic Functions
        components:
          - {key: completing_square, label: 平方完成と頂点}
          - {key: graph_shape, label: 二次関数の値の変化とグラフ}  # 数学Ⅰ(3)ア(ア)
          - {key: max_min, label: 二次関数の最大値と最小値}      # 数学Ⅰ(3)ア(イ)
          - {key: graph_and_roots, label: 二次方程式の解とグラフの関係}  # 数学Ⅰ(3)ア(ウ)
          - {key: graph_and_inequality, label: 二次不等式の解とグラフの関係}  # 数学Ⅰ(3)ア(ウ)
          - {key: parameter_effect, label: 係数がグラフに与える影響}  # 数学Ⅰ(3)イ(ア)
          - {key: quadratic_modeling, label: 二つの数量の関係を二次関数で捉えること}  # 数学Ⅰ(3)イ(イ)
      - key: trigonometric_ratio
        label: 三角比
        en: Trigonometric Ratios
        components:
          - {key: acute_ratio, label: 鋭角の三角比}             # 数学Ⅰ(2)ア(ア)
          - {key: mutual_relation, label: 三角比の相互関係}      # 数学Ⅰ(2)ア(ア)
          - {key: obtuse_extension, label: 鈍角への拡張}        # 数学Ⅰ(2)ア(イ)
          - {key: special_angle, label: 0°・90°・180°の三角比}   # 数学Ⅰ 内容の取扱い(3)
          - {key: law_of_sines, label: 正弦定理}  # 数学Ⅰ(2)ア(ウ)／数学Ⅰ(2)イ(ア)
          - {key: law_of_cosines, label: 余弦定理}              # 数学Ⅰ(2)ア(ウ)
          - {key: triangle_solution, label: 三角形の辺と角を求めること}  # 数学Ⅰ(2)ア(ウ)
          - {key: triangle_area, label: 三角形の面積}
          - {key: measurement_application, label: 測量など事象への応用}  # 数学Ⅰ(2)イ(イ)
      - key: trigonometric_function
        label: 三角関数
        en: Trigonometric Functions
        components:
          - {key: general_angle, label: 一般角}                 # 数学Ⅱ(4)ア(ア)
          - {key: radian, label: 弧度法}                        # 数学Ⅱ(4)ア(ア)
          - {key: unit_circle, label: 単位円による定義}
          - {key: graph_periodicity, label: 三角関数のグラフと周期性}  # 数学Ⅱ(4)ア(イ)／数学Ⅱ(4)イ(イ)
          - {key: function_relation, label: 三角関数の相互関係}  # 数学Ⅱ(4)ア(ウ)
          - {key: addition_theorem, label: 加法定理}            # 数学Ⅱ(4)ア(エ)
          - {key: double_half_angle, label: 2 倍角と半角の公式}  # 数学Ⅱ(4)ア(エ)／数学Ⅱ(4)イ(ア)
          - {key: synthesis, label: 三角関数の合成}             # 数学Ⅱ(4)ア(エ)
          - {key: trig_equation, label: 三角方程式と三角不等式}
          - {key: periodic_modeling, label: 周期的な現象の記述}  # 数学Ⅱ(4)イ(ウ)
      - key: exponential_logarithm
        label: 指数関数と対数関数
        en: Exponential and Logarithmic Functions
        components:
          - {key: integer_exponent, label: 整数の指数}
          - {key: rational_exponent, label: 有理数への指数の拡張}  # 数学Ⅱ(3)ア(ア)
          - {key: radical_root, label: 累乗根}                  # 数学Ⅱ(3)［用語・記号］
          - {key: exponent_law, label: 指数法則}                # 数学Ⅱ(3)ア(ア)
          - {key: exponential_graph, label: 指数関数のグラフ}    # 数学Ⅱ(3)ア(イ)
          - {key: logarithm_definition, label: 対数の意味}       # 数学Ⅱ(3)ア(ウ)
          - {key: logarithm_law, label: 対数の性質と計算}        # 数学Ⅱ(3)ア(ウ)
          - {key: logarithm_graph, label: 対数関数のグラフ}  # 数学Ⅱ(3)ア(エ)／数学Ⅱ(3)イ(イ)
          - {key: change_of_base, label: 底の変換}
          - {key: common_logarithm, label: 常用対数}            # 数学Ⅱ(3)［用語・記号］
          - {key: exp_log_equation, label: 指数・対数方程式と不等式}
          - {key: exp_log_relation, label: 指数と対数の相互の関連付け}  # 数学Ⅱ(3)イ(ア)
          - {key: exp_log_modeling, label: 事象を指数・対数で捉えて解決すること}  # 数学Ⅱ(3)イ(ウ)

  - key: calculus
    label: 微分積分
    en: The Calculus Sequence
    units:
      - key: limits
        label: 極限
        en: Limits
        components:
          - {key: sequence_limit, label: 数列の極限}            # 数学Ⅲ(1)ア(ア)
          - {key: geometric_sequence_limit, label: "数列 {r^n} の極限"}  # 数学Ⅲ(1)ア(ア)
          - {key: infinite_series, label: 無限級数の収束と発散}  # 数学Ⅲ(1)ア(イ)
          - {key: geometric_series, label: 無限等比級数}        # 数学Ⅲ(1)ア(イ)
          - {key: function_limit, label: 関数の値の極限}  # 数学Ⅲ(1)ア(オ)／数学Ⅲ(1)イ(ウ)
          - {key: one_sided_limit, label: 片側からの極限}
          - {key: limit_at_infinity, label: 無限遠での極限}     # 数学Ⅲ(1)［用語・記号］
          - {key: indeterminate_form, label: 不定形の扱い}      # 数学Ⅲ(1)イ(ア)
