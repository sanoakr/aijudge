      - key: derivative
        label: 微分係数と導関数
        en: The Derivative
        components:
          - {key: average_rate, label: 平均変化率}
          - {key: instantaneous_rate, label: 瞬間の変化率}      # 数学Ⅱ(5)ア(ア)
          - {key: derivative_definition, label: 導関数の定義}  # 数学Ⅱ(5)ア(ア)／数学Ⅲ(2)イ(ア)
          - {key: differentiability, label: 微分可能性}         # 数学Ⅲ(2)ア(ア)
          - {key: continuity_and_differentiability, label: 連続性と微分可能性の関係}  # 数学Ⅲ(2)イ(イ)
          - {key: tangent_line, label: 接線の方程式}            # 数学Ⅲ(2)ア(エ)
          - {key: derivative_as_function, label: 導関数を関数として捉えること}  # 数学Ⅱ(5)イ(ア)
          - {key: higher_derivative, label: 第二次導関数}       # 数学Ⅲ(2)イ(イ)
          - {key: sensitivity, label: 感度としての微分}
      - key: differentiation
