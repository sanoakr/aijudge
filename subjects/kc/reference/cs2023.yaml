# CS2023 の知識体系 — **原典の写しであって、KC の骨格ではない**
#
# ACM / IEEE-CS / AAAI, Computer Science Curricula 2023, Version Gamma (2023-08)
# https://csed.acm.org/ の本文から、Knowledge Area → Knowledge Unit → topic の
# 3 階層を機械的に取り出したもの。**読むためのファイルで、投入しない。**
#
# なぜ分けてあるか
# ----------------
# CS2023 の topic は KC の粒度ではない。たとえば
#
#     SDF-Fundamentals の 3 番目:
#       "Basic constructs such as assignment statements, conditional and
#        iterative statements, basic I/O (using console)"
#
# これは **代入・分岐・反復・入出力の 4 つが 1 行に入っている**。カリキュラムを
# 編成するには足りるが、「何ができれば身に付いたか」を測る単位にはならない
# （片方だけ書ける学生の差が出ない）。KC に落とすときは、ここを割る判断が要る。
#
# だから骨格（`../cs.yaml`）とは別に、**原典を原典のまま**置いてある。
# 骨格を直すときに「CS2023 は何と言っていたか」を確かめられるようにするため。
#
# bucket は CS2023 自身の区分。
#   CS Core  … どの計算機科学の課程でも必修とされる範囲
#   KA Core  … その分野を扱う課程では必修
#   Non-Core … 選択
#
# 抽出について
# ------------
# PDF からのテキスト抽出なので、折り返し・ページ番号・相互参照を機械的に
# 均してある。**取りこぼしがありうる** ── 原典の版・ページに当たること。
# 到達目標（Illustrative Learning Outcomes）は含めていない。

source: "CS2023 (ACM/IEEE-CS/AAAI) Version Gamma, August 2023"
