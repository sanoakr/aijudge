# 高等学校学習指導要領（平成30年告示）物理基礎・物理 — **原典の写しであって、KC の骨格ではない**
#
# 文部科学省「高等学校学習指導要領（平成30年告示）」第 2 章第 5 節 理科のうち、
# 科目「物理基礎」「物理」。学習指導要領 LOD（https://jp-cos.github.io/ ・
# CC BY 4.0）の Turtle ダンプ `all-20250927.ttl.gz` から、学習指導要領コード
# 付きで機械的に取り出したもの。**読むためのファイルで、投入しない。**
#
# 数学との違い ── 指導事項が既に KC の粒度に近い
# ----------------------------------------------
# 理科の指導事項は 4 段（(1) → ア → (ア) → ㋐）まで下りていて、末端は
#
#     ㋒ 直線運動の加速度
#       速度が変化する物体の直線運動に関する実験などを行い、速度と時間との
#       関係を見いだして理解するとともに、物体が直線運動する場合の加速度を
#       理解すること。
#
# のように**見出しが付いている**。数学の「三次の乗法公式及び因数分解の公式を
# 理解し、それらを用いて式の展開や因数分解をすること」のように 1 行に複数の
# 概念が入ることは少なく、割る判断は数学より小さい。
#
# ただし**そのまま KC にはならない** ── 「様々な力」の 1 行は重力・垂直抗力・
# 摩擦力・張力・弾性力を含み、FCI の言う "Kinds of Force" の下位概念すべてに
# 当たる。骨格（`../physics.yaml`）ではそこを割ってある。
#
# `code` は学習指導要領コード（16 桁）。単独で
# `https://w3id.org/jp-cos/<code>` として引ける。
#
# 天体・宇宙は教科「理科」の別科目「地学基礎」「地学」に入っており、
# **ここには含まれない**（`../physics.yaml` が天文学を分野として持たない
# 判断と対応する ── そちらにコメントとして残してある）。

source: "高等学校学習指導要領（平成30年告示）第 2 章第 5 節 理科（物理基礎・物理）/ 文部科学省"
url: "https://jp-cos.github.io/"
