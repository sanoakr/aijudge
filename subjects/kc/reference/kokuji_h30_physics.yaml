subjects:
  - name: "物理基礎"
    code: "8462500000000000"
    items:
      - code: "8462502000000000"
        text: |-
          １　目標
          物体の運動と様々なエネルギーに関わり，理科の見方・考え方を働かせ，見通しをもって観察，実験を行うことなどを通して，物体の運動と様々なエネルギーを科学的に探究するために必要な資質・能力を次のとおり育成することを目指す。
        items:
          - code: "8462502100000000"
            text: "(1) 日常生活や社会との関連を図りながら，物体の運動と様々なエネルギーについて理解するとともに，科学的に探究するために必要な観察，実験などに関する基本的な技能を身に付けるようにする。"
          - code: "8462502200000000"
            text: "(2) 観察，実験などを行い，科学的に探究する力を養う。"
          - code: "8462502300000000"
            text: "(3) 物体の運動と様々なエネルギーに主体的に関わり，科学的に探究しようとする態度を養う。"
      - code: "8462503000000000"
        text: "２　内容"
        items:
          - code: "8462503100000000"
            text: |-
              (1) 物体の運動とエネルギー
              日常に起こる物体の運動についての観察，実験などを通して，次の事項を身に付けることができるよう指導する。
            items:
              - code: "8462503110000000"
                text: "ア　物体の運動とエネルギーを日常生活や社会と関連付けながら，次のことを理解するとともに，それらの観察，実験などに関する技能を身に付けること。"
                items:
                  - code: "8462503111000000"
                    text: "(ア) 運動の表し方"
                    items:
                      - code: "8462503111100000"
                        text: |-
                          ㋐　物理量の測定と扱い方
                          身近な物理現象について，物理量の測定と表し方，分析の手法を理解すること。
                      - code: "8462503111200000"
                        text: |-
                          ㋑　運動の表し方
                          物体の運動の表し方について，直線運動を中心に理解すること。
                      - code: "8462503111300000"
                        text: |-
                          ㋒　直線運動の加速度
                          速度が変化する物体の直線運動に関する実験などを行い，速度と時間との関係を見いだして理解するとともに，物体が直線運動する場合の加速度を理解すること。
                  - code: "8462503112000000"
                    text: "(イ) 様々な力とその働き"
                    items:
                      - code: "8462503112100000"
                        text: |-
                          ㋐　様々な力
                          物体に様々な力が働くことを理解すること。
                      - code: "8462503112200000"
                        text: |-
                          ㋑　力のつり合い
                          物体に働く力のつり合いを理解すること。
                      - code: "8462503112300000"
                        text: |-
                          ㋒　運動の法則
                          物体に一定の力を加え続けたときの運動に関する実験などを行い，物体の質量，物体に働く力，物体に生じる加速度の関係を見いだして理解するとともに，運動の三法則を理解すること。
                      - code: "8462503112400000"
                        text: |-
                          ㋓　物体の落下運動
                          物体が落下する際の運動の特徴及び物体に働く力と運動との関係について理解すること。
                  - code: "8462503113000000"
                    text: "(ウ) 力学的エネルギー"
                    items:
                      - code: "8462503113100000"
                        text: |-
                          ㋐　運動エネルギーと位置エネルギー
                          運動エネルギーと位置エネルギーについて，仕事と関連付けて理解すること。
                      - code: "8462503113200000"
                        text: |-
                          ㋑　力学的エネルギーの保存
                          力学的エネルギーに関する実験などを行い，力学的エネルギー保存の法則を仕事と関連付けて理解すること。
              - code: "8462503120000000"
                text: "イ　物体の運動とエネルギーについて，観察，実験などを通して探究し，運動の表し方，様々な力とその働き，力学的エネルギーにおける規則性や関係性を見いだして表現すること。"
          - code: "8462503200000000"
            text: |-
              (2) 様々な物理現象とエネルギーの利用
              様々な物理現象についての観察，実験などを通して，次の事項を身に付けることができるよう指導する。
            items:
              - code: "8462503210000000"
                text: "ア　様々な物理現象とエネルギーの利用を日常生活や社会と関連付けながら，次のことを理解するとともに，それらの観察，実験などに関する技能を身に付けること。"
                items:
                  - code: "8462503211000000"
                    text: "(ア) 波"
                    items:
                      - code: "8462503211100000"
                        text: |-
                          ㋐　波の性質
                          波の性質について，直線状に伝わる場合を中心に理解すること。
                      - code: "8462503211200000"
                        text: |-
                          ㋑　音と振動
                          気柱の共鳴に関する実験などを行い，気柱の共鳴と音源の振動数を関連付けて理解すること。また，弦の振動，音波の性質を理解すること。
                  - code: "8462503212000000"
                    text: "(イ) 熱"
                    items:
                      - code: "8462503212100000"
                        text: |-
                          ㋐　熱と温度
                          熱と温度について，原子や分子の熱運動の観点から理解すること。
                      - code: "8462503212200000"
                        text: |-
                          ㋑　熱の利用
                          熱に関する実験などを行い，熱の移動及び熱と仕事の変換について理解すること。
                  - code: "8462503213000000"
                    text: "(ウ) 電気"
                    items:
                      - code: "8462503213100000"
                        text: |-
                          ㋐　物質と電気抵抗
                          電気抵抗に関する実験などを行い，同じ物質からなる導体でも長さや断面積によって電気抵抗が異なることを見いだして理解すること。また，物質によって抵抗率が異なることを理解すること。
                      - code: "8462503213200000"
                        text: |-
                          ㋑　電気の利用
                          発電，送電及び電気の利用について，基本的な仕組みを理解すること。
                  - code: "8462503214000000"
                    text: "(エ) エネルギーとその利用"
                    items:
                      - code: "8462503214100000"
                        text: |-
                          ㋐　エネルギーとその利用
                          人類が利用可能な水力，化石燃料，原子力，太陽光などを源とするエネルギーの特性や利用などについて，物理学的な観点から理解すること。
                  - code: "8462503215000000"
                    text: "(オ) 物理学が拓(ひら)く世界"
                    items:
                      - code: "8462503215100000"
                        text: |-
                          ㋐　物理学が拓(ひら)く世界
                          この科目で学んだ事柄が，日常生活や社会を支えている科学技術と結び付いていることを理解すること。
              - code: "8462503220000000"
                text: "イ　様々な物理現象とエネルギーの利用について，観察，実験などを通して探究し，波，熱，電気，エネルギーとその利用における規則性や関係性を見いだして表現すること。"
      - code: "8462505000000000"
        text: "３　内容の取扱い"
        items:
          - code: "8462505100000000"
            text: "(1) 内容の取扱いに当たっては，次の事項に配慮するものとする。"
            items:
              - code: "8462505110000000"
                text: "ア　内容の(1)及び(2)については，中学校理科との関連を考慮し，それぞれのアに示す知識及び技能とイに示す思考力，判断力，表現力等とを相互に関連させながら，この科目の学習を通して，科学的に探究するために必要な資質・能力の育成を目指すこと。"
              - code: "8462505120000000"
                text: "イ　この科目で育成を目指す資質・能力を育むため，観察，実験などを行い，探究の過程を踏まえた学習活動を行うようにすること。その際，学習内容の特質に応じて，情報の収集，仮説の設定，実験の計画，実験による検証，実験データの分析・解釈，法則性の導出などの探究の方法を習得させるようにするとともに，報告書などを作成させたり，発表を行う機会を設けたりすること。"
          - code: "8462505200000000"
            text: "(2) 内容の範囲や程度については，次の事項に配慮するものとする。"
            items:
              - code: "8462505210000000"
                text: |-
                  ア　内容の(1)のアの(ア)の㋐については，この科目の学習全体に通じる手法などを扱うこと。
                  (イ)の㋐については，摩擦力，弾性力，圧力及び浮力を扱うこと。また，空間を隔てて働く力にも定性的に触れること。㋑については，平面内で働く力のつり合いを中心に扱うこと。㋒については，直線運動を中心に扱うこと。㋓については，自由落下，鉛直投射を扱い，水平投射及び空気抵抗の存在にも定性的に触れること。
                  (ウ)の㋐の「位置エネルギー」については，重力による位置エネルギー，弾性力による位置エネルギーを扱うこと。㋑については，摩擦や空気抵抗がない場合は力学的エネルギーが保存されることを中心に扱うこと。
              - code: "8462505220000000"
                text: |-
                  イ　内容の(2)のアの(ア)の㋐については，作図を用いる方法を中心に扱うこと。また，定在波も扱い，縦波や横波にも触れること。㋑については，波の反射，共振，うなりなどを扱うこと。
                  (イ)の㋐については，熱現象を微視的に捉え，原子や分子の熱運動と温度との関係を定性的に扱うこと。また，内部エネルギーや物質の三態にも触れること。㋑については，熱現象における不可逆性にも触れること。
                  (ウ)の㋐については，金属中の電流が自由電子の流れによることも扱うこと。また，半導体や絶縁体があることにも触れること。㋑については，交流の直流への変換や電磁波の利用にも触れること。
                  (エ)の㋐については，電気エネルギーへの変換を中心に扱うこと。「原子力」については，核分裂によってエネルギーが発生していることに触れること。関連して放射線の種類と性質，放射性物質の基本的な性質及び原子力の利用とその課題にも触れること。
                  (オ)の㋐については，日常生活や社会で利用されている科学技術の具体的事例を取り上げること。
  - name: "物理"
    code: "8463500000000000"
    items:
      - code: "8463502000000000"
        text: |-
          １　目標
          物理的な事物・現象に関わり，理科の見方・考え方を働かせ，見通しをもって観察，実験を行うことなどを通して，物理的な事物・現象を科学的に探究するために必要な資質・能力を次のとおり育成することを目指す。
        items:
          - code: "8463502100000000"
            text: "(1) 物理学の基本的な概念や原理・法則の理解を深め，科学的に探究するために必要な観察，実験などに関する技能を身に付けるようにする。"
          - code: "8463502200000000"
            text: "(2) 観察，実験などを行い，科学的に探究する力を養う。"
          - code: "8463502300000000"
            text: "(3) 物理的な事物・現象に主体的に関わり，科学的に探究しようとする態度を養う。"
      - code: "8463503000000000"
        text: "２　内容"
        items:
          - code: "8463503100000000"
            text: |-
              (1) 様々な運動
              物体の運動についての観察，実験などを通して，次の事項を身に付けることができるよう指導する。
            items:
              - code: "8463503110000000"
                text: "ア　様々な運動について，次のことを理解するとともに，それらの観察，実験などに関する技能を身に付けること。"
                items:
                  - code: "8463503111000000"
                    text: "(ア) 平面内の運動と剛体のつり合い"
                    items:
                      - code: "8463503111100000"
                        text: |-
                          ㋐　曲線運動の速度と加速度
                          平面内を運動する物体の運動について理解すること。
                      - code: "8463503111200000"
                        text: |-
                          ㋑　放物運動
                          水平投射及び斜方投射された物体の運動を直線運動と関連付けて理解すること。
                      - code: "8463503111300000"
                        text: |-
                          ㋒　剛体のつり合い
                          大きさのある物体のつり合いに関する実験などを行い，剛体のつり合う条件を見いだして理解すること。
                  - code: "8463503112000000"
                    text: "(イ) 運動量"
                    items:
                      - code: "8463503112100000"
                        text: |-
                          ㋐　運動量と力積
                          運動量と力積との関係について理解すること。
                      - code: "8463503112200000"
                        text: |-
                          ㋑　運動量の保存
                          物体の衝突や分裂に関する実験などを行い，運動量保存の法則を理解すること。
                      - code: "8463503112300000"
                        text: |-
                          ㋒　衝突と力学的エネルギー
                          衝突における力学的エネルギーの変化について理解すること。
                  - code: "8463503113000000"
                    text: "(ウ) 円運動と単振動"
                    items:
                      - code: "8463503113100000"
                        text: |-
                          ㋐　円運動
                          円運動をする物体の様子を表す方法やその物体に働く力などについて理解すること。
                      - code: "8463503113200000"
                        text: |-
                          ㋑　単振動
                          振り子に関する実験などを行い，単振動の規則性を見いだして理解するとともに，単振動をする物体の様子を表す方法やその物体に働く力などについて理解すること。
                  - code: "8463503114000000"
                    text: "(エ) 万有引力"
                    items:
                      - code: "8463503114100000"
                        text: |-
                          ㋐　惑星の運動
                          惑星の観測資料に基づいて，惑星の運動に関する法則を理解すること。
                      - code: "8463503114200000"
                        text: |-
                          ㋑　万有引力
                          万有引力の法則及び万有引力による物体の運動について理解すること。
                  - code: "8463503115000000"
                    text: "(オ) 気体分子の運動"
                    items:
                      - code: "8463503115100000"
                        text: |-
                          ㋐　気体分子の運動と圧力
                          気体分子の運動と圧力との関係について理解すること。
                      - code: "8463503115200000"
                        text: |-
                          ㋑　気体の内部エネルギー
                          気体の内部エネルギーについて，気体分子の運動と関連付けて理解すること。
                      - code: "8463503115300000"
                        text: |-
                          ㋒　気体の状態変化
                          気体の状態変化に関する実験などを行い，熱，仕事及び内部エネルギーの関係を理解すること。
              - code: "8463503120000000"
                text: "イ　様々な物体の運動について，観察，実験などを通して探究し，平面内の運動と剛体のつり合い，運動量，円運動と単振動，万有引力，気体分子の運動における規則性や関係性を見いだして表現すること。"
          - code: "8463503200000000"
            text: |-
              (2) 波
              水面波，音，光などの波動現象についての観察，実験などを通して，次の事項を身に付けることができるよう指導する。
            items:
              - code: "8463503210000000"
                text: "ア　波について，日常生活や社会と関連付けて，次のことを理解するとともに，それらの観察，実験などに関する技能を身に付けること。"
                items:
                  - code: "8463503211000000"
                    text: "(ア) 波の伝わり方"
                    items:
                      - code: "8463503211100000"
                        text: |-
                          ㋐　波の伝わり方とその表し方
                          波の伝わり方とその表し方について理解すること。
                      - code: "8463503211200000"
                        text: |-
                          ㋑　波の干渉と回折
                          波の干渉と回折について理解すること。
                  - code: "8463503212000000"
                    text: "(イ) 音"
                    items:
                      - code: "8463503212100000"
                        text: |-
                          ㋐　音の干渉と回折
                          音の干渉と回折について理解すること。
                      - code: "8463503212200000"
                        text: |-
                          ㋑　音のドップラー効果
                          音のドップラー効果について理解すること。
                  - code: "8463503213000000"
                    text: "(ウ) 光"
                    items:
                      - code: "8463503213100000"
                        text: |-
                          ㋐　光の伝わり方
                          光の伝わり方について理解すること。
                      - code: "8463503213200000"
                        text: |-
                          ㋑　光の回折と干渉
                          光の回折と干渉に関する実験などを行い，光の回折と干渉を光波の性質と関連付けて理解すること。
              - code: "8463503220000000"
                text: "イ　波について，観察，実験などを通して探究し，波の伝わり方，音，光における規則性や関係性を見いだして表現すること。"
          - code: "8463503300000000"
            text: |-
              (3) 電気と磁気
              電気や磁気に関する現象についての観察，実験などを通して，次の事項を身に付けることができるよう指導する。
            items:
              - code: "8463503310000000"
                text: "ア　電気や磁気について，日常生活や社会と関連付けて，次のことを理解するとともに，それらの観察，実験などに関する技能を身に付けること。"
                items:
                  - code: "8463503311000000"
                    text: "(ア) 電気と電流"
                    items:
                      - code: "8463503311100000"
                        text: |-
                          ㋐　電荷と電界
                          電荷が相互に及ぼし合う力を理解すること。また，電界の表し方を理解すること。
                      - code: "8463503311200000"
                        text: |-
                          ㋑　電界と電位
                          電界と電位との関係を静電気力による位置エネルギーと関連付けて理解すること。
                      - code: "8463503311300000"
                        text: |-
                          ㋒　電気容量
                          コンデンサーの性質を理解するとともに，電気容量を電界や電位差と関連付けて理解すること。
                      - code: "8463503311400000"
                        text: |-
                          ㋓　電気回路
                          電気回路に関する実験などを行い，電気回路における基本的な法則を理解すること。
                  - code: "8463503312000000"
                    text: "(イ) 電流と磁界"
                    items:
                      - code: "8463503312100000"
                        text: |-
                          ㋐　電流による磁界
                          電流がつくる磁界の様子を理解すること。
                      - code: "8463503312200000"
                        text: |-
                          ㋑　電流が磁界から受ける力
                          電流が磁界から受ける力について理解すること。
                      - code: "8463503312300000"
                        text: |-
                          ㋒　電磁誘導
                          電磁誘導に関する実験などを行い，磁束の変化と誘導起電力の向きや大きさとの関係を見いだして理解するとともに，電磁誘導の法則を理解すること。また，交流の発生について理解すること。
                      - code: "8463503312400000"
                        text: |-
                          ㋓　電磁波
                          電磁波の性質とその利用を理解すること。
              - code: "8463503320000000"
                text: "イ　電気や磁気について，観察，実験などを通して探究し，電気と電流，電流と磁界における規則性や関係性を見いだして表現すること。"
          - code: "8463503400000000"
            text: |-
              (4) 原子
              電子，原子及び原子核に関する現象についての観察，実験などを通して，次の事項を身に付けることができるよう指導する。
            items:
              - code: "8463503410000000"
                text: "ア　原子について，次のことを理解するとともに，それらの観察，実験などに関する技能を身に付けること。"
                items:
                  - code: "8463503411000000"
                    text: "(ア) 電子と光"
                    items:
                      - code: "8463503411100000"
                        text: |-
                          ㋐　電子
                          電子の電荷と質量について理解すること。
                      - code: "8463503411200000"
                        text: |-
                          ㋑　粒子性と波動性
                          電子や光の粒子性と波動性について理解すること。
                  - code: "8463503412000000"
                    text: "(イ) 原子と原子核"
                    items:
                      - code: "8463503412100000"
                        text: |-
                          ㋐　原子とスペクトル
                          原子の構造及びスペクトルと電子のエネルギー準位との関係について理解すること。
                      - code: "8463503412200000"
                        text: |-
                          ㋑　原子核
                          原子核の構成，原子核の崩壊及び核反応について理解すること。
                      - code: "8463503412300000"
                        text: |-
                          ㋒　素粒子
                          素粒子の存在について知ること。
                  - code: "8463503413000000"
                    text: "(ウ) 物理学が築く未来"
                    items:
                      - code: "8463503413100000"
                        text: |-
                          ㋐　物理学が築く未来
                          物理学の成果が様々な分野で利用され，未来を築く新しい科学技術の基盤となっていることを理解すること。
              - code: "8463503420000000"
                text: "イ　原子について，観察，実験などを通して探究し，電子と光，原子と原子核における規則性や関係性を見いだして表現すること。"
      - code: "8463505000000000"
        text: "３　内容の取扱い"
        items:
          - code: "8463505100000000"
            text: "(1) 内容の取扱いに当たっては，次の事項に配慮するものとする。"
            items:
              - code: "8463505110000000"
                text: "ア　内容の(1)から(4)までについては，「物理基礎」との関連を考慮し，それぞれのアに示す知識及び技能とイに示す思考力，判断力，表現力等とを相互に関連させながら，この科目の学習を通して，科学的に探究するために必要な資質・能力の育成を目指すこと。"
              - code: "8463505120000000"
                text: "イ　この科目で育成を目指す資質・能力を育むため，「物理基礎」の３の(1)のイと同様に取り扱うとともに，この科目の学習を通して，探究の全ての学習過程を経験できるようにすること。"
          - code: "8463505200000000"
            text: "(2) 内容の範囲や程度については，次の事項に配慮するものとする。"
            items:
              - code: "8463505210000000"
                text: |-
                  ア　内容の(1)のアの(ア)の㋐については，物体の平面内の運動を表す変位，速度及び加速度はベクトルで表されることを扱うこと。㋑については，物体の水平投射や斜方投射における速度，加速度，重力の働きなどを扱うこと。また，空気の抵抗がある場合の落下運動にも触れること。㋒については，力のモーメントのつり合いを扱うこと。また，物体の重心にも触れること。
                  (イ)の㋐については，運動量と力積がベクトルで表されること，運動量の変化が力積に等しいことを扱うこと。㋒については，はね返り係数も扱うこと。
                  (ウ)の㋐については，等速円運動の速度，周期，角速度，向心加速度及び向心力を扱うこと。また，遠心力にも触れること。㋑については，単振動をする物体の変位，速度，加速度及び復元力を扱うこと。「単振動」については，ばね振り子と単振り子を扱うこと。
                  (エ)の㋐については，ケプラーの法則を扱うこと。㋑については，万有引力による位置エネルギーも扱うこと。
                  (オ)の㋐については，理想気体の状態方程式，気体分子の速さ，平均の運動エネルギーなどを扱うこと。㋑については，理想気体を扱うこと。㋒については，熱力学第一法則を扱うこと。
              - code: "8463505220000000"
                text: |-
                  イ　内容の(2)のアの(ア)の㋐については，ホイヘンスの原理，水面波の反射や屈折及び波の式を扱うこと。㋑については，水面波を扱うこと。
                  (イ)の㋑については，観測者と音源が同一直線上を動く場合を中心に扱うこと。
                  (ウ)の㋐については，光の速さ，波長，反射，屈折，分散，偏光などを扱い，鏡やレンズの幾何光学的な性質については，基本的な扱いとすること。また，光は横波であることや光のスペクトルにも触れること。㋑については，ヤングの実験，回折格子及び薄膜の干渉を扱うこと。
              - code: "8463505230000000"
                text: |-
                  ウ　内容の(3)のアの(ア)の㋐については，静電誘導も扱うこと。㋒については，コンデンサーの接続にも触れること。㋓については，抵抗率の温度変化，内部抵抗も扱うこと。また，半導体にも触れること。
                  (イ)の㋐については，直線電流と円電流がつくる磁界を中心に扱うこと。㋑については，ローレンツ力にも触れること。㋒については，電磁誘導の法則を中心に扱い，自己誘導，相互誘導を扱うこと。また，交流回路の基本的な性質にも触れること。㋓については，電気振動，電磁波の発生にも触れること。
              - code: "8463505240000000"
                text: |-
                  エ　内容の(4)のアの(ア)の㋐については，電子に関する歴史的な実験にも触れること。㋑については，光電効果，電子線回折などを扱い，Ｘ線にも触れること。
                  (イ)の㋐については，水素原子の構造を中心にスペクトルと関連させて扱うこと。㋑については，質量とエネルギーの等価性にも触れること。
                  (ウ)の㋐については，物理学の発展と科学技術の進展に対する興味を喚起するような成果を取り上げること。
