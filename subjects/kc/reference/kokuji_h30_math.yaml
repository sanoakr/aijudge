                    text: "logax"
                  - code: "8452503333000000"
                    text: "常用対数"
          - code: "8452503400000000"
            text: |-
              (4) 三角関数
              三角関数について，数学的活動を通して，その有用性を認識するとともに，次の事項を身に付けることができるよう指導する。
            items:
              - code: "8452503410000000"
                text: "ア　次のような知識及び技能を身に付けること。"
                items:
                  - code: "8452503411000000"
                    text: "(ア) 角の概念を一般角まで拡張する意義や弧度法による角度の表し方について理解すること。"
                  - code: "8452503412000000"
                    text: "(イ) 三角関数の値の変化やグラフの特徴について理解すること。"
                  - code: "8452503413000000"
                    text: "(ウ) 三角関数の相互関係などの基本的な性質を理解すること。"
                  - code: "8452503414000000"
                    text: "(エ) 三角関数の加法定理や２倍角の公式，三角関数の合成について理解すること。"
              - code: "8452503420000000"
                text: "イ　次のような思考力，判断力，表現力等を身に付けること。"
                items:
                  - code: "8452503421000000"
                    text: "(ア) 三角関数に関する様々な性質について考察するとともに，三角関数の加法定理から新たな性質を導くこと。"
                  - code: "8452503422000000"
                    text: "(イ) 三角関数の式とグラフの関係について多面的に考察すること。"
                  - code: "8452503423000000"
                    text: "(ウ) 二つの数量の関係に着目し，日常の事象や社会の事象などを数学的に捉え，問題を解決したり，解決の過程を振り返って事象の数学的な特徴や他の事象との関係を考察したりすること。"
          - code: "8452503500000000"
            text: |-
              (5) 微分・積分の考え
              微分と積分の考えについて，数学的活動を通して，その有用性を認識するとともに，次の事項を身に付けることができるよう指導する。
            items:
              - code: "8452503510000000"
                text: "ア　次のような知識及び技能を身に付けること。"
                items:
                  - code: "8452503511000000"
                    text: "(ア) 微分係数や導関数の意味について理解し，関数の定数倍，和及び差の導関数を求めること。"
                  - code: "8452503512000000"
                    text: "(イ) 導関数を用いて関数の値の増減や極大・極小を調べ，グラフの概形をかく方法を理解すること。"
                  - code: "8452503513000000"
                    text: "(ウ) 不定積分及び定積分の意味について理解し，関数の定数倍，和及び差の不定積分や定積分の値を求めること。"
              - code: "8452503520000000"
                text: "イ　次のような思考力，判断力，表現力等を身に付けること。"
                items:
                  - code: "8452503521000000"
                    text: "(ア) 関数とその導関数との関係について考察すること。"
                  - code: "8452503522000000"
                    text: "(イ) 関数の局所的な変化に着目し，日常の事象や社会の事象などを数学的に捉え，問題を解決したり，解決の過程を振り返って事象の数学的な特徴や他の事象との関係を考察したりすること。"
                  - code: "8452503523000000"
                    text: "(ウ) 微分と積分の関係に着目し，積分の考えを用いて直線や関数のグラフで囲まれた図形の面積を求める方法について考察すること。"
              - code: "8452503530000000"
                text: "［用語・記号］"
                items:
                  - code: "8452503531000000"
                    text: "極限値"
                  - code: "8452503532000000"
                    text: "lim"
          - code: "8452503600000000"
            text: |-
              〔課題学習〕
              (1)から(5)までの内容又はそれらを相互に関連付けた内容を生活と関連付けたり発展させたりするなどした課題を設け，生徒の主体的な学習を促し，数学のよさを認識させ，学習意欲を含めた数学的に考える資質・能力を高めるようにする。
      - code: "8452505000000000"
        text: "３　内容の取扱い"
        items:
          - code: "8452505100000000"
            text: "(1) 内容の(5)のアの(ア)については，三次までの関数を中心に扱い，アの(ウ)については，二次までの関数を中心に扱うものとする。また，微分係数や導関数を求める際に必要となる極限については，直観的に理解させるよう扱うものとする。"
          - code: "8452505200000000"
            text: "(2) 課題学習については，それぞれの内容との関連を踏まえ，学習効果を高めるよう指導計画に適切に位置付けるものとする。"
  - name: "数学Ⅲ"
    code: "8453500000000000"
    items:
      - code: "8453502000000000"
        text: |-
          １　目標
          数学的な見方・考え方を働かせ，数学的活動を通して，数学的に考える資質・能力を次のとおり育成することを目指す。
        items:
          - code: "8453502100000000"
            text: "(1) 極限，微分法及び積分法についての概念や原理・法則を体系的に理解するとともに，事象を数学化したり，数学的に解釈したり，数学的に表現・処理したりする技能を身に付けるようにする。"
          - code: "8453502200000000"
            text: "(2) 数列や関数の値の変化に着目し，極限について考察したり，関数関係をより深く捉えて事象を的確に表現し，数学的に考察したりする力，いろいろな関数の局所的な性質や大域的な性質に着目し，事象を数学的に考察したり，問題解決の過程や結果を振り返って統合的・発展的に考察したりする力を養う。"
          - code: "8453502300000000"
            text: "(3) 数学のよさを認識し積極的に数学を活用しようとする態度，粘り強く柔軟に考え数学的論拠に基づいて判断しようとする態度，問題解決の過程を振り返って考察を深めたり，評価・改善したりしようとする態度や創造性の基礎を養う。"
      - code: "8453503000000000"
        text: "２　内容"
        items:
          - code: "8453503100000000"
            text: |-
              (1) 極限
              数列及び関数の値の極限について，数学的活動を通して，次の事項を身に付けることができるよう指導する。
            items:
              - code: "8453503110000000"
                text: "ア　次のような知識及び技能を身に付けること。"
                items:
                  - code: "8453503111000000"
                    text: "(ア) 数列の極限について理解し，数列｛rn｝の極限などを基に簡単な数列の極限を求めること。"
                  - code: "8453503112000000"
                    text: "(イ) 無限級数の収束，発散について理解し，無限等比級数などの簡単な無限級数の和を求めること。"
                  - code: "8453503113000000"
                    text: "(ウ) 簡単な分数関数と無理関数の値の変化やグラフの特徴について理解すること。"
                  - code: "8453503114000000"
                    text: "(エ) 合成関数や逆関数の意味を理解し，簡単な場合についてそれらを求めること。"
                  - code: "8453503115000000"
                    text: "(オ) 関数の値の極限について理解すること。"
              - code: "8453503120000000"
                text: "イ　次のような思考力，判断力，表現力等を身に付けること。"
                items:
                  - code: "8453503121000000"
                    text: "(ア) 式を多面的に捉えたり目的に応じて適切に変形したりして，極限を求める方法を考察すること。"
                  - code: "8453503122000000"
                    text: "(イ) 既に学習した関数の性質と関連付けて，簡単な分数関数と無理関数のグラフの特徴を多面的に考察すること。"
                  - code: "8453503123000000"
                    text: "(ウ) 数列や関数の値の極限に着目し，事象を数学的に捉え，コンピュータなどの情報機器を用いて極限を調べるなどして，問題を解決したり，解決の過程を振り返って事象の数学的な特徴や他の事象との関係を考察したりすること。"
              - code: "8453503130000000"
                text: "［用語・記号］"
                items:
                  - code: "8453503131000000"
                    text: "∞"
          - code: "8453503200000000"
            text: |-
              (2) 微分法
              微分法について，数学的活動を通して，その有用性を認識するとともに，次の事項を身に付けることができるよう指導する。
            items:
              - code: "8453503210000000"
                text: "ア　次のような知識及び技能を身に付けること。"
                items:
                  - code: "8453503211000000"
                    text: "(ア) 微分可能性，関数の積及び商の導関数について理解し，関数の和，差，積及び商の導関数を求めること。"
                  - code: "8453503212000000"
                    text: "(イ) 合成関数の導関数について理解し，それを求めること。"
                  - code: "8453503213000000"
                    text: "(ウ) 三角関数，指数関数及び対数関数の導関数について理解し，それらを求めること。"
                  - code: "8453503214000000"
                    text: "(エ) 導関数を用いて，いろいろな曲線の接線の方程式を求めたり，いろいろな関数の値の増減，極大・極小，グラフの凹凸などを調べグラフの概形をかいたりすること。"
              - code: "8453503220000000"
                text: "イ　次のような思考力，判断力，表現力等を身に付けること。"
                items:
                  - code: "8453503221000000"
                    text: "(ア) 導関数の定義に基づき，三角関数，指数関数及び対数関数の導関数を考察すること。"
                  - code: "8453503222000000"
                    text: "(イ) 関数の連続性と微分可能性，関数とその導関数や第二次導関数の関係について考察すること。"
                  - code: "8453503223000000"
                    text: "(ウ) 関数の局所的な変化や大域的な変化に着目し，事象を数学的に捉え，問題を解決したり，解決の過程を振り返って事象の数学的な特徴や他の事象との関係を考察したりすること。"
              - code: "8453503230000000"
                text: "［用語・記号］"
                items:
                  - code: "8453503231000000"
                    text: "自然対数"
                  - code: "8453503232000000"
                    text: "e"
                  - code: "8453503233000000"
                    text: "変曲点"
          - code: "8453503300000000"
            text: |-
              (3) 積分法
              積分法について，数学的活動を通して，その有用性を認識するとともに，次の事項を身に付けることができるよう指導する。
            items:
              - code: "8453503310000000"
                text: "ア　次のような知識及び技能を身に付けること。"
                items:
                  - code: "8453503311000000"
                    text: "(ア) 不定積分及び定積分の基本的な性質についての理解を深め，それらを用いて不定積分や定積分を求めること。"
                  - code: "8453503312000000"
                    text: "(イ) 置換積分法及び部分積分法について理解し，簡単な場合について，それらを用いて不定積分や定積分を求めること。"
                  - code: "8453503313000000"
                    text: "(ウ) 定積分を利用して，いろいろな曲線で囲まれた図形の面積や立体の体積及び曲線の長さなどを求めること。"
              - code: "8453503320000000"
                text: "イ　次のような思考力，判断力，表現力等を身に付けること。"
                items:
                  - code: "8453503321000000"
                    text: "(ア) 関数の式を多面的にみたり目的に応じて適切に変形したりして，いろいろな関数の不定積分や定積分を求める方法について考察すること。"
                  - code: "8453503322000000"
                    text: "(イ) 極限や定積分の考えを基に，立体の体積や曲線の長さなどを求める方法について考察すること。"
                  - code: "8453503323000000"
                    text: "(ウ) 微分と積分との関係に着目し，事象を数学的に捉え，問題を解決したり，解決の過程を振り返って事象の数学的な特徴や他の事象との関係を考察したりすること。"
          - code: "8453503400000000"
            text: |-
              〔課題学習〕
              (1)から(3)までの内容又はそれらを相互に関連付けた内容を生活と関連付けたり発展させたりするなどした課題を設け，生徒の主体的な学習を促し，数学のよさを認識させ，学習意欲を含めた数学的に考える資質・能力を高めるようにする。
      - code: "8453505000000000"
        text: "３　内容の取扱い"
        items:
          - code: "8453505100000000"
            text: "(1) 内容の(2)のイの(ウ)については，関連して直線上の点の運動や平面上の点の運動の速度及び加速度を扱うものとする。"
          - code: "8453505200000000"
            text: "(2) 内容の(3)のアの(イ)については，置換積分法はax＋b＝t，x＝asinθと置き換えるものを中心に扱うものとする。また，部分積分法は，簡単な関数について１回の適用で結果が得られるものを中心に扱うものとする。"
          - code: "8453505300000000"
            text: "(3) 課題学習については，それぞれの内容との関連を踏まえ，学習効果を高めるよう指導計画に適切に位置付けるものとする。"
  - name: "数学Ａ"
    code: "8454500000000000"
    items:
      - code: "8454502000000000"
        text: |-
          １　目標
          数学的な見方・考え方を働かせ，数学的活動を通して，数学的に考える資質・能力を次のとおり育成することを目指す。
        items:
          - code: "8454502100000000"
            text: "(1) 図形の性質，場合の数と確率についての基本的な概念や原理・法則を体系的に理解するとともに，数学と人間の活動の関係について認識を深め，事象を数学化したり，数学的に解釈したり，数学的に表現・処理したりする技能を身に付けるようにする。"
          - code: "8454502200000000"
            text: "(2) 図形の構成要素間の関係などに着目し，図形の性質を見いだし，論理的に考察する力，不確実な事象に着目し，確率の性質などに基づいて事象の起こりやすさを判断する力，数学と人間の活動との関わりに着目し，事象に数学の構造を見いだし，数理的に考察する力を養う。"
          - code: "8454502300000000"
            text: "(3) 数学のよさを認識し数学を活用しようとする態度，粘り強く考え数学的論拠に基づいて判断しようとする態度，問題解決の過程を振り返って考察を深めたり，評価・改善したりしようとする態度や創造性の基礎を養う。"
      - code: "8454503000000000"
        text: "２　内容"
        items:
          - code: "8454503100000000"
            text: |-
              (1) 図形の性質
