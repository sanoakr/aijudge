subjects:
  - name: "数学Ⅰ"
    code: "8451500000000000"
    items:
      - code: "8451502000000000"
        text: |-
          １　目標
          数学的な見方・考え方を働かせ，数学的活動を通して，数学的に考える資質・能力を次のとおり育成することを目指す。
        items:
          - code: "8451502100000000"
            text: "(1) 数と式，図形と計量，二次関数及びデータの分析についての基本的な概念や原理・法則を体系的に理解するとともに，事象を数学化したり，数学的に解釈したり，数学的に表現・処理したりする技能を身に付けるようにする。"
          - code: "8451502200000000"
            text: "(2) 命題の条件や結論に着目し，数や式を多面的にみたり目的に応じて適切に変形したりする力，図形の構成要素間の関係に着目し，図形の性質や計量について論理的に考察し表現する力，関数関係に着目し，事象を的確に表現してその特徴を表，式，グラフを相互に関連付けて考察する力，社会の事象などから設定した問題について，データの散らばりや変量間の関係などに着目し，適切な手法を選択して分析を行い，問題を解決したり，解決の過程や結果を批判的に考察し判断したりする力を養う。"
          - code: "8451502300000000"
            text: "(3) 数学のよさを認識し数学を活用しようとする態度，粘り強く考え数学的論拠に基づいて判断しようとする態度，問題解決の過程を振り返って考察を深めたり，評価・改善したりしようとする態度や創造性の基礎を養う。"
      - code: "8451503000000000"
        text: "２　内容"
        items:
          - code: "8451503100000000"
            text: |-
              (1) 数と式
              数と式について，数学的活動を通して，次の事項を身に付けることができるよう指導する。
            items:
              - code: "8451503110000000"
                text: "ア　次のような知識及び技能を身に付けること。"
                items:
                  - code: "8451503111000000"
                    text: "(ア) 数を実数まで拡張する意義を理解し，簡単な無理数の四則計算をすること。"
                  - code: "8451503112000000"
                    text: "(イ) 集合と命題に関する基本的な概念を理解すること。"
                  - code: "8451503113000000"
                    text: "(ウ) 二次の乗法公式及び因数分解の公式の理解を深めること。"
                  - code: "8451503114000000"
                    text: "(エ) 不等式の解の意味や不等式の性質について理解し，一次不等式の解を求めること。"
              - code: "8451503120000000"
                text: "イ　次のような思考力，判断力，表現力等を身に付けること。"
                items:
                  - code: "8451503121000000"
                    text: "(ア) 集合の考えを用いて論理的に考察し，簡単な命題を証明すること。"
                  - code: "8451503122000000"
                    text: "(イ) 問題を解決する際に，既に学習した計算の方法と関連付けて，式を多面的に捉えたり目的に応じて適切に変形したりすること。"
                  - code: "8451503123000000"
                    text: "(ウ) 不等式の性質を基に一次不等式を解く方法を考察すること。"
                  - code: "8451503124000000"
                    text: "(エ) 日常の事象や社会の事象などを数学的に捉え，一次不等式を問題解決に活用すること。"
          - code: "8451503200000000"
            text: |-
              (2) 図形と計量
              図形と計量について，数学的活動を通して，その有用性を認識するとともに，次の事項を身に付けることができるよう指導する。
            items:
              - code: "8451503210000000"
                text: "ア　次のような知識及び技能を身に付けること。"
                items:
                  - code: "8451503211000000"
                    text: "(ア) 鋭角の三角比の意味と相互関係について理解すること。"
                  - code: "8451503212000000"
                    text: "(イ) 三角比を鈍角まで拡張する意義を理解し，鋭角の三角比の値を用いて鈍角の三角比の値を求める方法を理解すること。"
                  - code: "8451503213000000"
                    text: "(ウ) 正弦定理や余弦定理について三角形の決定条件や三平方の定理と関連付けて理解し，三角形の辺の長さや角の大きさなどを求めること。"
              - code: "8451503220000000"
                text: "イ　次のような思考力，判断力，表現力等を身に付けること。"
                items:
                  - code: "8451503221000000"
                    text: "(ア) 図形の構成要素間の関係を三角比を用いて表現するとともに，定理や公式として導くこと。"
                  - code: "8451503222000000"
                    text: "(イ) 図形の構成要素間の関係に着目し，日常の事象や社会の事象などを数学的に捉え，問題を解決したり，解決の過程を振り返って事象の数学的な特徴や他の事象との関係を考察したりすること。"
              - code: "8451503230000000"
                text: "［用語・記号］"
                items:
                  - code: "8451503231000000"
                    text: "正弦"
                  - code: "8451503232000000"
                    text: "sin"
                  - code: "8451503233000000"
                    text: "余弦"
                  - code: "8451503234000000"
                    text: "cos"
                  - code: "8451503235000000"
                    text: "正接"
                  - code: "8451503236000000"
                    text: "tan"
          - code: "8451503300000000"
            text: |-
              (3) 二次関数
              二次関数について，数学的活動を通して，その有用性を認識するとともに，次の事項を身に付けることができるよう指導する。
            items:
              - code: "8451503310000000"
                text: "ア　次のような知識及び技能を身に付けること。"
                items:
                  - code: "8451503311000000"
                    text: "(ア) 二次関数の値の変化やグラフの特徴について理解すること。"
                  - code: "8451503312000000"
                    text: "(イ) 二次関数の最大値や最小値を求めること。"
                  - code: "8451503313000000"
                    text: "(ウ) 二次方程式の解と二次関数のグラフとの関係について理解すること。また，二次不等式の解と二次関数のグラフとの関係について理解し，二次関数のグラフを用いて二次不等式の解を求めること。"
              - code: "8451503320000000"
                text: "イ　次のような思考力，判断力，表現力等を身に付けること。"
                items:
                  - code: "8451503321000000"
                    text: "(ア) 二次関数の式とグラフとの関係について，コンピュータなどの情報機器を用いてグラフをかくなどして多面的に考察すること。"
                  - code: "8451503322000000"
                    text: "(イ) 二つの数量の関係に着目し，日常の事象や社会の事象などを数学的に捉え，問題を解決したり，解決の過程を振り返って事象の数学的な特徴や他の事象との関係を考察したりすること。"
          - code: "8451503400000000"
            text: |-
              (4) データの分析
              データの分析について，数学的活動を通して，その有用性を認識するとともに，次の事項を身に付けることができるよう指導する。
            items:
              - code: "8451503410000000"
                text: "ア　次のような知識及び技能を身に付けること。"
                items:
                  - code: "8451503411000000"
                    text: "(ア) 分散，標準偏差，散布図及び相関係数の意味やその用い方を理解すること。"
                  - code: "8451503412000000"
                    text: "(イ) コンピュータなどの情報機器を用いるなどして，データを表やグラフに整理したり，分散や標準偏差などの基本的な統計量を求めたりすること。"
                  - code: "8451503413000000"
                    text: "(ウ) 具体的な事象において仮説検定の考え方を理解すること。"
              - code: "8451503420000000"
                text: "イ　次のような思考力，判断力，表現力等を身に付けること。"
                items:
                  - code: "8451503421000000"
                    text: "(ア) データの散らばり具合や傾向を数値化する方法を考察すること。"
                  - code: "8451503422000000"
                    text: "(イ) 目的に応じて複数の種類のデータを収集し，適切な統計量やグラフ，手法などを選択して分析を行い，データの傾向を把握して事象の特徴を表現すること。"
                  - code: "8451503423000000"
                    text: "(ウ) 不確実な事象の起こりやすさに着目し，主張の妥当性について，実験などを通して判断したり，批判的に考察したりすること。"
              - code: "8451503430000000"
                text: "［用語・記号］　"
                items:
                  - code: "8451503431000000"
                    text: "外れ値"
          - code: "8451503500000000"
            text: |-
              〔課題学習〕
              (1)から(4)までの内容又はそれらを相互に関連付けた内容を生活と関連付けたり発展させたりするなどした課題を設け，生徒の主体的な学習を促し，数学のよさを認識させ，学習意欲を含めた数学的に考える資質・能力を高めるようにする。
      - code: "8451505000000000"
        text: "３　内容の取扱い"
        items:
          - code: "8451505100000000"
            text: "(1) 内容の(1)から(4)までについては，中学校数学科との関連を十分に考慮するものとする。"
          - code: "8451505200000000"
            text: "(2) 内容の(1)のアの(ア)については，分数が有限小数や循環小数で表される仕組みを扱うものとする。"
          - code: "8451505300000000"
            text: "(3) 内容の(2)のアの(イ)については，関連して0°，90°，180°の三角比を扱うものとする。"
          - code: "8451505400000000"
            text: "(4) 課題学習については，それぞれの内容との関連を踏まえ，学習効果を高めるよう指導計画に適切に位置付けるものとする。"
  - name: "数学Ⅱ"
    code: "8452500000000000"
    items:
      - code: "8452502000000000"
        text: |-
          １　目標
          数学的な見方・考え方を働かせ，数学的活動を通して，数学的に考える資質・能力を次のとおり育成することを目指す。
        items:
          - code: "8452502100000000"
            text: "(1) いろいろな式，図形と方程式，指数関数・対数関数，三角関数及び微分・積分の考えについての基本的な概念や原理・法則を体系的に理解するとともに，事象を数学化したり，数学的に解釈したり，数学的に表現・処理したりする技能を身に付けるようにする。"
          - code: "8452502200000000"
            text: "(2) 数の範囲や式の性質に着目し，等式や不等式が成り立つことなどについて論理的に考察する力，座標平面上の図形について構成要素間の関係に着目し，方程式を用いて図形を簡潔・明瞭・的確に表現したり，図形の性質を論理的に考察したりする力，関数関係に着目し，事象を的確に表現してその特徴を数学的に考察する力，関数の局所的な変化に着目し，事象を数学的に考察したり，問題解決の過程や結果を振り返って統合的・発展的に考察したりする力を養う。"
          - code: "8452502300000000"
            text: "(3) 数学のよさを認識し数学を活用しようとする態度，粘り強く柔軟に考え数学的論拠に基づいて判断しようとする態度，問題解決の過程を振り返って考察を深めたり，評価・改善したりしようとする態度や創造性の基礎を養う。"
      - code: "8452503000000000"
        text: "２　内容"
        items:
          - code: "8452503100000000"
            text: |-
              (1) いろいろな式
              いろいろな式について，数学的活動を通して，次の事項を身に付けることができるよう指導する。
            items:
              - code: "8452503110000000"
                text: "ア　次のような知識及び技能を身に付けること。"
                items:
                  - code: "8452503111000000"
                    text: "(ア) 三次の乗法公式及び因数分解の公式を理解し，それらを用いて式の展開や因数分解をすること。"
                  - code: "8452503112000000"
                    text: "(イ) 多項式の除法や分数式の四則計算の方法について理解し，簡単な場合について計算をすること。"
                  - code: "8452503113000000"
                    text: "(ウ) 数を複素数まで拡張する意義を理解し，複素数の四則計算をすること。"
                  - code: "8452503114000000"
                    text: "(エ) 二次方程式の解の種類の判別及び解と係数の関係について理解すること。"
                  - code: "8452503115000000"
                    text: "(オ) 因数定理について理解し，簡単な高次方程式について因数定理などを用いてその解を求めること。"
              - code: "8452503120000000"
                text: "イ　次のような思考力，判断力，表現力等を身に付けること。"
                items:
                  - code: "8452503121000000"
                    text: "(ア) 式の計算の方法を既に学習した数や式の計算と関連付け多面的に考察すること。"
                  - code: "8452503122000000"
                    text: "(イ) 実数の性質や等式の性質，不等式の性質などを基に，等式や不等式が成り立つことを論理的に考察し，証明すること。"
                  - code: "8452503123000000"
                    text: "(ウ) 日常の事象や社会の事象などを数学的に捉え，方程式を問題解決に活用すること。"
              - code: "8452503130000000"
                text: "［用語・記号］"
                items:
                  - code: "8452503131000000"
                    text: "二項定理"
                  - code: "8452503132000000"
                    text: "虚数"
                  - code: "8452503133000000"
                    text: "i"
          - code: "8452503200000000"
            text: |-
              (2) 図形と方程式
              図形と方程式について，数学的活動を通して，その有用性を認識するとともに，次の事項を身に付けることができるよう指導する。
            items:
              - code: "8452503210000000"
                text: "ア　次のような知識及び技能を身に付けること。"
                items:
                  - code: "8452503211000000"
                    text: "(ア) 座標を用いて，平面上の線分を内分する点，外分する点の位置や二点間の距離を表すこと。"
                  - code: "8452503212000000"
                    text: "(イ) 座標平面上の直線や円を方程式で表すこと。"
                  - code: "8452503213000000"
                    text: "(ウ) 軌跡について理解し，簡単な場合について軌跡を求めること。"
                  - code: "8452503214000000"
                    text: "(エ) 簡単な場合について，不等式の表す領域を求めたり領域を不等式で表したりすること。"
              - code: "8452503220000000"
                text: "イ　次のような思考力，判断力，表現力等を身に付けること。"
                items:
                  - code: "8452503221000000"
                    text: "(ア) 座標平面上の図形について構成要素間の関係に着目し，それを方程式を用いて表現し，図形の性質や位置関係について考察すること。"
                  - code: "8452503222000000"
                    text: "(イ) 数量と図形との関係などに着目し，日常の事象や社会の事象などを数学的に捉え，コンピュータなどの情報機器を用いて軌跡や不等式の表す領域を座標平面上に表すなどして，問題解決に活用したり，解決の過程を振り返って事象の数学的な特徴や他の事象との関係を考察したりすること。"
          - code: "8452503300000000"
            text: |-
              (3) 指数関数・対数関数
              指数関数及び対数関数について，数学的活動を通して，その有用性を認識するとともに，次の事項を身に付けることができるよう指導する。
            items:
              - code: "8452503310000000"
                text: "ア　次のような知識及び技能を身に付けること。"
                items:
                  - code: "8452503311000000"
                    text: "(ア) 指数を正の整数から有理数へ拡張する意義を理解し，指数法則を用いて数や式の計算をすること。"
                  - code: "8452503312000000"
                    text: "(イ) 指数関数の値の変化やグラフの特徴について理解すること。"
                  - code: "8452503313000000"
                    text: "(ウ) 対数の意味とその基本的な性質について理解し，簡単な対数の計算をすること。"
                  - code: "8452503314000000"
                    text: "(エ) 対数関数の値の変化やグラフの特徴について理解すること。"
