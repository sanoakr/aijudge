                text: "ア　次のような知識及び技能を身に付けること。"
                items:
                  - code: "8454503111000000"
                    text: "(ア) 三角形に関する基本的な性質について理解すること。"
                  - code: "8454503112000000"
                    text: "(イ) 円に関する基本的な性質について理解すること。"
                  - code: "8454503113000000"
                    text: "(ウ) 空間図形に関する基本的な性質について理解すること。"
              - code: "8454503120000000"
                text: "イ　次のような思考力，判断力，表現力等を身に付けること。"
                items:
                  - code: "8454503121000000"
                    text: "(ア) 図形の構成要素間の関係や既に学習した図形の性質に着目し，図形の新たな性質を見いだし，その性質について論理的に考察したり説明したりすること。"
                  - code: "8454503122000000"
                    text: "(イ) コンピュータなどの情報機器を用いて図形を表すなどして，図形の性質や作図について統合的・発展的に考察すること。"
          - code: "8454503200000000"
            text: |-
              (2) 場合の数と確率
              場合の数と確率について，数学的活動を通して，その有用性を認識するとともに，次の事項を身に付けることができるよう指導する。
            items:
              - code: "8454503210000000"
                text: "ア　次のような知識及び技能を身に付けること。"
                items:
                  - code: "8454503211000000"
                    text: "(ア) 集合の要素の個数に関する基本的な関係や和の法則，積の法則などの数え上げの原則について理解すること。"
                  - code: "8454503212000000"
                    text: "(イ) 具体的な事象を基に順列及び組合せの意味を理解し，順列の総数や組合せの総数を求めること。"
                  - code: "8454503213000000"
                    text: "(ウ) 確率の意味や基本的な法則についての理解を深め，それらを用いて事象の確率や期待値を求めること。"
                  - code: "8454503214000000"
                    text: "(エ) 独立な試行の意味を理解し，独立な試行の確率を求めること。"
                  - code: "8454503215000000"
                    text: "(オ) 条件付き確率の意味を理解し，簡単な場合について条件付き確率を求めること。"
              - code: "8454503220000000"
                text: "イ　次のような思考力，判断力，表現力等を身に付けること。"
                items:
                  - code: "8454503221000000"
                    text: "(ア) 事象の構造などに着目し，場合の数を求める方法を多面的に考察すること。"
                  - code: "8454503222000000"
                    text: "(イ) 確率の性質や法則に着目し，確率を求める方法を多面的に考察すること。"
                  - code: "8454503223000000"
                    text: "(ウ) 確率の性質などに基づいて事象の起こりやすさを判断したり，期待値を意思決定に活用したりすること。"
              - code: "8454503230000000"
                text: "［用語・記号］　"
                items:
                  - code: "8454503231000000"
                    text: "nPr"
                  - code: "8454503232000000"
                    text: "nCr"
                  - code: "8454503233000000"
                    text: "階乗"
                  - code: "8454503234000000"
                    text: "n!"
                  - code: "8454503235000000"
                    text: "排反"
          - code: "8454503300000000"
            text: |-
              (3) 数学と人間の活動
              数学と人間の活動について，数学的活動を通して，それらを数理的に考察することの有用性を認識するとともに，次の事項を身に付けることができるよう指導する。
            items:
              - code: "8454503310000000"
                text: "ア　次のような知識及び技能を身に付けること。"
                items:
                  - code: "8454503311000000"
                    text: "(ア) 数量や図形に関する概念などと人間の活動との関わりについて理解すること。"
                  - code: "8454503312000000"
                    text: "(イ) 数学史的な話題，数理的なゲームやパズルなどを通して，数学と文化との関わりについての理解を深めること。"
              - code: "8454503320000000"
                text: "イ　次のような思考力，判断力，表現力等を身に付けること。"
                items:
                  - code: "8454503321000000"
                    text: "(ア) 数量や図形に関する概念などを，関心に基づいて発展させ考察すること。"
                  - code: "8454503322000000"
                    text: "(イ) パズルなどに数学的な要素を見いだし，目的に応じて数学を活用して考察すること。"
      - code: "8454505000000000"
        text: "３　内容の取扱い"
        items:
          - code: "8454505100000000"
            text: "(1) この科目は，内容の(1)から(3)までの中から適宜選択させるものとする。"
          - code: "8454505200000000"
            text: "(2) 内容の(2)のアの(ウ)及び(オ)並びにイの(イ)の確率については，論理的な確率及び頻度確率を扱うものとする。"
          - code: "8454505300000000"
            text: "(3) 内容の(3)の指導に当たっては，数学的活動を一層重視し，生徒の関心や多様な考えを生かした学習が行われるよう配慮するものとする。"
          - code: "8454505400000000"
            text: "(4) 内容の(3)のアでは，整数の約数や倍数，ユークリッドの互除法や二進法，平面や空間において点の位置を表す座標の考え方などについても扱うものとする。"
  - name: "数学Ｂ"
    code: "8455500000000000"
    items:
      - code: "8455502000000000"
        text: |-
          １　目標
          数学的な見方・考え方を働かせ，数学的活動を通して，数学的に考える資質・能力を次のとおり育成することを目指す。
        items:
          - code: "8455502100000000"
            text: "(1) 数列，統計的な推測についての基本的な概念や原理・法則を体系的に理解するとともに，数学と社会生活との関わりについて認識を深め，事象を数学化したり，数学的に解釈したり，数学的に表現・処理したりする技能を身に付けるようにする。"
          - code: "8455502200000000"
            text: "(2) 離散的な変化の規則性に着目し，事象を数学的に表現し考察する力，確率分布や標本分布の性質に着目し，母集団の傾向を推測し判断したり，標本調査の方法や結果を批判的に考察したりする力，日常の事象や社会の事象を数学化し，問題を解決したり，解決の過程や結果を振り返って考察したりする力を養う。"
          - code: "8455502300000000"
            text: "(3) 数学のよさを認識し数学を活用しようとする態度，粘り強く柔軟に考え数学的論拠に基づいて判断しようとする態度，問題解決の過程を振り返って考察を深めたり，評価・改善したりしようとする態度や創造性の基礎を養う。"
      - code: "8455503000000000"
        text: "２　内容"
        items:
          - code: "8455503100000000"
            text: |-
              (1) 数列
              数列について，数学的活動を通して，その有用性を認識するとともに，次の事項を身に付けることができるよう指導する。
            items:
              - code: "8455503110000000"
                text: "ア　次のような知識及び技能を身に付けること。"
                items:
                  - code: "8455503111000000"
                    text: "(ア) 等差数列と等比数列について理解し，それらの一般項や和を求めること。"
                  - code: "8455503112000000"
                    text: "(イ) いろいろな数列の一般項や和を求める方法について理解すること。"
                  - code: "8455503113000000"
                    text: "(ウ) 漸化式について理解し，事象の変化を漸化式で表したり，簡単な漸化式で表された数列の一般項を求めたりすること。"
                  - code: "8455503114000000"
                    text: "(エ) 数学的帰納法について理解すること。"
              - code: "8455503120000000"
                text: "イ　次のような思考力，判断力，表現力等を身に付けること。"
                items:
                  - code: "8455503121000000"
                    text: "(ア) 事象から離散的な変化を見いだし，それらの変化の規則性を数学的に表現し考察すること。"
                  - code: "8455503122000000"
                    text: "(イ) 事象の再帰的な関係に着目し，日常の事象や社会の事象などを数学的に捉え，数列の考えを問題解決に活用すること。"
                  - code: "8455503123000000"
                    text: "(ウ) 自然数の性質などを見いだし，それらを数学的帰納法を用いて証明するとともに，他の証明方法と比較し多面的に考察すること。"
              - code: "8455503130000000"
                text: "［用語・記号］"
                items:
                  - code: "8455503131000000"
                    text: "∑"
          - code: "8455503200000000"
            text: |-
              (2) 統計的な推測
              統計的な推測について，数学的活動を通して，その有用性を認識するとともに，次の事項を身に付けることができるよう指導する。
            items:
              - code: "8455503210000000"
                text: "ア　次のような知識及び技能を身に付けること。"
                items:
                  - code: "8455503211000000"
                    text: "(ア) 標本調査の考え方について理解を深めること。"
                  - code: "8455503212000000"
                    text: "(イ) 確率変数と確率分布について理解すること。"
                  - code: "8455503213000000"
                    text: "(ウ) 二項分布と正規分布の性質や特徴について理解すること。"
                  - code: "8455503214000000"
                    text: "(エ) 正規分布を用いた区間推定及び仮説検定の方法を理解すること。"
              - code: "8455503220000000"
                text: "イ　次のような思考力，判断力，表現力等を身に付けること。"
                items:
                  - code: "8455503221000000"
                    text: "(ア) 確率分布や標本分布の特徴を，確率変数の平均，分散，標準偏差などを用いて考察すること。"
                  - code: "8455503222000000"
                    text: "(イ) 目的に応じて標本調査を設計し，収集したデータを基にコンピュータなどの情報機器を用いて処理するなどして，母集団の特徴や傾向を推測し判断するとともに，標本調査の方法や結果を批判的に考察すること。"
              - code: "8455503230000000"
                text: "［用語・記号］"
                items:
                  - code: "8455503231000000"
                    text: "信頼区間"
                  - code: "8455503232000000"
                    text: "有意水準"
          - code: "8455503300000000"
            text: |-
              (3) 数学と社会生活
              数学と社会生活について，数学的活動を通して，それらを数理的に考察することの有用性を認識するとともに，次の事項を身に付けることができるよう指導する。
            items:
              - code: "8455503310000000"
                text: "ア　次のような知識及び技能を身に付けること。"
                items:
                  - code: "8455503311000000"
                    text: "(ア) 社会生活などにおける問題を，数学を活用して解決する意義について理解すること。"
                  - code: "8455503312000000"
                    text: "(イ) 日常の事象や社会の事象などを数学化し，数理的に問題を解決する方法を知ること。"
              - code: "8455503320000000"
                text: "イ　次のような思考力，判断力，表現力等を身に付けること。"
                items:
                  - code: "8455503321000000"
                    text: "(ア) 日常の事象や社会の事象において，数・量・形やそれらの関係に着目し，理想化したり単純化したりして，問題を数学的に表現すること。"
                  - code: "8455503322000000"
                    text: "(イ) 数学化した問題の特徴を見いだし，解決すること。"
                  - code: "8455503323000000"
                    text: "(ウ) 問題解決の過程や結果の妥当性について批判的に考察すること。"
                  - code: "8455503324000000"
                    text: "(エ) 解決過程を振り返り，そこで用いた方法を一般化して，他の事象に活用すること。"
      - code: "8455505100000000"
        text: "(1) この科目は，内容の(1)から(3)までの中から適宜選択させるものとする。"
      - code: "8455505200000000"
        text: "(2) 内容の(3)の指導に当たっては，数学的活動を一層重視し，生徒の関心や多様な考えを生かした学習が行われるよう配慮するものとする。"
      - code: "8455505300000000"
        text: "(3) 内容の(3)のアの(イ)については，散布図に表したデータを関数とみなして処理することも扱うものとする。"
        items:
          - code: "8455505324000000"
            text: "３　内容の取扱い"
  - name: "数学Ｃ"
    code: "8456500000000000"
    items:
      - code: "8456502000000000"
        text: |-
          １　目標
          数学的な見方・考え方を働かせ，数学的活動を通して，数学的に考える資質・能力を次のとおり育成することを目指す。
        items:
          - code: "8456502100000000"
            text: "(1) ベクトル，平面上の曲線と複素数平面についての基本的な概念や原理・法則を体系的に理解するとともに，数学的な表現の工夫について認識を深め，事象を数学化したり，数学的に解釈したり，数学的に表現・処理したりする技能を身に付けるようにする。"
          - code: "8456502200000000"
            text: "(2) 大きさと向きをもった量に着目し，演算法則やその図形的な意味を考察する力，図形や図形の構造に着目し，それらの性質を統合的・発展的に考察する力，数学的な表現を用いて事象を簡潔・明瞭・的確に表現する力を養う。"
          - code: "8456502300000000"
            text: "(3) 数学のよさを認識し数学を活用しようとする態度，粘り強く柔軟に考え数学的論拠に基づいて判断しようとする態度，問題解決の過程を振り返って考察を深めたり，評価・改善したりしようとする態度や創造性の基礎を養う。"
      - code: "8456503000000000"
        text: "２　内容"
        items:
          - code: "8456503100000000"
            text: |-
              (1) ベクトル
              ベクトルについて，数学的活動を通して，その有用性を認識するとともに，次の事項を身に付けることができるよう指導する。
            items:
              - code: "8456503110000000"
                text: "ア　次のような知識及び技能を身に付けること。"
                items:
                  - code: "8456503111000000"
                    text: "(ア) 平面上のベクトルの意味，相等，和，差，実数倍，位置ベクトル，ベクトルの成分表示について理解すること。"
                  - code: "8456503112000000"
                    text: "(イ) ベクトルの内積及びその基本的な性質について理解すること。"
                  - code: "8456503113000000"
                    text: "(ウ) 座標及びベクトルの考えが平面から空間に拡張できることを理解すること。"
              - code: "8456503120000000"
                text: "イ　次のような思考力，判断力，表現力等を身に付けること。"
                items:
                  - code: "8456503121000000"
                    text: "(ア) 実数などの演算の法則と関連付けて，ベクトルの演算法則を考察すること。"
                  - code: "8456503122000000"
                    text: "(イ) ベクトルやその内積の基本的な性質などを用いて，平面図形や空間図形の性質を見いだしたり，多面的に考察したりすること。"
                  - code: "8456503123000000"
                    text: "(ウ) 数量や図形及びそれらの関係に着目し，日常の事象や社会の事象などを数学的に捉え，ベクトルやその内積の考えを問題解決に活用すること。"
          - code: "8456503200000000"
            text: |-
              (2) 平面上の曲線と複素数平面
              平面上の曲線と複素数平面について，数学的活動を通して，その有用性を認識するとともに，次の事項を身に付けることができるよう指導する。
            items:
              - code: "8456503210000000"
                text: "ア　次のような知識及び技能を身に付けること。"
                items:
                  - code: "8456503211000000"
                    text: "(ア) 放物線，楕(だ)円，双曲線が二次式で表されること及びそれらの二次曲線の基本的な性質について理解すること。"
                  - code: "8456503212000000"
                    text: "(イ) 曲線の媒介変数表示について理解すること。"
                  - code: "8456503213000000"
                    text: "(ウ) 極座標の意味及び曲線が極方程式で表されることについて理解すること。"
                  - code: "8456503214000000"
                    text: "(エ) 複素数平面と複素数の極形式，複素数の実数倍，和，差，積及び商の図形的な意味を理解すること。"
                  - code: "8456503215000000"
                    text: "(オ) ド・モアブルの定理について理解すること。"
              - code: "8456503220000000"
                text: "イ　次のような思考力，判断力，表現力等を身に付けること。"
                items:
                  - code: "8456503221000000"
                    text: "(ア) 放物線，楕(だ)円，双曲線を相互に関連付けて捉え，考察すること。"
                  - code: "8456503222000000"
                    text: "(イ) 複素数平面における図形の移動などと関連付けて，複素数の演算や累乗根などの意味を考察すること。"
                  - code: "8456503223000000"
                    text: "(ウ) 日常の事象や社会の事象などを数学的に捉え，コンピュータなどの情報機器を用いて曲線を表すなどして，媒介変数や極座標及び複素数平面の考えを問題解決に活用したり，解決の過程を振り返って事象の数学的な特徴や他の事象との関係を考察したりすること。"
              - code: "8456503230000000"
                text: "［用語・記号］"
                items:
                  - code: "8456503231000000"
                    text: "焦点"
                  - code: "8456503232000000"
                    text: "準線"
          - code: "8456503300000000"
            text: |-
              (3) 数学的な表現の工夫
              数学的な表現の工夫について，数学的活動を通して，その有用性を認識するとともに，次の事項を身に付けることができるよう指導する。
            items:
              - code: "8456503310000000"
                text: "ア　次のような知識及び技能を身に付けること。"
                items:
                  - code: "8456503311000000"
                    text: "(ア) 日常の事象や社会の事象などを，図，表，統計グラフなどを用いて工夫して表現することの意義を理解すること。"
                  - code: "8456503312000000"
                    text: "(イ) 日常の事象や社会の事象などを，離散グラフや行列を用いて工夫して表現することの意義を理解すること。"
              - code: "8456503320000000"
                text: "イ　次のような思考力，判断力，表現力等を身に付けること。"
                items:
                  - code: "8456503321000000"
                    text: "(ア) 図，表，統計グラフ，離散グラフ及び行列などを用いて，日常の事象や社会の事象などを数学的に表現し，考察すること。"
      - code: "8456505000000000"
        text: "３　内容の取扱い"
        items:
          - code: "8456505100000000"
            text: "(1) この科目は，内容の(1)から(3)までの中から適宜選択させるものとする。"
          - code: "8456505200000000"
            text: "(2) 内容の(3)の指導に当たっては，数学的活動を一層重視し，生徒の関心や多様な考えを生かした学習が行われるよう配慮するものとする。"
