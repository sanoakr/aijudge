                text: "イ　次のような思考力，判断力，表現力等を身に付けること。"
                items:
                  - code: "8452503321000000"
                    text: "(ア) 指数と対数を相互に関連付けて考察すること。"
                  - code: "8452503322000000"
                    text: "(イ) 指数関数及び対数関数の式とグラフの関係について，多面的に考察すること。"
                  - code: "8452503323000000"
                    text: "(ウ) 二つの数量の関係に着目し，日常の事象や社会の事象などを数学的に捉え，問題を解決したり，解決の過程を振り返って事象の数学的な特徴や他の事象との関係を考察したりすること。"
              - code: "8452503330000000"
                text: "［用語・記号］"
                items:
