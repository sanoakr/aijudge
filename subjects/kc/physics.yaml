# 知識要素（KC）の骨格 — 名前空間 `physics`
#
# 高校物理（物理基礎・物理）と大学の物理学を、**1 つの名前空間**に入れてある。
# 理由は `math.yaml` と同じ ── 科目名を第 1 階層にすると KC の同一性が告示の
# 版に張り付く。物理も原子分野の扱いは課程によって出入りしてきた。
#
# 階層は 3 段。`名前空間.分野.単位.知識要素`
#
#     physics . mechanics . third_law . action_reaction_continuous
#     physics . electromagnetism . induction . faraday_law
#     physics . experiment_observation . uncertainty . error_propagation
#
# 第 1 階層はどこから来たか
# ------------------------
# **日本学術会議「大学教育の分野別質保証のための教育課程編成上の参照基準
# 物理学・天文学分野」（2016 年 10 月 3 日）の「基本的内容」。** 数学の参照基準と
# 違い、こちらは分野を**列挙している**:
#
#     基本的内容: 力学、熱力学・統計力学、電磁気学、特殊相対論、量子力学、実験・観測
#     適宜選択:   素粒子、原子核、物性、光学、流体、弾性体、プラズマ、生物物理、天文・宇宙
#
# ここに 2 つだけ判断が入っている。
#
# - **`waves`（波動）を独立させた。** 上の列挙には無いが、同じ参照基準の
#   学修目標 3) が「波の性質を理解し、…基本法則から波動方程式を導出し」と
#   独立に立てており、高校では「波」が大項目である。力学の下に押し込むと
#   音と光の干渉が別々の枝に散る
# - **`computational_physics`（計算物理）と `physics_history`（概念形成の歴史）を
#   足した。** それぞれ学修目標 14) と 12) が明示している（前者は第 3 章でも
#   「計算物理学」を分野として挙げている）
#
# **天文学は入れていない。** 参照基準は「物理学・天文学分野」として一体だが、
# 高校では天体は「地学」という別教科であり、この骨格は物理に閉じる。
# ただし**引いた線は消さずに残す** ── ファイル末尾に分野の枝を
# コメントアウトして置いてあるので、天文学の科目が要るようになったら
# コメントを外して `kc seed` を走らせ直せばよい（骨格は追記のみで増える）。
#
# **物理数学は分野にしていない。** 学修目標 13) が挙げる微分積分・微分方程式・
# ベクトル解析・線形代数・複素関数論・フーリエ解析は `math` 名前空間にある。
# 科目プロファイルで `kc_namespaces: [physics, math]` と両方宣言すればよく、
# ここに複製すると `math.calculus.…` と `physics.math.…` が並ぶ ── 骨格が
# 防ごうとしている分裂そのものである。
#
# 第 2 階層はどこから来たか ── ここも正直に言う
# ---------------------------------------------
# **`mechanics` の最初の 6 単位だけが原典そのまま。** Force Concept Inventory
# （Hestenes, Wells & Swackhamer, *The Physics Teacher* 30(3), 1992）の Table I が
# 力の概念を 6 次元 ── Kinematics / First Law / Second Law / Third Law /
# Superposition Principle / Kinds of Force ── に分解しており、**下位項目まで
# 表になっている**（5S 固体接触・5F 流体接触・5G 重力…）。切り方が「何が
# できれば身に付いたと言えるか」なので、そのまま単位と知識要素になる。
#
# **ただし FCI が覆うのは力の概念だけ。** エネルギー・運動量・剛体・振動・
# 万有引力は Table I に 1 行も無い。力学の残り 5 単位は判断である。
#
# **電磁気と熱には、FCI Table I に相当する階層表が無い。** CSEM
# （Maloney et al. 2001、32 問）も TCE（Yeo & Zadnik 2001、26 問）も検証済みの
# 測定器だが、公表されているのは項目と概念の対応であって枝の構造ではない。
# #187 は「その枝を書く前に確かめること」と書いていた ── 確かめた結果が
# これで、`electromagnetism` と `thermodynamics` の単位は判断である。
# 残りの分野も同じ。**持っていない権威を持っているように見せないために
# 書いておく。**
#
# 第 3 階層（知識要素）は推奨候補
# ------------------------------
# 高校範囲は学習指導要領（平成30年告示）物理基礎・物理の指導事項から起こした。
# 原典は `reference/kokuji_h30_physics.yaml` にコード付きで置いてある。
# 行末の `# 物理基礎(1)(イ)㋐` のような注記が対応で、**告示が動いたら注記を
# 直す。キーは動かさない。**
#
# 理科の指導事項は数学より KC の粒度に近い（末端に見出しが付いている）が、
# そのままではない ── 「㋐ 様々な力」の 1 行は重力・垂直抗力・摩擦力・張力・
# 弾性力を含み、FCI の言う Kinds of Force の下位概念すべてに当たる。
#
# 手を入れるときの約束
# --------------------
# - **キーを変えない。** KC の ID はキーから導かれ、Q-matrix は追記のみ（P8）。
#   誤りは `deprecated` にして `superseded_by` で後継を指す
# - ラベルと説明は直してよい（ID に効かない）
# - **科目ごとに足さない。** 骨格はコースをまたいで共有される語彙である
#
# 投入:
#     uv run aijudge-admin kc seed --namespace physics

namespace: physics
source: >-
  日本学術会議「大学教育の分野別質保証のための教育課程編成上の参照基準
  物理学・天文学分野」平成28年（2016年）10月3日 ── 第 1 階層は同報告の
  「基本的内容」と「適宜選択」の分野（天文学を除く。`waves`・
  `computational_physics`・`physics_history` は学修目標 3) 14) 12) による追加）。
  第 2 階層は `mechanics` の 6 単位が Force Concept Inventory (Hestenes, Wells &
  Swackhamer 1992) Table I そのまま、**残りは標準的なカリキュラム構成からの判断**。
  高校範囲の第 3 階層は高等学校学習指導要領（平成30年告示）物理基礎・物理による。
reference: reference/kokuji_h30_physics.yaml

areas:
  - key: mechanics
    label: 力学
    en: Mechanics
    units:
      # ----------------------------------------------------------------
      # ここから 6 単位は FCI Table I（Newtonian Concepts in the Inventory）
      # の 0.〜5. そのまま。第 2 階層に判断が入っていないのはここだけである。
      # ----------------------------------------------------------------
      - key: kinematics
        label: 運動の表し方
        en: Kinematics
        components:
          - {key: position, label: 位置と変位}
          - {key: velocity, label: 速度}                        # FCI 0（位置と速度の区別）
          - {key: acceleration, label: 加速度}                  # FCI 0（速度と加速度の区別）／物理基礎(1)(ア)㋒
          - {key: motion_representation, label: 運動の表し方}    # 物理基礎(1)(ア)㋑
          - {key: motion_graph, label: 運動のグラフ表示}
          - {key: uniform_acceleration, label: 等加速度直線運動}
          - {key: free_fall, label: 物体の落下運動}             # 物理基礎(1)(イ)㋓
          - {key: vector_addition_of_velocities, label: 速度の合成}  # FCI 0
          - {key: relative_velocity, label: 相対速度}
          - {key: projectile_motion, label: 放物運動}           # 物理(1)(ア)㋑／FCI 0（放物軌道）
          - {key: curvilinear_motion, label: 曲線運動の速度と加速度}  # 物理(1)(ア)㋐
      - key: first_law
        label: 慣性の法則
        en: Newton's First Law
        components:
          - {key: inertia, label: 慣性}
          - {key: no_force_constant_direction, label: 力が働かないとき向きは変わらない}  # FCI 1
          - {key: no_force_constant_speed, label: 力が働かないとき速さは変わらない}      # FCI 1
          - {key: cancelling_forces_motion, label: 力がつり合うときの運動}              # FCI 1
          - {key: inertial_frame, label: 慣性系}
      - key: second_law
        label: 運動の法則
        en: Newton's Second Law
        components:
          - {key: equation_of_motion, label: 運動方程式}        # 物理基礎(1)(イ)㋒
          - {key: constant_force_constant_acceleration, label: 一定の力は一定の加速度を生む}  # FCI 2
          - {key: impulsive_force, label: 撃力}                 # FCI 2
          - {key: mass_as_inertia, label: 質量と慣性}
          - {key: free_body_diagram, label: 力の図示}
      - key: third_law
        label: 作用反作用の法則
        en: Newton's Third Law
        components:
          - {key: action_reaction_impulsive, label: 撃力に対する作用反作用}   # FCI 3
          - {key: action_reaction_continuous, label: 連続的な力に対する作用反作用}  # FCI 3
          - {key: force_pair_identification, label: 力の対の同定}
      - key: superposition
        label: 力の重ね合わせ
        en: Superposition Principle
        components:
          - {key: vector_sum_of_forces, label: 力のベクトル和}   # FCI 4
          - {key: cancelling_forces, label: つり合う力}         # FCI 4／物理基礎(1)(イ)㋑
          - {key: force_decomposition, label: 力の分解}
          - {key: equilibrium_condition, label: 力のつり合いの条件}  # 物理基礎(1)(イ)㋑
      - key: kinds_of_force
        label: 力の種類
        en: Kinds of Force
        components:
          - {key: various_forces, label: 物体に働く様々な力}     # 物理基礎(1)(イ)㋐
          - {key: normal_force, label: 垂直抗力}                # FCI 5S（受動的な接触力）
          - {key: friction, label: 摩擦力}                      # FCI 5S（摩擦は運動を妨げる）
          - {key: static_kinetic_friction, label: 静止摩擦と動摩擦}
          - {key: tension, label: 張力}
          - {key: elastic_force, label: 弾性力とフックの法則}
          - {key: air_resistance, label: 空気の抵抗}            # FCI 5F
          - {key: buoyancy, label: 浮力}                        # FCI 5F
          - {key: gravity_weight, label: 重力と重さ}            # FCI 5G
          - {key: fall_independent_of_weight, label: 落下の加速度は重さによらない}  # FCI 5G
      # ----------------------------------------------------------------
      # ここから下は FCI の外 ── Table I はエネルギーにも運動量にも
      # 剛体にも 1 行も触れていない。判断である。
      # ----------------------------------------------------------------
      - key: work_energy
        label: 仕事とエネルギー
        en: Work and Energy
        components:
          - {key: work, label: 仕事}
          - {key: kinetic_energy, label: 運動エネルギー}         # 物理基礎(1)(ウ)㋐
          - {key: potential_energy, label: 位置エネルギー}       # 物理基礎(1)(ウ)㋐
          - {key: elastic_potential_energy, label: 弾性エネルギー}
          - {key: conservation_of_mechanical_energy, label: 力学的エネルギーの保存}  # 物理基礎(1)(ウ)㋑
          - {key: work_energy_theorem, label: 仕事とエネルギーの関係}
          - {key: power, label: 仕事率}
          - {key: conservative_force, label: 保存力}
          - {key: energy_dissipation, label: 摩擦によるエネルギーの散逸}
      - key: momentum
        label: 運動量
        en: Momentum
        components:
          - {key: momentum, label: 運動量}
          - {key: impulse, label: 力積}
          - {key: impulse_momentum_relation, label: 運動量と力積の関係}  # 物理(1)(イ)㋐
          - {key: conservation_of_momentum, label: 運動量の保存}      # 物理(1)(イ)㋑
          - {key: collision, label: 衝突と反発係数}                   # 物理(1)(イ)㋒
          - {key: energy_in_collision, label: 衝突における力学的エネルギーの変化}  # 物理(1)(イ)㋒
          - {key: center_of_mass, label: 重心の運動}
      - key: rigid_body
        label: 剛体
        en: Rigid Bodies
        components:
          - {key: torque, label: 力のモーメント}
          - {key: rigid_equilibrium, label: 剛体のつり合いの条件}   # 物理(1)(ア)㋒
          - {key: center_of_gravity, label: 重心}
          - {key: couple, label: 偶力}
          - {key: moment_of_inertia, label: 慣性モーメント}
          - {key: rotational_equation, label: 回転の運動方程式}
          - {key: angular_momentum, label: 角運動量}
          - {key: conservation_of_angular_momentum, label: 角運動量の保存}
      - key: circular_and_oscillation
        label: 円運動と単振動
        en: Circular Motion and Oscillation
        components:
          - {key: uniform_circular_motion, label: 等速円運動}       # 物理(1)(ウ)㋐
          - {key: angular_velocity, label: 角速度と周期}
          - {key: centripetal_force, label: 向心力}                 # 物理(1)(ウ)㋐
          - {key: inertial_force, label: 慣性力と遠心力}
          - {key: simple_harmonic_motion, label: 単振動}            # 物理(1)(ウ)㋑
          - {key: spring_oscillation, label: ばね振り子}
          - {key: simple_pendulum, label: 単振り子}
          - {key: energy_of_oscillation, label: 振動のエネルギー}
          - {key: damped_forced_oscillation, label: 減衰振動と強制振動}
          - {key: resonance, label: 共振}
      - key: gravitation
        label: 万有引力
        en: Gravitation
        components:
          - {key: kepler_laws, label: 惑星の運動の法則}            # 物理(1)(エ)㋐
          - {key: universal_gravitation, label: 万有引力の法則}     # 物理(1)(エ)㋑
          - {key: gravitational_potential, label: 万有引力による位置エネルギー}
          - {key: satellite_motion, label: 人工衛星の運動}
          - {key: escape_velocity, label: 脱出速度}
      - key: analytical_mechanics
        label: 解析力学
        en: Analytical Mechanics
        components:
          - {key: generalized_coordinates, label: 一般化座標}
          - {key: variational_principle, label: 変分原理}
          - {key: lagrangian, label: ラグランジアン}
          - {key: euler_lagrange, label: オイラー・ラグランジュ方程式}
          - {key: hamiltonian, label: ハミルトニアン}
          - {key: canonical_equations, label: 正準方程式}
          - {key: symmetry_and_conservation, label: 対称性と保存則}

  - key: waves
    label: 波動
    en: Waves
    units:
      - key: wave_basics
        label: 波の性質
        en: Properties of Waves
        components:
          - {key: wave_phenomenon, label: 波の性質}                # 物理基礎(2)(ア)㋐
          - {key: wave_representation, label: 波の伝わり方とその表し方}  # 物理(2)(ア)㋐
          - {key: amplitude_wavelength_period, label: 振幅・波長・周期}
          - {key: wave_speed, label: 波の速さと振動数}
          - {key: transverse_longitudinal, label: 横波と縦波}
          - {key: wave_equation, label: 波動方程式}
          - {key: traveling_wave, label: 進行波}
          - {key: standing_wave, label: 定在波}
      - key: superposition_and_interference
        label: 重ね合わせと干渉
        en: Superposition and Interference
        components:
          - {key: wave_superposition, label: 波の重ね合わせ}
          - {key: interference, label: 干渉}                       # 物理(2)(ア)㋑
          - {key: diffraction, label: 回折}                        # 物理(2)(ア)㋑
          - {key: reflection_and_transmission, label: 反射と透過}
          - {key: free_and_fixed_end, label: 自由端と固定端}
          - {key: huygens_principle, label: ホイヘンスの原理}
          - {key: beat, label: うなり}
      - key: sound
        label: 音
        en: Sound
        components:
          - {key: sound_wave, label: 音波の性質}                   # 物理基礎(2)(ア)㋑
          - {key: string_vibration, label: 弦の振動}               # 物理基礎(2)(ア)㋑
          - {key: air_column_resonance, label: 気柱の共鳴}         # 物理基礎(2)(ア)㋑
          - {key: sound_interference_diffraction, label: 音の干渉と回折}  # 物理(2)(イ)㋐
          - {key: doppler_effect, label: ドップラー効果}           # 物理(2)(イ)㋑
          - {key: sound_intensity, label: 音の強さと高さ}
      - key: wave_analysis
        label: 波の解析
        en: Analysis of Waves
        components:
          - {key: fourier_decomposition, label: フーリエ分解}
          - {key: dispersion, label: 分散}
          - {key: phase_and_group_velocity, label: 位相速度と群速度}
          - {key: wave_packet, label: 波束}

  - key: thermodynamics
    label: 熱力学・統計力学
    en: Thermodynamics and Statistical Mechanics
    units:
      - key: heat_and_temperature
        label: 熱と温度
        en: Heat and Temperature
        components:
          - {key: heat_and_temperature, label: 熱と温度}           # 物理基礎(2)(イ)㋐
          - {key: thermal_motion, label: 原子・分子の熱運動}       # 物理基礎(2)(イ)㋐
          - {key: absolute_temperature, label: 絶対温度}
          - {key: thermal_equilibrium, label: 熱平衡と熱力学第 0 法則}
          - {key: heat_capacity, label: 熱容量と比熱}
          - {key: latent_heat, label: 潜熱と状態変化}
          - {key: thermal_expansion, label: 熱膨張}
          - {key: heat_transfer, label: 熱の移動}                  # 物理基礎(2)(イ)㋑
      - key: first_law_thermo
        label: 熱力学第 1 法則
        en: First Law of Thermodynamics
        components:
          - {key: internal_energy, label: 内部エネルギー}          # 物理(1)(オ)㋑
          - {key: work_by_gas, label: 気体のする仕事}
          - {key: first_law, label: 熱力学第 1 法則}
          - {key: heat_work_conversion, label: 熱と仕事の変換}     # 物理基礎(2)(イ)㋑
          - {key: state_change_of_gas, label: 気体の状態変化}      # 物理(1)(オ)㋒
          - {key: adiabatic_process, label: 断熱変化}
          - {key: heat_engine, label: 熱機関とサイクル}
          - {key: thermal_efficiency, label: 熱効率}
      - key: second_law_entropy
        label: 熱力学第 2 法則とエントロピー
        en: Second Law and Entropy
        components:
          - {key: irreversible_process, label: 不可逆過程}
          - {key: second_law, label: 熱力学第 2 法則}
          - {key: carnot_cycle, label: カルノーサイクル}
          - {key: entropy, label: エントロピー}
          - {key: entropy_increase, label: エントロピー増大の原理}
          - {key: free_energy, label: 自由エネルギー}
          - {key: third_law, label: 熱力学第 3 法則}
      - key: kinetic_theory
        label: 気体分子運動論
        en: Kinetic Theory of Gases
        components:
          - {key: ideal_gas_law, label: 理想気体の状態方程式}
          - {key: molecular_motion_and_pressure, label: 気体分子の運動と圧力}  # 物理(1)(オ)㋐
          - {key: mean_kinetic_energy, label: 分子の平均運動エネルギーと温度}
          - {key: equipartition, label: エネルギー等分配則}
          - {key: mean_free_path, label: 平均自由行程}
          - {key: real_gas, label: 実在気体}
      - key: statistical_mechanics
        label: 統計力学
        en: Statistical Mechanics
        components:
          - {key: microstate_macrostate, label: 微視状態と巨視状態}
          - {key: boltzmann_entropy, label: ボルツマンの関係式}
          - {key: ensemble, label: アンサンブル}
          - {key: partition_function, label: 分配関数}
          - {key: maxwell_boltzmann, label: マクスウェル・ボルツマン分布}
          - {key: bose_einstein, label: ボーズ・アインシュタイン分布}
          - {key: fermi_dirac, label: フェルミ・ディラック分布}
          - {key: quantum_statistics_application, label: 量子統計の応用}
      - key: phase_transition
        label: 相転移
        en: Phase Transitions
        components:
          - {key: phase_diagram, label: 相図}
          - {key: order_parameter, label: 秩序変数}
          - {key: critical_phenomena, label: 臨界現象}
          - {key: latent_heat_statistical, label: 相転移と潜熱}

  - key: electromagnetism
    label: 電磁気学
    en: Electricity and Magnetism
    units:
      - key: electrostatics
        label: 静電場
        en: Electrostatics
