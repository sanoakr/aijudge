# 知識要素（KC）の骨格 — 名前空間 `cs`
#
# CS2023（ACM/IEEE-CS/AAAI）の 17 分野すべてを、KC の粒度まで展開したもの。
#
# 階層は 3 段。`名前空間.分野.単位.知識要素`
#
#     cs . sdf . fundamentals . branching        分岐
#     cs . sdf . data_structures . array         配列
#     cs . fpl . scripting . piping              パイプによる連結
#
# **第 1・2 階層は CS2023 そのまま**（Knowledge Area / Knowledge Unit）。
# ここには誰の判断も入っていないので、原典に当たれば確かめられる。
#
# **第 3 階層は CS2023 の topic を割ったもの。** ここには判断が入っている ──
# CS2023 の topic は粒度が揃っておらず、そのままでは KC にならないため。
# たとえば SDF-Fundamentals の 3 番目は
#
#     "Basic constructs such as assignment statements, conditional and
#      iterative statements, basic I/O (using console)"
#
# で、**代入・分岐・反復・入出力の 4 つが 1 行**に入っている。一方 AL-Foundational
# は `Arrays` `Linked Lists` `Stacks` と 1 語ずつ並ぶ。同じ「topic」でも
# 粒度が桁で違うので、どこかで人が割る必要がある。
#
# **その判断はこのファイルに集約してある。** 原典は
# `reference/cs2023.yaml`（146 KU / 1120 topic）にそのまま置いてあるので、
# 「CS2023 は何と言っていたか」といつでも突き合わせられる。
#
# 割り方の基準は「何ができれば身に付いたと言えるか」（KLI フレームワークの
# 言う knowledge component）。章の題名でも教科書の節でもない。
#
# 判断が分かれた箇所は、その場にコメントを置いてある。
#
# 手を入れるときの約束
# --------------------
# - **キーを変えない。** KC の ID はキーから導かれ、Q-matrix は追記のみ（P8）。
#   誤りは `deprecated` にして `superseded_by` で後継を指す
# - ラベルと説明は直してよい（ID に効かない）
# - **科目ごとに足さない。** 骨格はコースをまたいで共有される語彙である
#
# 投入:
#     uv run aijudge-admin kc seed --namespace cs
# 何度走らせても増えない（`register` は既にあるものをそのまま返す）。

namespace: cs
source: >-
  Computer Science Curricula 2023 (CS2023), ACM / IEEE-CS / AAAI, Version Gamma, August 2023.
  https://csed.acm.org/ ── 第 1・2 階層は原典の Knowledge Area / Knowledge Unit、
  第 3 階層は原典の topic を「何ができれば身に付いたと言えるか」の粒度に割ったもの。
reference: reference/cs2023.yaml

