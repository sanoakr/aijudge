# 画像提出（デモ）— 機械の評価器が無い科目
#
# **これはデモコースのためのプロファイルである**（#194）。運用コースでは
# 使わない。
#
# **意図的に評価器を持たない。** 観点はすべて `HUMAN_SCORED` で宣言し、
# 教員が見て段階を入れる。その結果どうなるかというと ──
#
#     採点できなかった観点が残るので、**総合点は保留（withheld）になる**
#
# これは不具合ではなく、この製品の設計そのものである（P5・visibility.py）。
# 残った観点だけを比例配分した合計を出すと、学習者はそれを完成した成績
# として読む。だから出さない。
#
# **その状態がデモで見えること自体が説明になる。** 「AI が採点し、人が
# 決める」と文章で言うより、点が付かないまま「担当教員が確認します」と
# 出ている画面を 1 つ見せるほうが早い。
#
# 投入は問題セットの取り込みで、課題側がこのプロファイルを指名する（#195）
# ── コースのプロファイルとは別に持てる。

name: demo_image
description: 画像を提出する。機械の評価器は無く、教員が見て段階を入れる（総合点は保留になる）。

# デモ専用の語彙（`subjects/kc/demo.yaml`）。**`cs` を使わない** ── 除外が
# どこか 1 か所でも漏れたときに、本物の習熟度へ効かないようにするため。
kc_namespaces: [demo]

input:
  # 写真やスケッチの提出を想定する。**書き起こしはしない** ── 画像のまま
  # 教員が見る（Phase 6 の書き起こしの流れとは別物）。
  allow_handwriting: false

normalizers: []

# **空にする。** 決定的評価器も AI 評価器も無い。
#
# 空でも採点は完結する（S6 停止時の劣化動作と同じ経路・P2）── 完結した
# 結果が「人が採点する観点だけが残っている」であり、総合点は保留になる。
deterministic: []
ai_evaluators: []

aggregation: weighted_sum

review_policy:
  # 人が採点する観点しか無いので、**必ず人が見る。** 迷う余地が無い。
  #
  # `confidence_below: 1.0` で足りる ── 確信度が 1.0 を下回れば振り分ける
  # のだから、機械が何も判定していないこの科目では常に該当する。
  # （`always_review_if_weight_over: 0.0` と書きたくなるが、モデルが 0 を
  # 拒む ── 「重み 0 より大きい観点」は全観点なので、それは条件として
  # 意味を成さない、という判断が模型の側に入っている。）
  confidence_below: 1.0
  boundary_score: 0.6
  boundary_margin: 0.05

measurement:
  # **測定しない。** デモの提出は観測レコードに入らない（#197）ので、
  # 抽出しても標本にならない。0.0 にして、抽出そのものを起こさない。
  blind_sample_rate: 0.0

timeout_seconds: 120
