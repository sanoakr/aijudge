# プログラミング演習（C 言語）— prog2 相当
#
# 科目の違いはコードではなくこの宣言で表す（ADR 0002）。
# ここに並べた evaluator は entry point から発見される。
# 存在しない名前を書けばロード時に落ちる。

name: cs_lang_c_intro
description: 入門プログラミング演習。テスト実行による正誤判定を主とする。

# この科目が使う KC の名前空間（分野）。教員はここを増やせない。
kc_namespaces: [cs]

input:
  allow_handwriting: false
  # 画像の提出（認定証）から文字を読む（**採点のときに 1 回**・ADR 0022）。
  # cs_network_python と同じ設定。無いと text_pattern_check が画像提出を
  # 読めず、観点が「未宣言」相当で採点できない（prog2 ex01-3、2026-09-23）。
  transcription: image_text


# 決定的評価が先。ここで確定した観点は AI に問い合わせない（設計原則 P3）。
deterministic:
  # 字下げだけを見る観点（2026-10-11・prog2 第 4 回以降）。`{ }` の入れ子の深さと
  # 各行の字下げを突き合わせる ── LLM は呼ばない。これも**観点が名指ししたときだけ**動く。
  # 正しさと AND で組む（正しさが 0% なら評価しない）のは課題の側（`aggregation: and`）。
  # 並びは名前順 ── コースの設定画面が名前順で保存するので、ずらすと保存のたびに書き換わる。
  # AND の順序は観点の並びで決まり、ここの並びとは関係が無い（`gate_skipped`）。
  #
  # 指定の関数が定義されているか（2026-10-11・prog2 第 9 回以降）。提出のソースに検査用の
  # main() をつないで関数を直接呼ぶ。検証データは課題の `check/`（`c_function_check` あて）。
  # これも観点が名指ししたときだけ動く。関数 → 正しさ → インデントの AND で組むのは課題の側。
  - c_function_check
  - c_indent_check
  - code_test_runner
  # 画像提出の課題（認定証）。抽出器が起こした本文と、課題が宣言した文字列を
  # **決定的に**照合する（ADR 0021・ADR 0022）── LLM は呼ばない。
  # **観点が名指ししたときだけ動く**ので、プログラムの課題には効かない。
  - text_pattern_check

# AI 評価器。決定的評価が確定させた観点には呼ばれない（設計原則 P3）ので、
# 実際に走るのは「読みやすさ」の観点だけ。
# ここを空にしても採点は完結する（= S6 停止時の劣化動作、設計原則 P2）。
ai_evaluators:
  - rubric_ai_judge

evaluator_options:
  rubric_ai_judge:
    # 自己一貫性のサンプル数。多いほど確信度は信用できるが、その分遅い。
    # Phase 1 で κ と所要時間のバランスを見て決め直す。
    samples: 3
  code_test_runner:
    # 提出プログラムの言語。評価器が知っている言語のうちどれか
    # （知らない名前を書くと採点が失敗する。既定に落とすと、言語違いが
    # 「全員 0 点」として現れて原因が提出物側に見える）。
    language: c

    # テストケース 1 件あたりの実行上限（秒）。
    #
    # **下の `timeout_seconds` とは別物。** あちらは評価器 1 回の呼び出しの
    # 予算で、AI 評価器では LLM の応答待ちを含むため 120 秒取っている。
    # 同じ値を実行上限に使うと、暴走コードに 120 秒 × ケース数の猶予を
    # 与えることになる（実測でワーカーが 10 分占有された、ADR 0006）。
    #
    # 入門課題の想定計算量なら 2 秒で足りる。数値計算課題では上げる。
    case_timeout_seconds: 2.0
    compile_timeout_seconds: 30.0
  c_function_check:
    # 検査用の main() を走らせる上限。正しさの観点（code_test_runner）と同じ値にする
    # ── 片方だけ緩いと、同じ関数が一方では時間切れ、他方では通る。
    language: c
    case_timeout_seconds: 2.0
    compile_timeout_seconds: 30.0
  c_indent_check:
    # 崩れた行の割合がこれ以下なら中段（3 段の観点で 50%）、超えれば最下段。
    # 崩れが 0 行のときだけ最上段。
    partial_max_ratio: 0.2

aggregation: weighted_sum

review_policy:
  # AI 判定が割れたら人間が見る。3 回サンプリングで 2/3 一致（0.67）は通し、
  # 1/3（0.33）は通さない、という水準に置いている。
  confidence_below: 0.75
  always_review_if_weight_over: 1.0
  # 合否境界（60%）の前後 5 ポイントは人間が見る。
  boundary_score: 0.6
  boundary_margin: 0.05

# 採点性能の測定（ADR 0007）。採点エンジンはこの値を読まない。
#
# blind 採点（AI を見る前に教員が付ける）を求める提出の割合。
# 1 観点あたり 30 件の標本が要るので、1 学期の提出数から逆算する。
# 受講 50 名 × 課題 12 回 = 600 提出なら 0.05 で 30 件。
# 0.0 にすれば測定用データを集めなくなる（採点は変わらず動く）。
measurement:
  blind_sample_rate: 0.05

# 評価器 1 回の呼び出しに対する予算（秒）。
#
# AI 評価器では LLM の応答待ちを含む（ローカルモデルで 20 秒前後、
# 自己一貫性で 3 回サンプリングするのでその倍）。
#
# **テストケースの実行上限ではない。** それは
# `evaluator_options.code_test_runner.case_timeout_seconds` で別に決める。
timeout_seconds: 120
