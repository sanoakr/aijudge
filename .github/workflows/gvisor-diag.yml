# 一時的な診断（#502）。マージ前に消す。
name: gvisor-diag
on:
  push:
    branches: [test/gvisor-in-ci]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Install gVisor
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update && sudo apt-get install -y runsc
          sudo runsc install
          sudo systemctl reload docker
          runsc --version
          docker info --format '{{.CgroupDriver}} {{.CgroupVersion}} {{json .Runtimes}}'
          cat /etc/docker/daemon.json
          docker pull -q gcc:14-bookworm
      - name: Variants
        run: |
          SRC='echo "int main(void){return 0;}" > /work/a.c && cd /work && cc -std=c11 -o a a.c && ./a && echo OK'
          base="--rm --network=none --cap-drop=ALL --security-opt=no-new-privileges --workdir=/work --tmpfs=/work:rw,size=64m"
          try() {
            name="$1"; shift
            out=$(docker run $base --runtime=runsc "$@" gcc:14-bookworm sh -c "$SRC" 2>&1 | tail -2 | tr '\n' ' ')
            echo "[$name] $out"
          }
          try plain
          try memory --memory=536870912 --memory-swap=536870912
          try pids32 --pids-limit=32
          try pids64 --pids-limit=64
          try ulimit_cpu --ulimit=cpu=5
          try ulimit_fsize --ulimit=fsize=1048576
          try readonly --read-only
          try user --user=65534:65534
          try all --read-only --user=65534:65534 --pids-limit=32 --memory=536870912 --memory-swap=536870912 --ulimit=cpu=5 --ulimit=fsize=1048576 --tmpfs=/tmp:rw,noexec,nosuid,size=64m
          try all_no_fsize --read-only --user=65534:65534 --pids-limit=32 --memory=536870912 --memory-swap=536870912 --ulimit=cpu=5 --tmpfs=/tmp:rw,noexec,nosuid,size=64m
          try all_no_cpu --read-only --user=65534:65534 --pids-limit=32 --memory=536870912 --memory-swap=536870912 --ulimit=fsize=1048576 --tmpfs=/tmp:rw,noexec,nosuid,size=64m
          echo "--- runc for comparison"
          docker run $base --read-only --user=65534:65534 --pids-limit=32 --memory=536870912 --memory-swap=536870912 --ulimit=cpu=5 --ulimit=fsize=1048576 gcc:14-bookworm sh -c "$SRC" 2>&1 | tail -2
