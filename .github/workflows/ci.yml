name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # **PostgreSQL でも走らせる**（#243）。保存実装のテストは SQLite と
    # PostgreSQL の両方に同じものを当てる作りだが、`AIJUDGE_TEST_DATABASE_URL`
    # が無いと後者は 1 件も走らない ── SQLite には行ロックが無く、
    # `VARCHAR(n)` の n も強制しないので、**そこだけが守る検査が素通りする**。
    #
    # 実際に通り抜けた: 監査記録の `target_id` が 64 字で、受講登録の対
    # （73 字）が入らず本番のログインが 500 になった（#213）。CI は緑だった。
    #
    # 接続数は既定（100）のまま。同時実行のテストは 4 スレッドで 24 件を
    # 取り合うだけなので足りる ── `services` に `command` は渡せないため、
    # 増やすなら別の手が要る。
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aijudge
          POSTGRES_PASSWORD: aijudge
          POSTGRES_DB: aijudge
        options: >-
          --health-cmd "pg_isready -U aijudge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy packages/core/src

      # Architectural boundaries are a build failure, not a review comment.
      # See docs/adr/0001-modular-monolith.md
      - name: Enforce module boundaries
        run: uv run lint-imports

      # 決定的評価器はコンテナで提出物を動かす（ADR 0006）。gVisor は runner に
      # 無いので docker に固定する。pull を先にしておくのは、最初のテストが
      # 短いタイムアウト（compile_timeout_seconds 等）の中で pull 待ちに
      # なって落ちるのを防ぐため。
      - name: Pull the sandbox image
        run: docker pull gcc:14-bookworm

      - name: Test
        env:
          AIJUDGE_SANDBOX: docker
          # 保存実装のテストを PostgreSQL にも当てる（#243）。設定が無いと
          # SQLite の側だけが走る。
          AIJUDGE_TEST_DATABASE_URL: postgresql+psycopg://aijudge:aijudge@localhost:5432/aijudge
        run: uv run pytest

  # 採点精度の測定。教員採点データはリポジトリに置けない（個人情報）ので、
  # ランナーに用意がある場合だけ実測する。
  #
  # 終了コードの扱いが要点:
  #   1 (基準を下回った)   -> ビルドを落とす
  #   2 (測定できない)     -> 落とさないが、合格とも言わない
  accuracy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Measure agreement against instructor marking
        env:
          AIJUDGE_GOLDEN_DIR: ${{ vars.AIJUDGE_GOLDEN_DIR }}
          AIJUDGE_LLM_BASE_URL: ${{ vars.AIJUDGE_LLM_BASE_URL }}
        run: |
          set +e
          uv run aijudge-eval --subject cs_lang_c_intro --out accuracy.md
          code=$?
          set -e
          case $code in
            0) echo "::notice::Accuracy gates passed" ;;
            2) echo "::warning::Accuracy not measurable — no instructor marking available. This is not a pass." ;;
            *) echo "::error::Accuracy gates failed"; exit $code ;;
          esac

      - name: Publish the report
        if: always()
        run: cat accuracy.md >> "$GITHUB_STEP_SUMMARY" || true
