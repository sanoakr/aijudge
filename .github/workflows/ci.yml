name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # **PostgreSQL でも走らせる**（#243）。保存実装のテストは SQLite と
    # PostgreSQL の両方に同じものを当てる作りだが、`AIJUDGE_TEST_DATABASE_URL`
    # が無いと後者は 1 件も走らない ── SQLite には行ロックが無く、
    # `VARCHAR(n)` の n も強制しないので、**そこだけが守る検査が素通りする**。
    #
    # 実際に通り抜けた: 監査記録の `target_id` が 64 字で、受講登録の対
    # （73 字）が入らず本番のログインが 500 になった（#213）。CI は緑だった。
    #
    # 接続数は既定（100）のまま。同時実行のテストは 4 スレッドで 24 件を
    # 取り合うだけなので足りる ── `services` に `command` は渡せないため、
    # 増やすなら別の手が要る。テストは並列（`-n auto`、runner は 4 コア）だが、
    # worker は DB を分けて持ち（直下の `conftest.py`）、同時に使う接続は
    # worker の数 × 数本に留まる。
    services:
      postgres:
        # **本番と同じ版にする**（#429）。本番は PostgreSQL 18。
        image: postgres:18-alpine
        env:
          POSTGRES_USER: aijudge
          POSTGRES_PASSWORD: aijudge
          POSTGRES_DB: aijudge
        options: >-
          --health-cmd "pg_isready -U aijudge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # **`--locked`: uv.lock が pyproject とずれていたら落とす**（#423）。
      # 無いと CI はずれを黙って直して緑になり、本番の deploy だけが
      # uv.lock の書き換えで止まる（v0.35.1 から 8 リリース気づかなかった）。
      - name: Sync dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy packages/core/src packages/submission/src packages/persistence/src packages/unit_of_work/src

      # Architectural boundaries are a build failure, not a review comment.
      # See docs/adr/0001-modular-monolith.md
      - name: Enforce module boundaries
        run: uv run lint-imports

      # 決定的評価器はコンテナで提出物を動かす（ADR 0006）。pull を先にしておくのは、
      # 最初のテストが短いタイムアウト（compile_timeout_seconds 等）の中で pull 待ちに
      # なって落ちるのを防ぐため。
      - name: Pull the sandbox image
        run: docker pull gcc:14-bookworm

      # **運用機は gVisor（runsc）で採点している**（#449）。runner には無いので入れる。
      # 以前は入れずに docker に固定しており、gVisor を通る試験がどこでも自動で
      # 走っていなかった（#502）。公式の apt リポジトリから入れ、docker に runtime を
      # 登録する（`runsc install` が /etc/docker/daemon.json に書く）。
      - name: Install gVisor
        run: |
          curl -fsSL https://gvisor.dev/archive.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update
          sudo apt-get install -y runsc
          sudo runsc install
          sudo systemctl reload docker
          docker info --format '{{json .Runtimes}}'

      - name: Test
        env:
          AIJUDGE_SANDBOX: docker
          # 保存実装のテストを PostgreSQL にも当てる（#243）。設定が無いと
          # SQLite の側だけが走る。
          AIJUDGE_TEST_DATABASE_URL: postgresql+psycopg://aijudge:aijudge@localhost:5432/aijudge
        # **並列に流す**（pytest-xdist）。1 プロセスでは 15〜30 分かかり、
        # 突出して遅いテストは無かった（最長 6.7 秒・上位 40 件で全体の 2 割）ので、
        # 並列がそのまま効く。4 並列の手元の実測: 1 プロセス（SQLite のみ）8 分 →
        # PostgreSQL 込みで 3 分 10 秒。
        #
        # `loadfile`: 同じファイルのテストは同じ worker で流す。モジュール単位の
        # 準備を worker の数だけ作り直さずに済み、実測でも `load` より速かった。
        #
        # gVisor の脱出試験（`[runsc]`）は次の段で流すので、ここでは外す。
        run: uv run pytest -n auto --dist loadfile -k "not runsc"

      # 脱出試験を gVisor で。**`gvisor` を名指しするので、runsc が使えなければ
      # skip ではなく失敗になる**（`test_container.py` の `container`・#429）。
      # runner から runsc が消えても、ここが赤になる。
      - name: Test the sandbox under gVisor
        env:
          AIJUDGE_SANDBOX: gvisor
        run: uv run pytest packages/sandbox/tests/test_container.py -k runsc -v

  # 採点精度の測定。教員採点データはリポジトリに置けない（個人情報）ので、
  # ランナーに用意がある場合だけ実測する。
  #
  # 終了コードの扱いが要点:
  #   1 (基準を下回った)   -> ビルドを落とす
  #   2 (測定できない)     -> 落とさないが、合格とも言わない
  accuracy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # **`--locked`: uv.lock が pyproject とずれていたら落とす**（#423）。
      # 無いと CI はずれを黙って直して緑になり、本番の deploy だけが
      # uv.lock の書き換えで止まる（v0.35.1 から 8 リリース気づかなかった）。
      - name: Sync dependencies
        run: uv sync --locked --extra dev

      - name: Measure agreement against instructor marking
        env:
          AIJUDGE_GOLDEN_DIR: ${{ vars.AIJUDGE_GOLDEN_DIR }}
          AIJUDGE_LLM_BASE_URL: ${{ vars.AIJUDGE_LLM_BASE_URL }}
        run: |
          set +e
          uv run aijudge-eval --subject cs_lang_c_intro --out accuracy.md
          code=$?
          set -e
          case $code in
            0) echo "::notice::Accuracy gates passed" ;;
            2) echo "::warning::Accuracy not measurable — no instructor marking available. This is not a pass." ;;
            *) echo "::error::Accuracy gates failed"; exit $code ;;
          esac

      - name: Publish the report
        if: always()
        run: cat accuracy.md >> "$GITHUB_STEP_SUMMARY" || true
