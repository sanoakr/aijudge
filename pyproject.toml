[project]
name = "aijudge"
version = "1.40.3"
description = "AI-assisted assessment platform for STEM coursework"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SANO Akira", email = "sano@maica.org" }]
requires-python = ">=3.12"
dependencies = [
    "aijudge-core",
    "aijudge-grading",
    "aijudge-authoring",
    "aijudge-eval-code-test-runner",
    "aijudge-llm-gateway",
    "aijudge-eval-rubric-ai-judge",
    "aijudge-observation",
    "aijudge-analytics",
    "aijudge-evalrunner",
    "aijudge-reviewconsole",
    "aijudge-sandbox",
    "aijudge-submission",
    # **本番の DB ドライバはここで入れる**（#428）。dev グループにしか無かった
    # ので、本番を dev 抜きで入れた瞬間に PostgreSQL へ接続できなくなる作りだった。
    "aijudge-persistence[postgres]",
    "aijudge-grader",
    "aijudge-identity",
    "aijudge-studentweb",
    "aijudge-feedback",
    "aijudge-admin",
    "aijudge-toolchain",
    "aijudge-eval-network-test-runner",
    "aijudge-ext-document-text",
    "aijudge-eval-checklist-ai-judge",
    "aijudge-eval-text-pattern-check",
    "aijudge-ext-image-text",
    "aijudge-eval-submission-compliance",
    "aijudge-skill",
    "aijudge-telemetry",
    "aijudge-audit",
    "aijudge-webui",
    "aijudge-webapp",
    "aijudge-unit-of-work",
    "aijudge-course-admin",
    "aijudge-ide",
    "aijudge-runner",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # CI はテストを並列に流す（`-n auto`）。worker ごとの DB は直下の `conftest.py`。
    "pytest-xdist>=3.6",
    "httpx>=0.27",
    "import-linter>=2.0",
    "ruff>=0.6",
    "mypy>=1.11",
    # `yaml` の型情報。`course_admin`（科目プロファイルの編集）が strict の mypy に掛かる。
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv.workspace]
members = ["packages/*", "evaluators/*", "extractors/*", "apps/*"]

[tool.uv.sources]
aijudge-core = { workspace = true }
aijudge-grading = { workspace = true }
aijudge-authoring = { workspace = true }
aijudge-eval-code-test-runner = { workspace = true }
aijudge-llm-gateway = { workspace = true }
aijudge-eval-rubric-ai-judge = { workspace = true }
aijudge-observation = { workspace = true }
aijudge-analytics = { workspace = true }
aijudge-evalrunner = { workspace = true }
aijudge-reviewconsole = { workspace = true }
aijudge-sandbox = { workspace = true }
aijudge-submission = { workspace = true }
aijudge-persistence = { workspace = true }
aijudge-grader = { workspace = true }
aijudge-identity = { workspace = true }
aijudge-studentweb = { workspace = true }
aijudge-feedback = { workspace = true }
aijudge-admin = { workspace = true }
aijudge-toolchain = { workspace = true }
aijudge-eval-network-test-runner = { workspace = true }
aijudge-ext-document-text = { workspace = true }
aijudge-eval-checklist-ai-judge = { workspace = true }
aijudge-eval-text-pattern-check = { workspace = true }
aijudge-ext-image-text = { workspace = true }
aijudge-eval-submission-compliance = { workspace = true }
aijudge-skill = { workspace = true }
aijudge-telemetry = { workspace = true }
aijudge-audit = { workspace = true }
aijudge-webui = { workspace = true }
aijudge-webapp = { workspace = true }
aijudge-unit-of-work = { workspace = true }
aijudge-course-admin = { workspace = true }
aijudge-ide = { workspace = true }
aijudge-runner = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001-003 は全角括弧・読点を「紛らわしい文字」として弾く。
# コメントは日本語で書く規約なので、このルールとは両立しない。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = [
    "aijudge_core",
    "aijudge_grading",
    "aijudge_authoring",
    "aijudge_eval_code_test_runner",
    "aijudge_llm_gateway",
    "aijudge_eval_rubric_ai_judge",
    "aijudge_observation",
    "aijudge_analytics",
    "aijudge_evalrunner",
    "aijudge_reviewconsole",
    "aijudge_sandbox",
    "aijudge_submission",
    "aijudge_persistence",
    "aijudge_grader",
    "aijudge_identity",
    "aijudge_studentweb",
    "aijudge_feedback",
    "aijudge_admin",
    "aijudge_toolchain",
    "aijudge_eval_network_test_runner",
    "aijudge_skill",
    "aijudge_telemetry",
    "aijudge_audit",
    "aijudge_webui",
    "aijudge_webapp",
    "aijudge_unit_of_work",
    "aijudge_course_admin",
    "aijudge_ide",
    "aijudge_runner",
]

[tool.pytest.ini_options]
# `tests` はどのパッケージにも属さない結合検証。**入れ忘れると走らない。**
# 実際に走っておらず、ADR 0009 で古くなったテストが 2 件気づかれずに残っていた。
testpaths = ["packages", "evaluators", "extractors", "apps", "evals", "tests"]
addopts = "-q"
# **`src` には降りない。** 本体に `test_cases.py`（テストケースを書く AI）があり、
# 名前だけで拾われていた。段階 3-2c で同じ名前のファイルが 2 つ（互換と移し先）に
# なり、収集が「import file mismatch」で落ちた。テストは必ず `tests/` に置く。
# 残りは pytest の既定の除外。
norecursedirs = [
    "src",
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
]

[tool.mypy]
python_version = "3.12"
strict = true

# boto3 はオブジェクトストレージを使うときだけの任意の依存（`s3` extra）で、
# 型の情報を持たない。入っていない環境でも型検査を通す。
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
docs = [
    "mkdocs-material>=9.5",
]
# 利用ガイドのスクリーンショット撮影（tools/guide_shots/）。ブラウザは
# `uv run --group guide-shots playwright install chromium` で別途入れる。
guide-shots = [
    "playwright>=1.50",
]
