[project]
name = "aijudge"
version = "0.8.0"
description = "AI-assisted assessment platform for STEM coursework"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SANO Akira", email = "sano@maica.org" }]
requires-python = ">=3.12"
dependencies = [
    "aijudge-core",
    "aijudge-grading",
    "aijudge-authoring",
    "aijudge-eval-code-test-runner",
    "aijudge-llm-gateway",
    "aijudge-eval-rubric-ai-judge",
    "aijudge-observation",
    "aijudge-analytics",
    "aijudge-evalrunner",
    "aijudge-reviewconsole",
    "aijudge-sandbox",
    "aijudge-submission",
    "aijudge-persistence",
    "aijudge-grader",
    "aijudge-identity",
    "aijudge-studentweb",
    "aijudge-feedback",
    "aijudge-admin",
    "aijudge-toolchain",
    "aijudge-eval-network-test-runner",
    "aijudge-norm-document-text",
    "aijudge-eval-report-structure",
    "aijudge-eval-submission-compliance",
    "aijudge-skill",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "import-linter>=2.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv.workspace]
members = ["packages/*", "evaluators/*", "normalizers/*", "apps/*"]

[tool.uv.sources]
aijudge-core = { workspace = true }
aijudge-grading = { workspace = true }
aijudge-authoring = { workspace = true }
aijudge-eval-code-test-runner = { workspace = true }
aijudge-llm-gateway = { workspace = true }
aijudge-eval-rubric-ai-judge = { workspace = true }
aijudge-observation = { workspace = true }
aijudge-analytics = { workspace = true }
aijudge-evalrunner = { workspace = true }
aijudge-reviewconsole = { workspace = true }
aijudge-sandbox = { workspace = true }
aijudge-submission = { workspace = true }
aijudge-persistence = { workspace = true }
aijudge-grader = { workspace = true }
aijudge-identity = { workspace = true }
aijudge-studentweb = { workspace = true }
aijudge-feedback = { workspace = true }
aijudge-admin = { workspace = true }
aijudge-toolchain = { workspace = true }
aijudge-eval-network-test-runner = { workspace = true }
aijudge-norm-document-text = { workspace = true }
aijudge-eval-report-structure = { workspace = true }
aijudge-eval-submission-compliance = { workspace = true }
aijudge-skill = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001-003 は全角括弧・読点を「紛らわしい文字」として弾く。
# コメントは日本語で書く規約なので、このルールとは両立しない。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = [
    "aijudge_core",
    "aijudge_grading",
    "aijudge_authoring",
    "aijudge_eval_code_test_runner",
    "aijudge_llm_gateway",
    "aijudge_eval_rubric_ai_judge",
    "aijudge_observation",
    "aijudge_analytics",
    "aijudge_evalrunner",
    "aijudge_reviewconsole",
    "aijudge_sandbox",
    "aijudge_submission",
    "aijudge_persistence",
    "aijudge_grader",
    "aijudge_identity",
    "aijudge_studentweb",
    "aijudge_feedback",
    "aijudge_admin",
    "aijudge_toolchain",
    "aijudge_eval_network_test_runner",
    "aijudge_skill",
]

[tool.pytest.ini_options]
# `tests` はどのパッケージにも属さない結合検証。**入れ忘れると走らない。**
# 実際に走っておらず、ADR 0009 で古くなったテストが 2 件気づかれずに残っていた。
testpaths = ["packages", "evaluators", "normalizers", "apps", "evals", "tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true

[dependency-groups]
dev = [
    "psycopg[binary]>=3.2",
    "pytest-asyncio>=1.4.0",
]
