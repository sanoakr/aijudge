# 開発・検証用のスタック。
#
#   docker compose up -d
#   AIJUDGE_DATABASE_URL=postgresql+psycopg://aijudge:aijudge@localhost:5432/aijudge \
#     uv run aijudge-web --create-schema
#
# **提出物はファイルシステムに置く**（`AIJUDGE_ARTIFACT_DIR`）。ここに
# オブジェクトストレージは無い ── 以前 MinIO を置いていたが、それを話す
# 実装が無く、立ち上げても一度も使われていなかった（#248）。要るのは
# **機械を分けたとき**であって、動画や画像を扱うからではない
# （`ArtifactStore` の注記）。
#
# **本番の構成ではない。** 認証情報がここに書いてあるのがその証拠で、
# 学内に出すなら Secret 管理と TLS 終端を前に置くこと。
#
# 採点ワーカーはここに入れていない。提出コードを実行するので、
# **Linux + コンテナで動かす**必要があり（ADR 0006）、その場合ワーカー自身が
# Docker を呼ぶ（docker-out-of-docker）。開発機では
# `AIJUDGE_SANDBOX=docker uv run aijudge-worker` をホスト側で動かす。
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aijudge
      POSTGRES_PASSWORD: aijudge
      POSTGRES_DB: aijudge
    # 締切前のバーストで接続が枯れないように。**`POSTGRES_MAX_CONNECTIONS`
    # という環境変数は公式イメージに無い** ── 渡しても既定の 100 のままで、
    # 設定したつもりで効いていなかった（#243 の作業中に実測）。
    command: ["postgres", "-c", "max_connections=200"]
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aijudge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
