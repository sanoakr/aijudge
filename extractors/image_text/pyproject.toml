[project]
name = "aijudge-ext-image-text"
version = "0.0.1"
description = "Extractor: read the text in a submitted image with a vision model"
requires-python = ">=3.12"
dependencies = [
    "aijudge-core",
    "aijudge-llm-gateway",
]

[project.entry-points."aijudge.extractors"]
image_text = "aijudge_ext_image_text:build"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_ext_image_text"]

[tool.uv.sources]
aijudge-core = { workspace = true }
aijudge-llm-gateway = { workspace = true }
