[project]
name = "aijudge-eval-template-diff-check"
version = "0.0.1"
description = "Deterministic evaluator: check that a submission changed nothing outside the marked region of the template"
requires-python = ">=3.12"
dependencies = [
    "aijudge-core",
    "aijudge-grading",
]

[project.entry-points."aijudge.evaluators"]
template_diff_check = "aijudge_eval_template_diff_check:build"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_eval_template_diff_check"]

[tool.uv.sources]
aijudge-core = { workspace = true }
aijudge-grading = { workspace = true }
