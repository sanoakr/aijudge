[project]
name = "aijudge-eval-c-indent-check"
version = "0.0.1"
description = "Deterministic evaluator: check that C source is indented by its brace nesting"
requires-python = ">=3.12"
dependencies = [
    "aijudge-core",
    "aijudge-grading",
]

[project.entry-points."aijudge.evaluators"]
c_indent_check = "aijudge_eval_c_indent_check:build"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_eval_c_indent_check"]

[tool.uv.sources]
aijudge-core = { workspace = true }
aijudge-grading = { workspace = true }
