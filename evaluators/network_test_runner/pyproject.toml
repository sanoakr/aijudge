[project]
name = "aijudge-eval-network-test-runner"
version = "0.0.1"
description = "Grade client and server exercises by running a companion process alongside the submission"
requires-python = ">=3.12"
dependencies = [
    "aijudge-core",
    "aijudge-grading",
    "aijudge-sandbox",
    "aijudge-toolchain",
]

[project.entry-points."aijudge.evaluators"]
network_test_runner = "aijudge_eval_network_test_runner:build"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_eval_network_test_runner"]

[tool.uv.sources]
aijudge-core = { workspace = true }
aijudge-grading = { workspace = true }
aijudge-sandbox = { workspace = true }
aijudge-toolchain = { workspace = true }
