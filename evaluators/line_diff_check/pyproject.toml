[project]
name = "aijudge-eval-line-diff-check"
version = "0.0.1"
description = "Deterministic evaluator: count the lines a submission changed from the code in the statement"
requires-python = ">=3.12"
dependencies = [
    "aijudge-core",
    "aijudge-grading",
]

[project.entry-points."aijudge.evaluators"]
line_diff_check = "aijudge_eval_line_diff_check:build"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_eval_line_diff_check"]

[tool.uv.sources]
aijudge-core = { workspace = true }
aijudge-grading = { workspace = true }
