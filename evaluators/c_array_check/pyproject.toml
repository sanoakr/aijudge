[project]
name = "aijudge-eval-c-array-check"
version = "0.0.1"
description = "Deterministic evaluator: check whether C source declares array variables"
requires-python = ">=3.12"
dependencies = [
    "aijudge-core",
    "aijudge-grading",
]

[project.entry-points."aijudge.evaluators"]
c_array_check = "aijudge_eval_c_array_check:build"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_eval_c_array_check"]

[tool.uv.sources]
aijudge-core = { workspace = true }
aijudge-grading = { workspace = true }
