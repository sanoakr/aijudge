[project]
name = "aijudge-eval-text-pattern-check"
version = "0.0.1"
description = "Deterministic evaluator: match declared patterns against the extracted text"
requires-python = ">=3.12"
dependencies = [
    "aijudge-core",
    "aijudge-grading",
]

[project.entry-points."aijudge.evaluators"]
text_pattern_check = "aijudge_eval_text_pattern_check:build"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_eval_text_pattern_check"]

[tool.uv.sources]
aijudge-core = { workspace = true }
aijudge-grading = { workspace = true }
