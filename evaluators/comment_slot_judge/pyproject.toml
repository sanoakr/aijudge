[project]
name = "aijudge-eval-comment-slot-judge"
version = "0.0.1"
description = "AI evaluator: judge the comment written at one place of a program against the instructor's examples"
requires-python = ">=3.12"
dependencies = [
    "aijudge-core",
    "aijudge-grading",
    "aijudge-llm-gateway",
]

[project.entry-points."aijudge.evaluators"]
comment_slot_judge = "aijudge_eval_comment_slot_judge:build"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_eval_comment_slot_judge"]

[tool.uv.sources]
aijudge-core = { workspace = true }
aijudge-grading = { workspace = true }
aijudge-llm-gateway = { workspace = true }
