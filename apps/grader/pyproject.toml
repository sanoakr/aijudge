[project]
name = "aijudge-grader"
version = "0.0.1"
description = "The grading worker: consumes queued jobs, runs the pipeline, publishes results"
requires-python = ">=3.12"
# 合成の中心（composition root）。S3 のキューと S5 のパイプラインを束ねる
# 唯一の層で、サブシステムどうしは互いを知らない（ADR 0001）。
dependencies = [
    "aijudge-core",
    "aijudge-grading",
    "aijudge-submission",
    "aijudge-authoring",
    "aijudge-persistence",
    "aijudge-skill",
    "aijudge-observation",
    "aijudge-feedback",
    "aijudge-telemetry",
    # **書かれていなかった依存**（段階 0-2）。`cli.py` が確定の根拠の素案を作るのに
    # `aijudge_admin.justification` を使っている。アプリがアプリを使うのは例外で
    # （`.importlinter` の apps-are-independent）、段階 3 で packages に移すと消える。
    "aijudge-admin",
]

[project.scripts]
aijudge-worker = "aijudge_grader.cli:main"
aijudge-relay = "aijudge_grader.relay_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_grader"]

[tool.uv.sources]
aijudge-core = { workspace = true }
aijudge-grading = { workspace = true }
aijudge-submission = { workspace = true }
aijudge-authoring = { workspace = true }
aijudge-persistence = { workspace = true }
aijudge-skill = { workspace = true }
aijudge-observation = { workspace = true }
aijudge-feedback = { workspace = true }
aijudge-admin = { workspace = true }
