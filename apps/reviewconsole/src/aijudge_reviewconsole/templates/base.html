<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}aiJudge レビュー{% endblock %}</title>
{# 見た目は `packages/webui` が 1 か所で持つ（#184）。以前はここに
   `<style>` として 410 行あり、その 95 規則が学習者側と重複していた。
   **`console.css` は `base.css` の「あと」に読む** ── 教員コンソールにしか
   出ない部品を足す側なので、順を変えると足したはずの規則が先に読まれる。
   `static_url` は接頭辞（`AIJUDGE_CONSOLE_ROOT_PREFIX`）を通す ── 忘れると
   `/console` の下で 404 になる（#165 で同じ忘れ方を出荷している）。 #}
<link rel="stylesheet" href="{{ static_url('base.css') }}">
<link rel="stylesheet" href="{{ static_url('console.css') }}">
{% include "_theme_boot.html" %}
</head>
<body>
{# 濃い頁の頭（#185）。**銘とパンくずを 1 つの帯にまとめ、貼り付ける。**
   以前は薄い面が 2 段に分かれていて、どちらもスクロールで消えていた ──
   88 名 × 7 問の一覧を送ると、いま何を見ているのか分からなくなる。

   帯そのものは署名の入っている人にしか出ない（ログイン画面には出す
   ものが無い）。中の文脈バナーは、コースの下にいるときだけ足される。 #}
{# 左の常設の帯（#189）。`rail` は context processor が全ページに配る
   （`rail_context.py`）── ハンドラは何も渡さない。集計に失敗した回は
   `rail` が来ないので、帯の無い 1 段の画面になる（それでも読める）。 #}
{% if rail is defined and rail %}
<div class="app">
{% include "_rail.html" %}
<div class="col">
{% endif %}
{% if me is defined and me %}
<div class="topbar">
<header class="top"><div class="inner">
  <a class="brand" href="{{ root_prefix() }}/">aiJudge</a>
  <span class="spacer"></span>
  <span>{{ me.display_name }}</span>
  {# SSO 利用者には出さない（#180）。Google で入った利用者のローカルパスワードは
     誰も知らない捨て値なので、この画面は「現在のパスワードが違います」しか
     返せない。出せば必ず行き止まりに導く。経路の側でも拒む
     （`manage.account_password_form`）── 隠すだけの画面は境界にならない。 #}
  {% if not me.is_external %}
  <a href="{{ root_prefix() }}/manage/account/password">パスワード変更</a>
  {% endif %}
  <form method="post" action="{{ root_prefix() }}/logout"><button type="submit">ログアウト</button></form>
</div></header>
{% set trail = trail if trail is defined and trail else () %}
{% if (course is defined and course) or trail %}
<div class="ctx"><div class="inner">
  {# **辿れる形で出す。** いまどのコースのどこを見ているかを示すだけでなく、
     一段上へ戻れること。コースコードと開講期はここでは出さない ── 画面の見出しで
     分かるものを二度出すと、肝心の経路が読み取りにくくなる。

     階層は 担当コース > コース > 区画 > 課題 > 提出。区画（`section`）は
     「コース全体の設定」「問題セット」「再確認の依頼」などで、コースのメニュー
     （/courses/{id}）から分岐した先を表す。

     **コースの下にない画面もここを通る**（#165）。利用者の一覧・科目プロファイル・
     Google ログイン設定はテナント単位で、コースを持たない ── 以前はこの節が
     まるごと `{% if course %}` の中にあったので、そういう画面には現在地が
     出ず、戻る導線が画面ごとに（上に・下に・無し、と）ばらばらだった。
     `trail` は `(label, href)` の並びで、`href` が無い段が現在地である。 #}
  <nav class="trail" aria-label="現在地">
    <a href="{{ root_prefix() }}/">担当コース</a>
    {% if course is defined and course %}
    <span class="sep">&gt;</span>
    <a href="{{ root_prefix() }}/courses/{{ course.id }}">{{ course.title }}</a>
    {% endif %}
    {% if section is defined and section %}
      <span class="sep">&gt;</span>
      {# 接頭辞つき配置（`AIJUDGE_CONSOLE_ROOT_PREFIX`）でも辿れるように。
         ここだけ `root_prefix()` が抜けていて、`/console` の下では区画への
         リンクが 404 になっていた。 #}
      <a href="{{ root_prefix() }}{{ section.href }}">{{ section.label }}</a>
    {% endif %}
    {% if task_meta is defined and task_meta %}
      <span class="sep">&gt;</span>
      <span>{{ task_meta.unit_label }}</span>
      <span class="sep">&gt;</span>
      <span>{{ task_meta.title }}</span>
    {% endif %}
    {% if submission is defined and submission %}
      <span class="sep">&gt;</span>
      <span aria-current="page">
        {%- if learner is defined and learner %}<span class="mono">{{ learner.login }}</span> {% endif -%}
        提出 {{ submission.attempt }} 回目
        {%- if submission.submitted_at %}（{{ submission.submitted_at.strftime('%Y-%m-%d %H:%M') }}）{% endif -%}
      </span>
    {% endif %}
    {% for step in trail %}
      <span class="sep">&gt;</span>
      {% if step.href %}
        <a href="{{ root_prefix() }}{{ step.href }}">{{ step.label }}</a>
      {% else %}
        <span aria-current="page">{{ step.label }}</span>
      {% endif %}
    {% endfor %}
  </nav>
</div></div>
{% endif %}
</div>{# .topbar #}
{% endif %}
{# 2 面の画面（採点）だけ広く使う。`{% block main_class %}wide{% endblock %}`。 #}
<main class="{% block main_class %}{% endblock %}">
{# デモコースの帯（#194）。**教員にも出す** ── 成績を探しに来た人が
   「ここには無い」と分かる必要がある。文言は学習者と同じものを使う
   （違うことを言われると、どちらが本当か確かめることになる）。 #}
{% if course is defined and course and is_demo_course(course.id) %}
{% include "_demo_banner.html" %}
{% endif %}
{% block body %}{% endblock %}</main>
<footer class="app-footer"><div class="inner">
  {% include "_theme_switch.html" %}
  <span>aiJudge {{ app_version }}{% if copyright_notice %} · {{ copyright_notice }}{% endif %}</span>
</div></footer>
{% if rail is defined and rail %}
</div>{# .col #}
</div>{# .app #}
{% endif %}
{# **モデルが動いているあいだ、動いていることを出す。** 生成は十数秒から
   数十秒かかり、何も出ないと押せていないのか固まったのか分からない。

   **二度押しを止めるのが本題である。** LLM の呼び出しはそのまま費用と
   待ち時間なので、押し直しは倍払って倍待つことになる。

   仕組みを 1 か所に置く。以前はテンプレートごとに `onsubmit` を書き写して
   おり、書き写しなので**新しい画面を足すたびに漏れた** ── 実際、いちばん
   時間の掛かる作問に付いていなかった。

   進捗率は出さない。何%まで進んだかを知る手段が無い（応答は一括で返る）
   ので、それらしい数字は根拠の無い表示になる。 #}
{# 破壊的な操作の確認。**画面共通の作法として 1 か所に置く**（#58）── 削除・
   取り下げ・移動が別々に確認を持つと、片方にだけ確認が無い日が来る。

   `confirm()` ではなく `<dialog>` を使うのは、何が起きるかを 2〜3 行で
   説明する必要があるため。ブラウザ標準のダイアログは題と本文を分けられず、
   「取り消せません」がどの操作の話なのか読み取れない。

   **JavaScript が無ければ確認は出ず、そのまま実行される。** 素の HTML で
   確認を挟むには画面をもう 1 枚増やすことになり、押す前の判断材料は
   フォームの説明文がすでに持っている。 #}
<dialog id="confirm-dialog">
  <form method="dialog">
    <h3 id="confirm-title" style="margin:0 0 8px"></h3>
    <p id="confirm-body" class="desc" style="margin:0 0 16px"></p>
    <div class="actions">
      <button value="cancel" id="confirm-cancel">やめる</button>
      <button value="ok" id="confirm-ok">実行</button>
    </div>
  </form>
</dialog>
<script>
document.querySelectorAll(".js-only").forEach(function (el) { el.hidden = false; });
document.querySelectorAll(".checkrow .nojs").forEach(function (el) { el.remove(); });

{# 提出できるファイル形式の、**群ごとの一括切り替え**。

   送信には出ない（`name` が無い）── 値は個々の選択だけである。

   **3 つ目の状態を持つ。** 一部だけ選んでいる群を「入」でも「切」でも
   なく `indeterminate` で示す ── どちらかに倒して出すと、押していない
   のに全部入る・全部消えるのどちらかが起きる。 #}
(function () {
  var rows = document.querySelectorAll(".checkrow");
  if (!rows.length) return;
  rows.forEach(function (row) {
    var all = row.querySelector(".groupall");
    if (!all) return;
    var boxes = row.querySelectorAll('.checks input[type=checkbox]');
    if (!boxes.length) return;

    function reflect() {
      var on = 0;
      boxes.forEach(function (b) { if (b.checked) on += 1; });
      all.checked = on === boxes.length;
      all.indeterminate = on > 0 && on < boxes.length;
    }
    all.addEventListener("change", function () {
      // `indeterminate` から押したときは「全部入れる」に倒す ── 中途半端な
      // 状態から押す人は、揃えたいのであって消したいのではない。
      var turnOn = all.checked;
      boxes.forEach(function (b) { b.checked = turnOn; });
      reflect();
    });
    boxes.forEach(function (b) { b.addEventListener("change", reflect); });
    reflect();
  });
})();

{# 行のどこを押しても開く。**リンクは消さない** ── これは JavaScript でしか
   作れないので、無ければ「開く」を辿ることになる。

   選択（ドラッグ）を潰さないよう、**押した位置から動いていたら開かない**。
   一覧の課題名をコピーしたい、は普通の操作である。 #}
(function () {
  var rows = document.querySelectorAll("tr.row-link[data-href]");
  if (!rows.length) return;
  rows.forEach(function (row) {
    row.setAttribute("data-clickable", "1");
    row.style.cursor = "pointer";
    var from = null;
    row.addEventListener("mousedown", function (event) {
      from = [event.clientX, event.clientY];
    });
    row.addEventListener("click", function (event) {
      // 行の中のリンクやボタンは、そちらの動きを優先する。
      if (event.target.closest("a, button, input, label")) return;
      if (from && Math.hypot(event.clientX - from[0], event.clientY - from[1]) > 4) return;
      // 修飾キーと中クリックは、ブラウザの「別タブで開く」に任せる。
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.button !== 0) return;
      window.location.href = row.getAttribute("data-href");
    });
  });
})();

(function () {
  var dialog = document.getElementById("confirm-dialog");
  if (!dialog || typeof dialog.showModal !== "function") return;

  // 押したものを覚えておき、「実行」で本来の動作に進む。
  function ask(source, then) {
    document.getElementById("confirm-title").textContent =
      source.getAttribute("data-confirm-title") || "実行しますか";
    document.getElementById("confirm-body").textContent =
      source.getAttribute("data-confirm") || "";
    var ok = document.getElementById("confirm-ok");
    // 取り消せない操作は見た目でも分ける。
    ok.className = source.getAttribute("data-confirm-danger") ? "danger" : "";
    dialog.returnValue = "cancel";
    dialog.addEventListener("close", function once() {
      dialog.removeEventListener("close", once);
      if (dialog.returnValue === "ok") then();
    });
    dialog.showModal();
    document.getElementById("confirm-cancel").focus();
  }

  document.addEventListener("submit", function (event) {
    var form = event.target;
    if (!(form instanceof HTMLFormElement)) return;
    if (!form.getAttribute("data-confirm") || form.dataset.confirmed) return;
    event.preventDefault();
    // **止めるのは 1 回だけ。** 印を付けてから改めて送る。
    ask(form, function () {
      form.dataset.confirmed = "1";
      form.requestSubmit ? form.requestSubmit() : form.submit();
    });
  }, true);

  // 欄を置き換えるだけのボタン（共通ルーブリックへの復元）。**保存はしない。**
  document.addEventListener("click", function (event) {
    var button = event.target.closest("[data-replace-target]");
    if (!button) return;
    var target = document.querySelector(button.getAttribute("data-replace-target"));
    var source = document.querySelector(button.getAttribute("data-replace-template"));
    if (!target || !source) return;
    event.preventDefault();
    ask(button, function () {
      target.replaceChildren(source.content.cloneNode(true));
    });
  });
})();

{# 問題文に貼る画像（#64）。**上げたらその場でカーソル位置に差し込む。**

   1 行を出して手で貼らせると、書きかけの問題文を置いてコースの設定画面まで
   往復することになり、その間に編集中の内容は失われる（課題の編集は 1 つの
   フォームで、保存するまで何も残らない）。

   課題の編集フォームの中にあるので、送信は入れ子のフォームではなく
   `fetch` で行う。**貼り付けだけで、課題は保存しない** ── 保存は「保存」で
   行う（#58 と同じ、押した瞬間に版が上がることを避ける）。

   仕組みはここに 1 か所だけ置く。エラーはサーバの文面をそのまま出す
   （決めつけた文面を書くと、言われたとおり確かめた教員は何も見つけられない・#52）。 #}
(function () {
  var box = document.querySelector("[data-image-upload]");
  if (!box || typeof FormData !== "function" || typeof fetch !== "function") return;
  var target = document.querySelector(box.getAttribute("data-image-target"));
  var file = box.querySelector("[data-image-file]");
  var alt = box.querySelector("[data-image-alt]");
  var status = box.querySelector("[data-image-status]");
  var error = box.querySelector("[data-image-error]");
  if (!target || !file) return;

  function say(text, busy) {
    if (error) { error.textContent = ""; error.hidden = true; }
    if (!status) return;
    status.textContent = text;
    status.hidden = !text;
    status.className = busy ? "flash reading" : "flash";
  }

  // **失敗は成功と同じ場所に出さない。** 成功の印は緑の ✓ で、そこに理由を
  // 出すと貼れなかったことが「貼れた」に見える（#52 と同じ誤り）。
  function fail(text) {
    if (status) { status.textContent = ""; status.hidden = true; }
    if (error) { error.textContent = text; error.hidden = false; }
    if (window.console) console.error("画像の貼り付けに失敗:", text);
  }

  // カーソル位置に差し込む。**画像は必ず 1 行として置く** ── 文の途中に
  // 入れると Markdown では段落の中の画像になり、前後の文と行が続いて出る。
  function paste(markdown) {
    var value = target.value;
    var start = target.selectionStart;
    var end = target.selectionEnd;
    if (typeof start !== "number") { start = value.length; end = value.length; }
    var before = value.slice(0, start);
    var after = value.slice(end);
    var head = before && !/\n\n$/.test(before) ? (before.slice(-1) === "\n" ? "\n" : "\n\n") : "";
    var tail = after && !/^\n/.test(after) ? "\n\n" : "\n";
    var inserted = head + markdown + tail;
    target.value = before + inserted + after;
    var caret = before.length + inserted.length;
    target.focus();
    target.setSelectionRange(caret, caret);
  }

  function send(blob, name) {
    var body = new FormData();
    body.append("upload", blob, name);
    body.append("alt", alt ? alt.value : "");
    say("画像を保存しています…", true);
    fetch(box.getAttribute("data-image-upload"), {
      method: "POST", body: body, credentials: "same-origin"
    }).then(function (response) {
      // **応答が JSON とは限らない。** 経路の間で落ちれば HTML が返る ──
      // そのときも「何が返ってきたか」を言う（黙って止まらない）。
      return response.text().then(function (body) {
        var data = null;
        try { data = JSON.parse(body); } catch (e) { data = null; }
        if (response.status === 404) {
          // **404 は「画像が悪い」ではない。** 受け口そのものが無い ── 画面の
          // 見た目はテンプレートから毎回読み直されるのに、経路は起動時にしか
          // 決まらないので、入れ替えたのに再起動していないと**この欄だけが
          // 先に新しくなる**。理由を言わないと画像を疑って延々と試すことになる。
          throw new Error(
            "画像の受け口が見つかりません（HTTP 404）。" +
            "この画面は新しいのに aijudge-review が古いまま動いている可能性があります — " +
            "サーバを再起動してからもう一度お試しください。"
          );
        }
        if (!response.ok || !data || !data.markdown) {
          throw new Error(
            (data && data.detail) || "画像を保存できませんでした（HTTP " + response.status + "）"
          );
        }
        return data;
      });
    }).then(function (data) {
      paste(data.markdown);
      say("問題文に貼り付けました。保存するまでは反映されません", false);
    }).catch(function (err) {
      fail(err.message || "画像を保存できませんでした");
    });
  }

  // **選んだファイルは消さない。** 消すと「もう一度押す」が何もしないボタンに
  // なり、貼れていないのか押せていないのかが画面から分からない。
  function fromInput() {
    if (file.files && file.files[0]) {
      send(file.files[0], file.files[0].name);
      return;
    }
    // まだ選んでいないなら、押した意味を持たせて選択を開く。
    file.click();
  }
  // 選んだ時点で送る。押し忘れた画像が課題文に入らないまま保存されるのを避ける。
  file.addEventListener("change", fromInput);
  var button = box.querySelector("[data-image-submit]");
  if (button) button.addEventListener("click", fromInput);

  // 画像をそのまま貼り付ける（クリップボード）。**課題文を書きながら
  // 画面を撮って貼る**のが実際の作り方で、ファイルに保存させる必要はない。
  target.addEventListener("paste", function (event) {
    var items = event.clipboardData && event.clipboardData.files;
    if (!items || !items.length) return;
    var blob = items[0];
    if (blob.type.indexOf("image/") !== 0) return;
    event.preventDefault();
    // **名前は種別から作る。** 貼り付けた画像のファイル名は当てにできず
    // （空だったり拡張子が無かったりする）、保存できる形式かは拡張子で決まる。
    var known = { "image/png": ".png", "image/jpeg": ".jpg", "image/gif": ".gif",
                  "image/webp": ".webp", "image/svg+xml": ".svg" };
    var suffix = known[blob.type];
    if (!suffix) { fail(blob.type + " は課題文に貼れません"); return; }
    var name = /\.[A-Za-z]+$/.test(blob.name || "") ? blob.name : "pasted" + suffix;
    send(blob, name);
  });
})();

{# 書きかけの問題文のプレビュー（#105）。**描画はサーバに任せる。**

   ブラウザの Markdown 実装を持ち込むと、普通の文章では一致し、間違いが
   起きるところ（数式・画像の幅・生 HTML の遮断）でだけ食い違う。それは
   プレビューではなく別の意見で、確かめたいことだけが確かめられない。

   **保存はしない。** 描いて返すだけで、版が上がるのは「保存」を押したとき
   （#58 と同じ、押した瞬間に版が上がることを避ける）。 #}
(function () {
  var button = document.querySelector("[data-preview-for]");
  if (!button || typeof fetch !== "function") return;
  var source = document.querySelector(button.getAttribute("data-preview-for"));
  var target = document.querySelector(button.getAttribute("data-preview-target"));
  var status = document.querySelector("[data-preview-status]");
  if (!source || !target) return;

  button.addEventListener("click", function () {
    var body = new FormData();
    body.append("statement", source.value);
    if (status) { status.textContent = "描画しています…"; status.className = "flash reading"; status.hidden = false; }
    fetch(button.getAttribute("data-preview-url"), {
      method: "POST", body: body, credentials: "same-origin"
    }).then(function (response) {
      return response.text().then(function (text) {
        if (!response.ok) throw new Error("プレビューを描けませんでした（HTTP " + response.status + "）");
        return text;
      });
    }).then(function (html) {
      target.innerHTML = html;
      if (status) {
        status.textContent = "いま書いている内容です（保存するまで版は上がりません）";
        status.className = "flash";
      }
    }).catch(function (err) {
      if (status) { status.textContent = err.message; status.className = "flash"; }
      if (window.console) console.error("プレビュー:", err);
    });
  });
})();

document.addEventListener("submit", function (event) {
  var form = event.target;
  if (!(form instanceof HTMLFormElement)) return;
  var message = form.getAttribute("data-working");
  if (!message || form.dataset.workingShown) return;
  form.dataset.workingShown = "1";
  form.querySelectorAll("button[type=submit], button:not([type])").forEach(function (button) {
    button.disabled = true;
  });
  var badge = form.querySelector(".working");
  if (!badge) {
    badge = document.createElement("span");
    badge.className = "working flash reading";
    var actions = form.querySelector(".actions") || form;
    actions.appendChild(badge);
  }
  badge.textContent = message;
  badge.hidden = false;
});
</script>
</body>
</html>
