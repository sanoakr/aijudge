{% extends "base.html" %}
{% block title %}パスワードを再発行しました — aiJudge{% endblock %}
{% block body %}
<h1>パスワードを再発行しました</h1>

<div class="card">
  <p><strong>このパスワードは今しか表示されません。</strong>
     この画面を閉じると、二度と取り出せません（再発行のみ可能）。</p>
  <div class="field">
    <label>ログイン ID</label>
    <p class="mono">{{ login }}</p>
  </div>
  <div class="field">
    <label>新しいパスワード</label>
    <p class="mono">{{ password }}</p>
  </div>
  <p class="desc">この利用者の既存のセッションはすべて切れています。</p>
</div>

<p class="crumb">
  <a href="{{ root_prefix() }}/manage/users/{{ user_id }}">この利用者の画面へ戻る</a>
  ・
  <a href="{{ root_prefix() }}/manage/users">ローカル利用者の一覧へ</a>
</p>
{% endblock %}
