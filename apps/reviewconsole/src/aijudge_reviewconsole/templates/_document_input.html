{# シラバスの本文を受け取る欄。基本情報と知識要素の 2 つの画面で使う。

   **本文そのものを受け取る。** 龍谷大学のシラバスは JavaScript で描画される
   ページで、URL を取得しても空の外枠しか返らない（実測 1815 バイト）。
   取りに行かないので、サーバが任意の URL を叩く経路も作らずに済む。 #}
<form method="post" action="{{ action }}" enctype="multipart/form-data" class="card"
      onsubmit="this.querySelector('.reading').hidden = false; this.querySelector('button').disabled = true">
  <div class="field">
    <label for="text">シラバスの本文（Markdown）</label>
    <textarea id="text" name="text" rows="14"
      placeholder="科目名／到達目標／授業計画（第 1 回 …）をそのまま貼り付けてください">{{ pasted or '' }}</textarea>
  </div>
  {# ファイルを選んだら、その場で読み取って上の欄に入れる。 #}
  <div class="inline-field">
    <span class="body">
      <label for="upload">または PDF・DOCX・テキストから読み取る（選んだ場合はそちらを使います）</label>
      <input id="upload" name="upload" type="file" accept=".pdf,.docx,.txt,.md">
    </span>
    <span class="reading flash" hidden>読み取り中…</span>
    <button type="submit">{{ action_label }}</button>
  </div>
  <p class="desc" style="margin:10px 0 0">
    読み取った本文は上の欄に Markdown として入ります（見出しと「第 N 回」を整えるだけで、
    中身は書き換えません）。<strong>スキャン画像の PDF は読めません。</strong>
  </p>
</form>
