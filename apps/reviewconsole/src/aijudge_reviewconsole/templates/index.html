{% extends "base.html" %}
{% block body %}
<h1>担当コース</h1>
<p class="crumb">採点は <code>aijudge-worker</code> が済ませています。ここでは確認して確定します。</p>

<table>
  <thead><tr><th>コード</th><th>コース</th><th>学期</th></tr></thead>
  <tbody>
  {% for course in courses %}
    <tr>
      <td class="mono">{{ course.code }}</td>
      <td><a href="/courses/{{ course.id }}">{{ course.title }}</a></td>
      <td>{{ course.term }}</td>
    </tr>
  {% else %}
    <tr><td colspan="3" class="desc">採点を担当しているコースがありません。</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
