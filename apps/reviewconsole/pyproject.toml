[project]
name = "aijudge-reviewconsole"
version = "0.0.1"
description = "Instructor review console and grading worker: grading runs before review, never because of it"
requires-python = ">=3.12"
dependencies = [
    "aijudge-core",
    "aijudge-authoring",
    "aijudge-grading",
    "aijudge-observation",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.scripts]
aijudge-review = "aijudge_reviewconsole.cli:main"
aijudge-grade = "aijudge_reviewconsole.cli:grade"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_reviewconsole"]

[tool.uv.sources]
aijudge-core = { workspace = true }
aijudge-authoring = { workspace = true }
aijudge-grading = { workspace = true }
aijudge-observation = { workspace = true }
