[project]
name = "aijudge-reviewconsole"
version = "0.0.1"
description = "Instructor review console: reads grading results, confirms grades. Never grades."
requires-python = ">=3.12"
dependencies = [
    "aijudge-core",
    "aijudge-authoring",
    "aijudge-grading",
    "aijudge-identity",
    "aijudge-submission",
    "aijudge-persistence",
    "aijudge-admin",
    "aijudge-audit",
    "aijudge-telemetry",
    "aijudge-webui",
    # 両アプリが共有する部品（フッター・相手の URL・動画の配信）。
    "aijudge-webapp",
    # IDE の作業の記録を読む（`activity.py`）。要約と欠けの計算だけを使う。
    "aijudge-ide",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.scripts]
aijudge-review = "aijudge_reviewconsole.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_reviewconsole"]

[tool.uv.sources]
aijudge-core = { workspace = true }
aijudge-authoring = { workspace = true }
aijudge-grading = { workspace = true }
aijudge-identity = { workspace = true }
aijudge-submission = { workspace = true }
aijudge-persistence = { workspace = true }
aijudge-admin = { workspace = true }
aijudge-ide = { workspace = true }
aijudge-webapp = { workspace = true }
