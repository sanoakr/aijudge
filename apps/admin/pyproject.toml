[project]
name = "aijudge-admin"
version = "0.0.1"
description = "Operator CLI: courses, enrolment, and task import. What a term needs before it starts. The business logic lives in aijudge-course-admin."
requires-python = ">=3.12"
dependencies = [
    "aijudge-core",
    "aijudge-audit",
    "aijudge-identity",
    "aijudge-authoring",
    "aijudge-grading",
    "aijudge-submission",
    "aijudge-persistence",
    "aijudge-telemetry",
    # 業務の処理（段階 3）。CLI はここを呼ぶだけ。
    "aijudge-course-admin",
]

[project.scripts]
aijudge-admin = "aijudge_admin.cli:main"
aijudge-finalize = "aijudge_admin.finalize_cli:main"
aijudge-similarity = "aijudge_admin.similarity_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_admin"]

[tool.uv.sources]
aijudge-course-admin = { workspace = true }
aijudge-core = { workspace = true }
aijudge-identity = { workspace = true }
aijudge-authoring = { workspace = true }
aijudge-grading = { workspace = true }
aijudge-submission = { workspace = true }
aijudge-persistence = { workspace = true }
