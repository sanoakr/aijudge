[project]
name = "aijudge-admin"
version = "0.0.1"
description = "Operator CLI: courses, enrolment, and task import. What a term needs before it starts."
requires-python = ">=3.12"
dependencies = [
    "aijudge-core",
    "aijudge-identity",
    "aijudge-authoring",
    "aijudge-grading",
    "aijudge-submission",
    "aijudge-persistence",
]

[project.scripts]
aijudge-admin = "aijudge_admin.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_admin"]

[tool.uv.sources]
aijudge-core = { workspace = true }
aijudge-identity = { workspace = true }
aijudge-authoring = { workspace = true }
aijudge-grading = { workspace = true }
aijudge-submission = { workspace = true }
aijudge-persistence = { workspace = true }
