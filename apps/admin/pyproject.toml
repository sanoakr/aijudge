[project]
name = "aijudge-admin"
version = "0.0.1"
description = "Operator CLI: courses, enrolment, and task import. What a term needs before it starts."
requires-python = ">=3.12"
dependencies = [
    "aijudge-core",
    "aijudge-identity",
    "aijudge-authoring",
    "aijudge-grading",
    "aijudge-submission",
    "aijudge-persistence",
    "aijudge-llm-gateway",
    # シラバスの PDF を読むため。抽出は採点側と同じものを使う
    # （別に実装すると、片方だけが壊れた PDF を読める差が出る）。
    "aijudge-norm-document-text",
]

[project.scripts]
aijudge-admin = "aijudge_admin.cli:main"
aijudge-finalize = "aijudge_admin.finalize_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_admin"]

[tool.uv.sources]
aijudge-core = { workspace = true }
aijudge-identity = { workspace = true }
aijudge-authoring = { workspace = true }
aijudge-grading = { workspace = true }
aijudge-submission = { workspace = true }
aijudge-persistence = { workspace = true }
aijudge-llm-gateway = { workspace = true }
