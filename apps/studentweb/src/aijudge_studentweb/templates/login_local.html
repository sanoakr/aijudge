{% extends "base.html" %}
{% block title %}ローカルログイン — aiJudge{% endblock %}
{% block body %}
<div class="narrow">
  <h1>aiJudge（ローカル）</h1>
  <p class="crumb">
    ローカル運用アカウント専用のログインです。
    通常は <a href="/login">大学アカウントでのログイン</a>を使ってください。
  </p>
  {% if error %}<div class="note warn">{{ error }}</div>{% endif %}
  <form method="post" action="/auth/local" class="card">
    <div class="field">
      <label for="login">学籍番号 / ID</label>
      <input id="login" name="login" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">パスワード</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <div class="actions"><button type="submit">ログイン</button></div>
  </form>
</div>
{% endblock %}
