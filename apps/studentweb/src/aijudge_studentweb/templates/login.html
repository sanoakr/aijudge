{% extends "base.html" %}
{% block title %}ログイン — aiJudge{% endblock %}
{% block body %}
<div class="narrow">
  <h1>aiJudge</h1>
  <p class="crumb">学籍番号とパスワードでログインします。</p>
  {% if error %}<div class="note warn">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="card">
    <div class="field">
      <label for="login">学籍番号</label>
      <input id="login" name="login" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">パスワード</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit">ログイン</button>
  </form>
</div>
{% endblock %}
