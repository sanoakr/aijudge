{% extends "base.html" %}
{% block title %}ログイン — aiJudge{% endblock %}
{% block body %}
<div class="narrow">
  <h1>aiJudge</h1>
  {% if error %}<div class="note warn">{{ error }}</div>{% endif %}
  {% if google_configured %}
  <form method="get" action="/auth/login" class="card">
    <div class="actions"><button type="submit">大学アカウントでログイン</button></div>
  </form>
  {% else %}
  <div class="note warn">
    大学アカウントでのログインはまだ設定されていません。管理者にお問い合わせください。
  </div>
  {% endif %}
</div>
{% endblock %}
