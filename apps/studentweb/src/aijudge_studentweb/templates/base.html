<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}aiJudge{% endblock %}</title>
{# 見た目は `packages/webui` が 1 か所で持つ（#184）。以前はここに
   `<style>` として 239 行あり、その 95 規則が教員コンソール側と重複していた。

   **`learner.css` は `base.css` の「あと」に読む** ── 学習者の画面にしか
   出ない部品を足す側なので、順を変えると足したはずの規則が先に読まれる。
   共有分と分けてあるのは配信量のためではなく、**当たる規則を切り出し前と
   同じに保つため**（`base.css` 冒頭）。

   `?v=` は版でキャッシュを外すため ── 付けないと配置し直したのに前の CSS が
   使われ、症状は「配置に失敗した」ように見える。 #}
<link rel="stylesheet" href="{{ static_url('base.css') }}">
<link rel="stylesheet" href="{{ static_url('learner.css') }}">
{% include "_theme_boot.html" %}
</head>
<body>
{# 濃い頁の頭（#185）。**銘とパンくずを 1 つの帯にまとめ、貼り付ける。**
   以前は薄い面が 2 段に分かれていて、どちらもスクロールで消えていた ──
   88 名 × 7 問の一覧を送ると、いま何を見ているのか分からなくなる。

   帯そのものは署名の入っている人にしか出ない（ログイン画面には出す
   ものが無い）。中の文脈バナーは、コースの下にいるときだけ足される。 #}
{% if me is defined and me %}
<div class="topbar">
<header class="top"><div class="inner">
  <a class="brand" href="/">aiJudge</a>
  <span class="spacer"></span>
  <span>{{ me.display_name }} <span class="mono">{{ me.login }}</span></span>
  <form method="post" action="/logout"><button type="submit">ログアウト</button></form>
</div></header>
{% if ctx_course is defined and ctx_course %}
<div class="ctx"><div class="inner">
  {# **辿れる形で出す。** どのコースの何回目のどの課題を見ているかを示すだけでなく、
     一段上へ戻れること。コースコードと開講期はここでは出さない ── 画面の見出しで
     分かるものを二度出すと、肝心の経路が読み取りにくくなる。 #}
  <nav class="trail" aria-label="現在地">
    <a href="/">コース一覧</a>
    <span class="sep">&gt;</span>
    <a href="/courses/{{ ctx_course.id }}">{{ ctx_course.title }}</a>
    {% if ctx_task %}
      <span class="sep">&gt;</span>
      <a href="/courses/{{ ctx_course.id }}">{{ ctx_task.unit_label }}</a>
      <span class="sep">&gt;</span>
      <a href="/tasks/{{ ctx_version.id }}">{{ ctx_task.title }}</a>
    {% endif %}
    {% if ctx_submission %}
      <span class="sep">&gt;</span>
      <span aria-current="page">提出 {{ ctx_submission.attempt }} 回目{% if ctx_submission.submitted_at %}（{{ ctx_submission.submitted_at.strftime('%Y-%m-%d %H:%M') }}）{% endif %}</span>
    {% endif %}
  </nav>
</div></div>
{% endif %}
</div>{# .topbar #}
{% endif %}
<main>{% block body %}{% endblock %}</main>
<footer class="app-footer"><div class="inner">
  {% include "_theme_switch.html" %}
  <span>aiJudge {{ app_version }}{% if copyright_notice %} · {{ copyright_notice }}{% endif %}</span>
</div></footer>
{# 採点待ちのあいだだけ状態を問い合わせ、終わったら 1 回だけ取り直す。
   **JavaScript 無しでも困らない** ── 無ければ `<noscript>` の案内が出て、
   従来どおり手で再読み込みできる（この画面群の作法・`manage.py` 冒頭）。

   間隔は伸ばしていく。締切前は同じ画面を 90 名が開くので、固定の短い間隔で
   叩くと、採点そのものに使う分の接続を奪う。 #}
<script>
// JavaScript でしか動かない表示を出す。**片方の機能に紐づけない** ──
// 採点待ちのない画面ではカウントダウンが隠れたままになる。
document.querySelectorAll(".js-only").forEach(function (el) { el.hidden = false; });

{# 行のどこを押しても開く。**リンクは消さない** ── これは JavaScript でしか
   作れないので、無ければ「開く」を辿ることになる。

   選択（ドラッグ）を潰さないよう、**押した位置から動いていたら開かない**。
   一覧の課題名をコピーしたい、は普通の操作である。 #}
(function () {
  var rows = document.querySelectorAll("tr.row-link[data-href]");
  if (!rows.length) return;
  rows.forEach(function (row) {
    row.setAttribute("data-clickable", "1");
    row.style.cursor = "pointer";
    var from = null;
    row.addEventListener("mousedown", function (event) {
      from = [event.clientX, event.clientY];
    });
    row.addEventListener("click", function (event) {
      // 行の中のリンクやボタンは、そちらの動きを優先する。
      if (event.target.closest("a, button, input, label")) return;
      if (from && Math.hypot(event.clientX - from[0], event.clientY - from[1]) > 4) return;
      // 修飾キーと中クリックは、ブラウザの「別タブで開く」に任せる。
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.button !== 0) return;
      window.location.href = row.getAttribute("data-href");
    });
  });
})();

{# 締切までの残り（#73）。**サーバが渡した秒数から数える** ── 学習者の PC の
   時計と締切を比べると、数分のずれがそのまま「あと 3 分」と表示されながら
   サーバは遅延と判定する、という食い違いになる。

   **1 分を切ったら秒単位。** それまでは分単位で、更新も 15 秒に 1 回で足りる
   ── 締切前は同じ画面を 90 名が開いている。 #}
(function () {
  var fields = document.querySelectorAll("[data-deadline-in]");
  if (!fields.length) return;
  var loaded = Date.now();

  function label(left, state) {
    // 締切を過ぎたら**カウントアップ**に切り替える。「出せなくなった」と
    // 読ませないよう、減点提出できることは文言のほうで言う。
    var over = left < 0;
    var s = Math.abs(left);
    var text;
    if (s < 60) {
      text = s + " 秒";
    } else if (s < 3600) {
      text = Math.floor(s / 60) + " 分";
    } else if (s < 86400) {
      text = Math.floor(s / 3600) + " 時間 " + Math.floor((s % 3600) / 60) + " 分";
    } else {
      text = Math.floor(s / 86400) + " 日 " + Math.floor((s % 86400) / 3600) + " 時間";
    }
    if (state === "closed") return "受付終了";
    return over ? "締切から " + text + " 経過" : "残り " + text;
  }

  function tick() {
    var elapsed = Math.floor((Date.now() - loaded) / 1000);
    var soon = false;
    fields.forEach(function (el) {
      var left = parseInt(el.getAttribute("data-deadline-in"), 10) - elapsed;
      el.textContent = label(left, el.getAttribute("data-state"));
      if (Math.abs(left) < 60) soon = true;
    });
    // 分表示のあいだは 15 秒に 1 回で足りる。
    window.setTimeout(tick, soon ? 1000 : 15000);
  }
  tick();
})();

(function () {
  var note = document.querySelector("[data-poll]");
  if (!note) return;
  var url = note.getAttribute("data-poll");
  var queueEl = note.querySelector("[data-queue]");
  var wait = 2000;
  var LIMIT = 15000;
  function fmtEta(sec) {
    if (sec == null) return "";
    if (sec < 60) return "1 分未満";
    return "約 " + Math.round(sec / 60) + " 分";
  }
  function showQueue(state) {
    if (!queueEl) return;
    if (state.queue_position == null) { queueEl.hidden = true; return; }
    var parts = [];
    if (state.queue_position > 0) parts.push("あなたの前に " + state.queue_position + " 件");
    else parts.push("まもなく開始");
    var eta = fmtEta(state.eta_seconds);
    if (eta) parts.push("目安 " + eta);
    queueEl.textContent = "（" + parts.join(" ・ ") + "）";
    queueEl.hidden = false;
  }
  function tick() {
    fetch(url, { headers: { "Accept": "application/json" } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (state) {
        // 応答が読めないときは諦めて案内を残す。黙って回し続けない。
        if (!state) return;
        if (!state.working) { window.location.reload(); return; }
        showQueue(state);
        wait = Math.min(Math.round(wait * 1.5), LIMIT);
        window.setTimeout(tick, wait);
      })
      .catch(function () { /* 通信が切れただけ。次の機会に任せる。 */ });
  }
  window.setTimeout(tick, wait);
})();
</script>
</body>
</html>
