[project]
name = "aijudge-studentweb"
version = "0.0.1"
description = "The learner-facing web app: submit work, see results"
requires-python = ">=3.12"
dependencies = [
    "aijudge-core",
    "aijudge-identity",
    "aijudge-submission",
    "aijudge-authoring",
    "aijudge-persistence",
    # 科目プロファイルを読むためだけ（画像が書き起こされる課題かを提出画面に
    # 出す）。採点は呼ばない ── 採点はワーカーの仕事で、ここは読むだけ。
    "aijudge-grading",
    # 習熟度の読み出し形（#335）。**推定は呼ばない** ── 使うのは
    # `portfolio`（保存されている状態を画面が読める形に畳むだけ）。
    "aijudge-skill",
    "aijudge-telemetry",
    "aijudge-webui",
    # ブラウザ IDE（`ide.py`）。実行の要求を積み、自動保存を読み書きする。
    # **sandbox は依存に入れない** ── web はコードを動かさない（不変条件 I6）。
    "aijudge-ide",
    # IDE で実行できる形式を、採点の言語から決めるため（言語の表だけを読む）。
    "aijudge-toolchain",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[project.scripts]
aijudge-web = "aijudge_studentweb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_studentweb"]

[tool.uv.sources]
aijudge-core = { workspace = true }
aijudge-identity = { workspace = true }
aijudge-submission = { workspace = true }
aijudge-authoring = { workspace = true }
aijudge-persistence = { workspace = true }
aijudge-grading = { workspace = true }
aijudge-skill = { workspace = true }
aijudge-ide = { workspace = true }
aijudge-toolchain = { workspace = true }
