[project]
name = "aijudge-studentweb"
version = "0.0.1"
description = "The learner-facing web app: submit work, see results"
requires-python = ">=3.12"
dependencies = [
    "aijudge-core",
    "aijudge-identity",
    "aijudge-submission",
    "aijudge-authoring",
    "aijudge-persistence",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[project.scripts]
aijudge-web = "aijudge_studentweb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_studentweb"]

[tool.uv.sources]
aijudge-core = { workspace = true }
aijudge-identity = { workspace = true }
aijudge-submission = { workspace = true }
aijudge-authoring = { workspace = true }
aijudge-persistence = { workspace = true }
