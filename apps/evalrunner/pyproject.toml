[project]
name = "aijudge-evalrunner"
version = "0.0.1"
description = "Read recorded observations and measure grading accuracy. Never grades."
requires-python = ">=3.12"
# 依存はこれだけ。core も grading も入らない = 測定に採点の語彙が要らない
# （ADR 0007）。ここに採点側のパッケージが増えたら、測定が採点に依存し始めた
# 兆候なので設計を見直す。
dependencies = [
    "aijudge-analytics",
    "aijudge-observation",
    "pyyaml>=6.0",
]

[project.scripts]
aijudge-eval = "aijudge_evalrunner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_evalrunner"]

[tool.uv.sources]
aijudge-analytics = { workspace = true }
aijudge-observation = { workspace = true }
