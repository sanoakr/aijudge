[project]
name = "aijudge-evalrunner"
version = "0.0.1"
description = "Measure agreement between instructor marking and AI grading, against PoC gates"
requires-python = ">=3.12"
dependencies = [
    "aijudge-core",
    "aijudge-analytics",
    "aijudge-authoring",
    "aijudge-grading",
    "pyyaml>=6.0",
]

[project.scripts]
aijudge-eval = "aijudge_evalrunner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_evalrunner"]

[tool.uv.sources]
aijudge-core = { workspace = true }
aijudge-analytics = { workspace = true }
aijudge-authoring = { workspace = true }
aijudge-grading = { workspace = true }
