# /etc/systemd/journald.conf.d/aijudge.conf に置く。
#
# **unit 側ではなくここに置く。** 保存期間とディスク使用量は journald 全体の
# 設定で、サービスごとには決められない。unit 側にあるのは
# `SyslogIdentifier` だけ（どの行がどのサービスかを引くため）。
#
# 90 日は「学期の途中で振り返れる」長さとして採った。**成績に関わる
# 「誰が何を変えたか」はここには無い** ── それは DB の監査ログに append-only で
# 残り、restic の DB ダンプで守られる（ADR 0016）。運用ログは消えてよい層である。
#
# 反映:
#     sudo install -m 0644 /opt/aijudge/deploy/journald/aijudge.conf \
#         /etc/systemd/journald.conf.d/aijudge.conf
#     sudo systemctl restart systemd-journald

[Journal]
Storage=persistent
MaxRetentionSec=90d
SystemMaxUse=2G
SystemMaxFileSize=128M
