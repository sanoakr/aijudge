# スキーマ移行の設定。
#
# **接続先はここに書かない。** `migrations/env.py` が
# `aijudge_persistence.database_url()` から取る ── アプリと同じ場所から
# 取らないと、移行を当てた先とアプリが読む先がずれる。
[alembic]
script_location = packages/persistence/src/aijudge_persistence/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
