[project]
name = "aijudge-toolchain"
version = "0.0.1"
description = "How to build and run a submission in a given language. Shared by evaluators, depends on nothing."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_toolchain"]
