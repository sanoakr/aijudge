[project]
name = "aijudge-identity"
version = "0.0.1"
description = "Minimal local authentication, courses, and enrolment (S1)"
requires-python = ">=3.12"
dependencies = [
    "aijudge-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_identity"]

[tool.uv.sources]
aijudge-core = { workspace = true }
