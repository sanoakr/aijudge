[project]
name = "aijudge-sandbox"
version = "0.0.1"
description = "Isolated execution of untrusted submissions (S4)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_sandbox"]
