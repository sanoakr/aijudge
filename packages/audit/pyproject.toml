[project]
name = "aijudge-audit"
version = "0.0.1"
description = "The audit record: who changed something that reaches a grade"
requires-python = ">=3.12"
# core は識別子と役割のためだけに要る。**保存先は知らない** ── 実装は
# インメモリと persistence の 2 つあり、同じテストが両方に通る。
dependencies = [
    "aijudge-core",
    "pydantic>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_audit"]
