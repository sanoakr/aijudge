[project]
name = "aijudge-webapp"
version = "0.0.1"
description = "Parts both web apps share: footer, counterpart URL, video streaming, the request principal"
requires-python = ">=3.12"
# `webui` は資産だけを持ち依存を持たない約束なので、HTTP を知る共有部品は
# こちらに置く（docs/design/staged-refactor.md §2）。**保存層は入れない** ──
# 部品は受け取った store や要求を扱うだけで、どこから来たかは合成ルートが決める。
dependencies = [
    "aijudge-core",
    # 動画の Range 配信（`parse_range`・`iter_file`・`StreamingArtifactStore`）。
    "aijudge-submission",
    # 主体の型（`Principal`）。解決そのもの（保存先を開く）はアプリが渡す。
    "aijudge-identity",
    "fastapi>=0.115",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_webapp"]

[tool.uv.sources]
aijudge-core = { workspace = true }
aijudge-submission = { workspace = true }
aijudge-identity = { workspace = true }
