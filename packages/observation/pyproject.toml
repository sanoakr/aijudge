[project]
name = "aijudge-observation"
version = "0.0.1"
description = "The observation record: what grading and review leave behind for measurement to read"
requires-python = ">=3.12"
# 依存はこれだけ。記録の形式だけを持ち、採点も測定も知らない。
dependencies = [
    "pydantic>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_observation"]
