[project]
name = "aijudge-telemetry"
version = "0.0.1"
description = "Operational logging: how the processes say what happened, in one shape"
requires-python = ">=3.12"
# 依存は無い。標準 logging の設定だけを持ち、採点も保存先も科目も知らない。
# ここに依存が増えるのは、運用ログが業務の語彙を持ち始めた兆候。
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_telemetry"]
