[project]
name = "aijudge-submission"
version = "0.0.1"
description = "Submission intake, artifact storage, and grading job orchestration (S3)"
requires-python = ">=3.12"
# 採点エンジン（S5）に依存しない。S3 → S5 はイベント経由で、
# 両者を束ねるのは app 層（合成の中心）の責務（ADR 0001）。
dependencies = [
    "aijudge-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_submission"]

[tool.uv.sources]
aijudge-core = { workspace = true }
