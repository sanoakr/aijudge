[project]
name = "aijudge-grading"
version = "0.0.1"
description = "Subject-agnostic grading pipeline, evaluator registry, and subject profile loader (S5)"
requires-python = ">=3.12"
dependencies = [
    "aijudge-core",
    "aijudge-observation",
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_grading"]

[tool.uv.sources]
aijudge-core = { workspace = true }
aijudge-observation = { workspace = true }
