[project]
name = "aijudge-feedback"
version = "0.0.1"
description = "Turn grading results into the learner's next step, not an explanation of the score"
requires-python = ">=3.12"
# 評価器と同じ依存の形。core と S6 だけ。採点エンジンも保存先も知らない。
dependencies = [
    "aijudge-core",
    "aijudge-llm-gateway",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_feedback"]

[tool.uv.sources]
aijudge-core = { workspace = true }
aijudge-llm-gateway = { workspace = true }
