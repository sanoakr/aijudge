[project]
name = "aijudge-webui"
version = "0.0.1"
description = "The shared look of the web screens: one stylesheet, one theme switch"
requires-python = ">=3.12"
# 依存は無い。ファイルとそこへのパスだけを持ち、**配り方は知らない**。
# ここに fastapi が入るのは、見た目の資産が「どう配信されるか」を決め始めた
# 兆候。mount するのは合成ルート（apps/*）の仕事である。
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_webui"]
