[project]
name = "aijudge-core"
version = "0.0.1"
description = "Subject-agnostic domain model and event contracts shared by every aiJudge subsystem"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_core"]
