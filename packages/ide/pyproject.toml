[project]
name = "aijudge-ide"
version = "0.0.1"
description = "The browser IDE: run requests, their queue, and the checks at the door"
requires-python = ">=3.12"
# core は識別子と日時の約束のためだけに要る。**sandbox は知らない** ──
# コードを動かすのは合成ルートの runner だけ（ADR 0024、`ide-does-not-run-code`）。
# 保存先も知らない。実装はインメモリと persistence の 2 つあり、同じテストが
# 両方に通る。
dependencies = [
    "aijudge-core",
    "pydantic>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_ide"]

[tool.uv.sources]
aijudge-core = { workspace = true }
