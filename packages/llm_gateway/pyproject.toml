[project]
name = "aijudge-llm-gateway"
version = "0.0.1"
description = "Provider abstraction, policy routing, structured output and prompt versioning for LLM calls (S6)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_llm_gateway"]
