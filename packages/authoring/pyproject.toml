[project]
name = "aijudge-authoring"
version = "0.0.1"
description = "Task, rubric and test case authoring, plus importers for existing course assets (S2)"
requires-python = ">=3.12"
dependencies = [
    "aijudge-core",
    "latex2mathml>=3.77",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_authoring"]

[tool.uv.sources]
aijudge-core = { workspace = true }
