[project]
name = "aijudge-course-admin"
version = "0.0.1"
description = "Course administration: the business operations behind the admin CLI and the console"
requires-python = ">=3.12"
# コース運営の業務処理の移し先（docs/design/staged-refactor.md 段階 3）。いまの
# `apps/admin` の中身を葉から順に移す。**保存層は入れない** ── 保存先は
# `aijudge_unit_of_work` の Protocol 越しに受け取る（契約
# `subsystems-do-not-know-the-store`）。依存は移すものに合わせて足していく。
dependencies = [
    "aijudge-core",
    "aijudge-authoring",
    "aijudge-llm-gateway",
    # 答え方を `editor` にしてよいかの検査（`answer_mode`）で、エディタで書ける
    # 形式の表を読む。
    "aijudge-ide",
    # シラバスの PDF を読む（`syllabus`）。抽出は採点側と同じものを使う
    # （別に実装すると、片方だけが壊れた PDF を読める差が出る）。
    "aijudge-ext-document-text",
    # 課題の検査（`task_verifier`）で、参照解答と変異を採点の評価器に通す。
    "aijudge-grading",
    # 名簿の変更は監査に残す（`groups`・ADR 0016）。
    "aijudge-audit",
    # 保存先は Protocol 越しに受け取る（段階 3-3b・契約 `unit-of-work-is-for-the-apps` の例外）。
    "aijudge-unit-of-work",
    # コースの削除で動画の保存先を片付ける（`courses`）。
    "aijudge-submission",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aijudge_course_admin"]

[tool.uv.sources]
aijudge-core = { workspace = true }
aijudge-authoring = { workspace = true }
aijudge-llm-gateway = { workspace = true }
aijudge-ide = { workspace = true }
aijudge-ext-document-text = { workspace = true }
aijudge-grading = { workspace = true }
aijudge-audit = { workspace = true }
aijudge-unit-of-work = { workspace = true }
aijudge-submission = { workspace = true }
